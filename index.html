const units=[{"id": "process", "no": "01", "title": "자료를 읽고 정리하는 순서", "sub": "자료 모으기 → 정리하기 → 살펴보기 → 설명하기", "tag": "가이드 예시 1", "intro": "표를 받으면 무엇부터 해야 할까요? 틀리거나 비어 있는 값을 먼저 확인하고, 그다음 계산하면 됩니다.", "cards": [["분석이라는 말은 무슨 뜻인가요?", "<p><b>자료를 보고 궁금한 점의 답을 찾는 것</b>입니다. 예를 들어 “어느 시설에서 예약하고 안 오는 사람이 많을까?”를 알아보는 일입니다. 예약하고 오지 않는 것을 <b>노쇼</b>라고 합니다.</p><div class=\"example\">① 예약 자료를 모읍니다.<br>② 빈칸이나 잘못 적힌 값을 정리합니다.<br>③ 시설별로 노쇼가 몇 건인지 셉니다.<br>④ 그래프로 보여줍니다.<br>⑤ 어느 시설부터 점검할지 설명합니다.</div>"], ["시험에 나오는 말과 연결해보세요", "<table><tr><th>시험 용어</th><th>쉬운 뜻</th></tr><tr><td>수집</td><td>자료 모으기</td></tr><tr><td>정제</td><td>빈칸·잘못된 값 정리하기</td></tr><tr><td>탐색적 분석</td><td>합계·평균·특징을 살펴보기</td></tr><tr><td>시각화</td><td>그래프로 보여주기</td></tr><tr><td>해석</td><td>결과가 무슨 뜻인지 설명하기</td></tr></table><p>가이드 예시에서는 <b>수집 → 정제 → 탐색적 분석 → 시각화 → 해석</b>을 고르면 됩니다.</p>"], ["숫자처럼 보여도 계산하는 값이 아닐 수 있어요", "<p>예산 30억원과 50억원은 평균을 낼 수 있습니다. 하지만 기관번호 01과 02를 평균 내는 것은 보통 의미가 없습니다. 기관번호는 <b>이름표</b>처럼 기관을 구분하는 값입니다.</p><p>“01”을 “1”로 바꾸면 다른 표와 연결할 때 문제가 생길 수 있습니다. 번호의 앞에 붙은 0도 확인하세요.</p>"]], "take": "자료를 모으고 → 정리하고 → 살펴보고 → 그래프로 보여주고 → 뜻을 설명합니다.", "terms": [["데이터 분석", "자료를 정리·계산해 질문에 대한 답과 의미를 찾는 과정.", "시설별 예약 자료로 노쇼가 많은 시설 찾기.", "분석 개념 · 엑셀·Python 등에서 적용"], ["수집", "분석에 필요한 자료를 확보하는 단계.", "예약 내역 CSV 내려받기.", "분석 단계 · 자료를 확보할 때"], ["정제 / 전처리", "계산할 수 있도록 결측·오류·중복 등을 정리하는 작업.", "빈 값과 음수 대기일 확인하기.", "분석 작업 · 엑셀·Python에서 자료 정리"], ["탐색적 분석 (EDA)", "분포·요약 통계·변수 간 관계 등 자료의 특징을 살펴보는 분석.", "시설별 평균과 노쇼 건수 비교하기.", "분석 방법 · 통계·그래프로 자료를 살필 때"], ["시각화", "자료나 계산 결과를 그래프 등으로 표현하는 작업.", "분야별 사업 수를 막대그래프로 표시하기.", "표현 작업 · 엑셀·Python의 그래프 기능"], ["해석", "분석 결과의 의미와 업무에 적용할 내용을 설명하는 단계.", "노쇼율이 높은 시설의 예약 절차 점검 제안하기.", "분석 단계 · 보고서와 업무 판단에 사용"], ["수치형 / 범주형", "수치형은 크기를 계산할 수 있는 값, 범주형은 종류를 구분하는 값.", "예산·처리일수 / 회의실·체육관.", "자료의 종류 · 표를 읽고 변수 성격을 정할 때"], ["식별자", "대상을 구분하기 위한 번호나 이름. 평균 계산 대상과 구분한다.", "기관코드 01, 02.", "자료의 역할 · 기관·사람 등을 구분할 때"]], "exampleSource": {"topic": "가이드의 공개 예시와 연결된 개념입니다. 이 단원의 모든 용어가 공개 예시에 직접 나왔다는 뜻은 아닙니다.", "example": "작은 숫자·과일·A/B 자료와 아래 개념도는 이해를 돕기 위해 새로 만든 설명용 예시입니다. 원문 정답 수치가 아닙니다.", "noshow": true}, "diagrams": [{"id": "process-1", "title": "자료 분석의 순서", "caption": "자료를 모은 뒤 정리하고, 계산 결과를 보여준 다음 의미를 설명합니다.", "html": "<div class=\"map-flow\"><div class=\"map-node \"><strong>수집</strong><span>자료 모으기</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>정제</strong><span>빈칸·오류 정리</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>탐색</strong><span>특징 살펴보기</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>시각화</strong><span>그래프로 보기</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>해석</strong><span>업무 의미 설명</span></div></div>"}, {"id": "process-2", "title": "자료의 뜻에 따라 나누기", "caption": "숫자로 적혀 있어도 기관번호는 계산할 값이 아니라 식별자일 수 있습니다.", "html": "<div class=\"map-root\"><div class=\"map-node \"><strong>이 값은 무엇을 뜻하나요?</strong></div></div><div class=\"map-down\" aria-hidden=\"true\">↓</div><div class=\"map-branches\"><div class=\"map-node \"><strong>수치형</strong><span>예산·대기일: 크기 계산</span></div><div class=\"map-node \"><strong>범주형</strong><span>회의실·체육관: 종류 구분</span></div><div class=\"map-node \"><strong>식별자</strong><span>기관01·02: 이름표</span></div></div>"}], "overview": "<p>자료를 모으고 정리한 뒤 특징을 살펴보고, 그래프와 설명으로 답을 찾는 과정입니다.</p>"}, {"id": "stats", "no": "02", "title": "합계·평균·개수 구분하기", "sub": "평균 · 가운데 값 · 종류 수 · 비율", "tag": "가이드 예시 9", "intro": "“몇 개야?”와 “몇 종류야?”는 다른 질문입니다. 작은 예시부터 계산해보세요.", "cards": [["평균·중앙값·최빈값", "<div class=\"example\">숫자가 <b>2, 3, 3, 4, 28</b>이라고 해볼게요.<br><br><b>평균</b>: 모두 더하면 40. 숫자가 5개이므로 40÷5=<b>8</b>.<br><b>중앙값</b>: 작은 순서로 놓고 가운데를 고르면 <b>3</b>.<br><b>최빈값</b>: 가장 자주 나온 숫자는 <b>3</b>.</div><p>가운데 값인 중앙값은, 숫자가 짝수 개면 가운데 두 값의 평균을 구합니다. 큰 숫자 28 때문에 전체 평균은 8까지 올라갔습니다.</p>"], ["개수와 종류 수", "<div class=\"example\">과일이 <b>사과, 사과, 배, 결측</b>이라고 해볼게요.<br><b>nunique()</b>: 사과·배 → <b>2종류</b>.<br><b>count()</b>: 비어 있지 않은 사과·사과·배 → <b>3개</b>.<br><b>한 열의 size</b>: 결측까지 포함한 자리 → <b>4개</b>.</div><p>“몇 종류인가요?”라면 nunique, “값이 있는 것은 몇 개인가요?”라면 count입니다. 결측까지 포함해 한 열의 자리가 몇 개인지 보면 size입니다.</p><p>여기서 결측은 값이 없다는 표시입니다. 표 전체의 <code>df.size</code>는 줄 수가 아니라 <b>줄 수×열 수</b>이므로 구분하세요.</p>"], ["비율과 교차표", "<div class=\"example\">예약 20건 중 5건이 노쇼입니다.<br>노쇼율=5÷20=<b>25%</b>입니다.<br>5건을 무엇으로 나누는지 확인하세요.</div><p><b>교차표</b>는 두 가지 기준으로 나눠 개수를 센 표입니다. “회의실에서 노쇼 몇 건?”, “체육관에서 정상 이용 몇 건?”을 한 표에 보여줍니다. 이 표를 만드는 pandas 함수 이름이 <code>crosstab</code>입니다.</p><p>pandas는 Python으로 표를 읽고 계산할 때 쓰는 도구입니다. 처음에는 함수의 코드 전체보다 이름과 하는 일을 연결해두세요.</p>"]], "take": "평균=합계÷개수. 중앙값=가운데 값. 최빈값=가장 자주 나온 값. 종류 수와 전체 개수는 다릅니다.", "terms": [["평균 (mean)", "값의 합계를 값의 개수로 나눈 대표값.", "2, 3, 3, 4, 28 → 합계40÷5=8.", "통계 개념 · pandas의 mean() 등으로 계산"], ["중앙값 (median)", "값을 크기순으로 정렬했을 때 가운데 위치의 값.", "2, 3, 3, 4, 28 → 3.", "통계 개념 · pandas의 median() 등으로 계산"], ["최빈값 (mode)", "가장 자주 등장하는 값. 공동으로 여러 개일 수도 있다.", "2, 3, 3, 4, 28 → 3.", "통계 개념 · pandas의 mode() 등으로 계산"], ["pandas", "Python에서 표 형태 자료를 읽고 정리·계산하는 도구.", "CSV를 읽고 분야별 예산을 계산한다.", "Python 라이브러리 · 표 처리 기능 모음"], ["Series / DataFrame", "Series는 표의 세로 한 줄(한 열)을 담는 형태. DataFrame은 여러 열이 있는 표를 담는 형태.", "과일명 한 열 / 과일명·가격으로 된 표.", "pandas의 자료형 · 한 열 또는 표를 담는 형태"], ["nunique()", "서로 다른 값이 몇 종류인지 센다. 같은 사과가 두 번 있어도 사과는 한 종류. 값이 없는 칸은 기본적으로 제외한다.", "s.nunique() → 2종류", "pandas 메서드 · Python에서 한 열·표에 붙여 실행"], ["count()", "값이 들어 있는 칸을 센다. 사과가 두 칸에 있으면 두 개로 센다. 값이 없는 칸은 제외한다.", "s.count() → 3개", "pandas 메서드 · Python에서 한 열·표에 붙여 실행"], ["size / 그룹의 size()", "한 열의 size는 빈칸을 포함한 전체 자리 수. 그룹으로 나눈 뒤의 size()는 그룹별 줄 수를 센다.", "s.size → 4개 · 괄호 없이 읽음", "pandas 속성(size) / 그룹의 메서드(size())"], ["groupby()", "같은 범주의 자료를 묶어 그룹별로 계산할 수 있게 한다.", "복지끼리·교육끼리 묶어 예산 합계 계산.", "pandas 메서드 · Python에서 표를 그룹으로 나눔"], ["sum() / mean()", "sum은 합계, mean은 평균을 계산한다.", "10, 20, 30 → 합계60 / 평균20.", "pandas 메서드 · Python에서 자료에 붙여 계산"], ["교차표 (교차 빈도표)", "두 기준을 교차해 각 조합의 개수를 정리한 표.", "시설유형 × 이용결과: 회의실 노쇼 3건 등.", "통계 표의 종류 · 두 기준별 건수 비교"], ["crosstab()", "기본적으로 범주형 자료의 교차 빈도표를 만드는 pandas 함수.", "pd.crosstab(시설유형, 이용결과)", "pandas 함수 · Python에서 pd.crosstab(...)로 실행"]], "termNote": "", "termSources": [["pandas의 표·열·메서드", "https://pandas.pydata.org/docs/getting_started/intro_tutorials/01_table_oriented.html"], ["nunique: 종류 수", "https://pandas.pydata.org/docs/reference/api/pandas.Series.nunique.html"], ["count: 결측 제외 개수", "https://pandas.pydata.org/docs/reference/api/pandas.Series.count.html"], ["그룹의 size: 행수", "https://pandas.pydata.org/docs/reference/api/pandas.api.typing.DataFrameGroupBy.size.html"], ["표 전체의 size: 원소 수", "https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.size.html"], ["crosstab: 교차표", "https://pandas.pydata.org/docs/reference/api/pandas.crosstab.html"]], "exampleSource": {"topic": "가이드의 공개 예시와 연결된 개념입니다. 이 단원의 모든 용어가 공개 예시에 직접 나왔다는 뜻은 아닙니다.", "example": "“예약20건 중 노쇼5건”, 과일·A/B 예시는 계산을 쉽게 보여주기 위해 만든 숫자와 자료입니다. 원문 실습 결과가 아닙니다.", "noshow": true}, "diagrams": [{"id": "stats-1", "title": "질문에 맞는 함수 고르기", "caption": "같은 자료 A, A, B, 결측에서도 질문에 따라 답이 달라집니다.", "html": "<div class=\"map-root\"><div class=\"map-node \"><strong>A · A · B · 결측</strong></div></div><div class=\"map-down\" aria-hidden=\"true\">↓</div><div class=\"map-branches\"><div class=\"map-node \"><strong>몇 종류?</strong><span>nunique() → 2</span></div><div class=\"map-node \"><strong>값이 몇 개?</strong><span>count() → 3</span></div><div class=\"map-node \"><strong>자리 전체?</strong><span>한 열의 size → 4</span></div></div>"}, {"id": "stats-2", "title": "교차표를 눈으로 보기", "caption": "행의 기준과 열의 기준을 교차한 각 칸에서 개수를 셉니다.", "html": "<div class=\"cross-layout\"><div class=\"map-flow\"><div class=\"map-node \"><strong>행 기준</strong><span>시설유형</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>열 기준</strong><span>이용결과</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>crosstab</strong><span>각 조합의 건수</span></div></div><table class=\"map-cross\"><caption>제작 예시: 총10건</caption><thead><tr><th scope=\"col\">시설유형＼이용결과</th><th scope=\"col\">정상</th><th scope=\"col\">노쇼</th></tr></thead><tbody><tr><th scope=\"row\">회의실</th><td>4건</td><td>2건</td></tr><tr><th scope=\"row\">체육관</th><td>3건</td><td>1건</td></tr></tbody></table><p class=\"map-foot\">“회의실×노쇼” 칸은2건입니다. 회의실 전체는4+2=6건입니다.</p></div>"}], "overview": "<p>같은 과일 표를 보고도 답이 2, 3, 4로 달라질 수 있습니다. 종류·값·자리 중 무엇을 세는지 직접 바꿔보세요.</p>", "beginner": "\n<section class=\"concept beginner-intro\" aria-labelledby=\"beginner-role-title\">\n <h2 id=\"beginner-role-title\">컴퓨터에 “이 표를 세어줘”라고 시키는 과정</h2>\n <p>우리는 “과일이 몇 종류야?”라고 묻습니다. 컴퓨터에게는 이 부탁을 <b>Python이라는 언어로 적어서</b> 전달합니다.</p>\n <div class=\"beginner-flow\" aria-label=\"사람의 부탁을 Python으로 적으면 컴퓨터가 pandas의 기능으로 표를 계산합니다\">\n  <div class=\"beginner-role\"><span class=\"role-icon\" aria-hidden=\"true\">🙋</span><strong>나의 부탁</strong><span>“과일이 몇 종류인지<br>세어줘.”</span></div>\n  <span class=\"beginner-arrow\" aria-hidden=\"true\">→</span>\n  <div class=\"beginner-role language\"><span class=\"role-icon\" aria-hidden=\"true\">📝</span><strong>Python · 파이썬</strong><span>컴퓨터에게 할 일을<br><b>적는 언어</b></span></div>\n  <span class=\"beginner-arrow\" aria-hidden=\"true\">→</span>\n  <div class=\"beginner-role computer\"><span class=\"role-icon\" aria-hidden=\"true\">💻</span><strong>컴퓨터가 실행</strong><span>표 계산을 도와주는<br><b>pandas · 판다스</b> 사용</span><small>표 처리 기능이 모인 도구</small></div>\n  <span class=\"beginner-arrow\" aria-hidden=\"true\">→</span>\n  <div class=\"beginner-role result\"><span class=\"role-icon\" aria-hidden=\"true\">📋</span><strong>계산 결과</strong><span>사과, 배<br><b>2종류!</b></span></div>\n </div>\n <p class=\"beginner-anchor\"><b>Python = 부탁을 적는 언어</b><br><b>pandas = 표를 계산하는 도구 모음</b><br>pandas 안에는 “종류 세기”, “개수 세기”, “평균 구하기” 같은 기능이 들어 있습니다.</p>\n <section class=\"beginner-details\"><h3>이 명령은 어디에 적나요?</h3><p>Google Colab이나 Jupyter의 <b>코드를 입력하는 칸</b>에 적고 실행 버튼을 누릅니다. VS Code에서도 Python 코드를 실행할 수 있습니다. 이들은 코드를 쓰고 실행하는 환경의 이름입니다.</p><div class=\"code-window\"><span>예: Google Colab의 코드 입력칸</span><div><span class=\"run-symbol\" aria-hidden=\"true\">▶</span><code>s.nunique()</code></div><div class=\"code-result\">실행 결과: 2</div></div><p>아래 과일 버튼은 이 HTML에서 결과를 보여주는 학습용 장치입니다.</p></section>\n</section>\n<section class=\"concept fruit-lab\" aria-labelledby=\"fruit-lab-title\">\n <h2 id=\"fruit-lab-title\">종류? 적힌 값? 전체 자리? 직접 바꿔보세요.</h2>\n <p>과일 이름을 적는 자리가 <b>4칸</b> 있습니다. 마지막 칸은 비어 있습니다.<br>표의 세로 한 줄, 즉 <b>한 열</b>이라고 생각하세요.</p>\n <div class=\"fruit-choices\" role=\"group\" aria-label=\"무엇을 셀지 선택\">\n  <button type=\"button\" data-fruit-mode=\"unique\" aria-pressed=\"true\"><b>몇 종류야?</b><code>nunique()</code></button>\n  <button type=\"button\" data-fruit-mode=\"count\" aria-pressed=\"false\"><b>값이 몇 개 적혀 있어?</b><code>count()</code></button>\n  <button type=\"button\" data-fruit-mode=\"size\" aria-pressed=\"false\"><b>자리가 모두 몇 칸이야?</b><code>size</code></button>\n </div>\n <div class=\"fruit-workspace\">\n  <div class=\"fruit-sheet\" aria-label=\"과일명 한 열: 사과, 사과, 배, 빈칸\">\n   <div class=\"fruit-sheet-head\"><span>자리</span><b>과일명</b><span>이번 계산</span></div>\n   <div class=\"fruit-row\" data-fruit-row=\"0\"><span>1</span><b><span aria-hidden=\"true\">🍎</span> 사과</b><span class=\"fruit-status\"></span></div>\n   <div class=\"fruit-row\" data-fruit-row=\"1\"><span>2</span><b><span aria-hidden=\"true\">🍎</span> 사과</b><span class=\"fruit-status\"></span></div>\n   <div class=\"fruit-row\" data-fruit-row=\"2\"><span>3</span><b><span aria-hidden=\"true\">🍐</span> 배</b><span class=\"fruit-status\"></span></div>\n   <div class=\"fruit-row empty-fruit\" data-fruit-row=\"3\"><span>4</span><b>빈칸</b><span class=\"fruit-status\"></span></div>\n  </div>\n  <div id=\"fruit-answer\" class=\"fruit-answer\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"></div>\n </div>\n <p class=\"beginner-anchor\">표가 바뀐 것이 아니라 <b>질문이 바뀐 것</b>입니다. 같은 사과라도 “종류”를 셀 때는 한 번, “적힌 값”을 셀 때는 두 번 셉니다.</p>\n <section class=\"beginner-details\"><h3>빈칸도 하나의 종류로 세나요?</h3><p>이 예시의 빈칸은 <b>과일 이름을 모르는 자리</b>입니다. 이런 “값이 없음”을 <b>결측값</b>이라고 부릅니다. pandas의 <code>nunique()</code>와 <code>count()</code>는 기본적으로 결측값을 빼고 셉니다. <code>size</code>는 그 자리까지 포함합니다.</p><p>“빈칸”이라는 글자를 실제 값으로 적은 경우나 공백 문자열과는 다릅니다. 여기서는 값을 넣지 않은 경우를 가정했습니다.</p></section>\n</section>\n<section class=\"concept beginner-code\" aria-labelledby=\"beginner-code-title\">\n <h2 id=\"beginner-code-title\">방금 누른 기능이 코드에서는 이렇게 쓰입니다.</h2>\n <p><b>“이 과일 열에서, 종류를 세어줘.”</b>를 짧게 적으면 <code>s.nunique()</code>입니다.</p>\n <div class=\"code-reading\" aria-label=\"s는 과일명 열, 점은 이 자료에서, nunique 괄호는 종류를 세는 기능 실행\">\n  <div><code>s</code><span>과일명 한 열의 이름</span></div><div><code>.</code><span>이 자료에서</span></div><div><code>nunique()</code><span>종류 세기 실행</span></div><div class=\"reading-result\"><b>→ 2</b><span>사과와 배</span></div>\n </div>\n <p><code>s</code>는 이 예시에서 우리가 붙인 이름입니다. “과일표”라는 이름표를 붙이는 것과 같습니다.</p>\n <section class=\"beginner-details\"><h3>전체 코드와 각 줄의 뜻 보기</h3>\n  <p>코드 전체를 한꺼번에 외우기보다, 아래 세 줄이 무슨 일을 하는지 읽어보세요.</p>\n  <div class=\"code-step\"><b>① 표 계산 도구를 불러오기</b><pre>import pandas as pd</pre><p>pandas를 사용할 준비를 합니다. <code>pd</code>는 길게 쓰지 않으려고 정한 pandas의 <b>짧은 이름</b>입니다.</p></div>\n  <div class=\"code-step\"><b>② 과일명 한 열을 만들고 이름 붙이기</b><pre>s = pd.Series([\"사과\", \"사과\", \"배\", None])</pre><div class=\"code-fruit-strip\"><span>\"사과\"<br>🍎 사과</span><span>\"사과\"<br>🍎 사과</span><span>\"배\"<br>🍐 배</span><span>None<br>값 없음</span></div><p><code>pd.Series(...)</code>는 pandas로 <b>한 열 형태의 자료를 만드는 기능</b>입니다. <code>s =</code>는 그 자료에 <b>s라는 이름을 붙인다</b>는 뜻입니다. 여기서 <code>None</code>은 “값이 없음”을 나타냅니다.</p></div>\n  <div class=\"code-step\"><b>③ 그 열에서 원하는 계산 하기</b><pre>s.nunique()  # 종류를 세면 2\ns.count()    # 값이 적힌 칸을 세면 3\ns.size       # 전체 자리를 세면 4</pre><p><code>#</code> 뒤는 사람이 읽는 설명입니다. 컴퓨터의 계산에는 들어가지 않습니다. <code>size</code>에는 괄호를 붙이지 않는다는 점도 보세요.</p></div>\n </section>\n <section class=\"beginner-details\"><h3>함수·메서드·라이브러리라는 말도 연결해보기</h3>\n  <div class=\"beginner-names\"><div><b>라이브러리</b><p>기능들을 모아둔 도구 모음.<br><b>pandas</b>가 여기에 해당합니다.</p></div><div><b>함수</b><p>특정 일을 하는 기능.<br><code>pd.crosstab(...)</code>은 교차표를 만드는 <b>pandas 함수</b>입니다.</p></div><div><b>메서드</b><p>자료에 붙여 쓰는 함수.<br><code>s.count()</code>는 <b>s라는 열에 붙여</b> 개수를 세므로 메서드라고 부릅니다.</p></div></div>\n  <p><code>nunique()</code>와 <code>count()</code>는 <b>pandas에서 쓰는 메서드</b>입니다. </p>\n  <p><code>s.size</code>는 기능을 실행하는 대신, 이 열이 가진 개수 정보를 읽습니다. 이런 항목을 <b>속성</b>이라고 부릅니다. 이 예시에서는 4입니다.</p>\n  <p>표 전체의 <code>df.size</code>는 <b>행 수 × 열 수</b>입니다. 표의 줄 수만 보고 싶으면 <code>len(df)</code>를 씁니다. 그룹으로 나눈 뒤의 <code>size()</code>는 별도의 메서드로, 그룹별 줄 수를 셉니다.</p>\n </section>\n <p class=\"beginner-finish\"><b>지금 먼저 기억할 것:</b> Python은 언어, pandas는 표 계산 도구. <code>nunique()</code>는 종류, <code>count()</code>는 값이 있는 칸, 한 열의 <code>size</code>는 전체 자리.</p>\n <small class=\"muted\">과일 표와 작은 숫자는 이해를 돕기 위해 만든 설명용 예시입니다.</small>\n</section>"}, {"id": "clean", "no": "03", "title": "빈칸·이상한 값·깨진 한글", "sub": "결측치 · 이상치 · IQR · 파일 인코딩", "tag": "가이드 예시 6·10", "intro": "용어는 어렵지만, 하는 일은 표에 빈칸이나 이상한 값이 있는지 확인하는 것입니다.", "cards": [["결측치는 빈칸, 이상치는 유난히 다른 값", "<p>처리일수가 비어 있으면 <b>결측치</b>입니다. 다른 사람들은 2~5일인데 한 사람만 500일이면 <b>이상치인지 확인할 값</b>입니다. 예약 대기일이 −3일처럼 업무상 말이 안 되는 값도 점검합니다.</p><p>빈칸을 없앨지, 평균 등 다른 값으로 채울지는 문제의 안내를 따릅니다. <code>dropna</code>는 빈칸이 있는 행 등을 지우는 도구, <code>fillna</code>는 빈칸을 채우는 도구입니다.</p>"], ["IQR은 가운데 50%의 폭이에요", "<p>숫자를 작은 순서로 늘어놓습니다. 약 25% 지점의 값을 <b>Q1</b>, 약 75% 지점의 값을 <b>Q3</b>라고 부릅니다. 두 값의 차이가 <b>IQR</b>입니다. 지점의 값을 정확히 구하는 방식은 계산 도구의 규칙을 따릅니다.</p><div class=\"example\">문제에서 Q1=10, Q3=20이라고 알려줬다면?<br>IQR=20−10=<b>10</b>.<br><br>이상치 기준을 구하라고 하면:<br>아래 기준=10−1.5×10=<b>−5</b><br>위 기준=20+1.5×10=<b>35</b><br>“35 초과”를 지운다면 35는 남고, 36은 지웁니다.</div><p>가이드 예시 10번은 계산 전체가 아니라 <b>Q3−Q1을 뜻하는 이름이 IQR인지</b> 묻습니다.</p>"], ["두 표를 붙이는 일과 한글이 깨지는 이유", "<p>예산 표와 기관명 표에 똑같은 <b>기관번호</b>가 있다면, 그 번호를 기준으로 붙일 수 있습니다. 이 공통 번호를 <b>키</b>라고 합니다.</p><div class=\"example\">첫 표에 A·B·C, 두 번째 표에 B·C·D가 있습니다.<br><b>양쪽에 다 있는 것만 붙이면 B·C</b>가 남습니다.<br>이 방법의 이름이 <b>inner join</b>입니다.</div><p><b>인코딩</b>은 컴퓨터가 글자를 저장하고 읽는 방식입니다. UTF-8과 cp949 같은 방식이 있습니다. 저장한 방식과 다르게 읽으면 한글이 깨질 수 있습니다.</p><p>가이드 예시의 “공공 CSV는 모두 UTF-8만 쓴다”는 <b>틀린 말(X)</b>입니다. cp949인 파일도 있습니다. 파일 이름만 바꿔서는 인코딩이 바뀌지 않습니다.</p>"]], "take": "결측치=빈칸. 이상치=유난히 다른 값. IQR=Q3−Q1. 한글이 깨지면 파일을 읽는 방식을 확인합니다.", "terms": [["결측치 (NA)", "자료에 값이 없거나 알 수 없는 상태.", "처리일수가 비어 있음.", "자료 상태 · 통계·표 처리에서 쓰는 개념"], ["이상치", "다른 값과 유난히 다르거나 업무 규칙을 벗어나 점검이 필요한 값.", "대부분2~5일인데500일인 값.", "자료 상태 · 분석 전에 점검하는 개념"], ["dropna() / fillna()", "dropna는 결측이 있는 행·열을 제거하고, fillna는 결측을 지정값으로 채운다.", "빈 행 제거 / 빈칸을 평균값으로 채우기.", "pandas 메서드 · Python에서 표·열에 붙여 실행"], ["Q1 / Q3", "Q1은 제1사분위수(25% 지점), Q3는 제3사분위수(75% 지점).", "문제에서 Q1=10, Q3=20을 제시.", "통계 개념 · 수치 자료를 정렬·분석할 때"], ["IQR (사분위 범위)", "중앙50% 구간의 폭. Q3−Q1로 계산한다.", "20−10=10.", "통계 지표 · 가운데 구간의 폭을 계산할 때"], ["IQR 이상치 기준", "하한 Q1−1.5×IQR, 상한 Q3+1.5×IQR. 경계 밖의 값을 점검한다.", "Q1=10, Q3=20 → 하한−5, 상한35.", "통계 규칙 · 이상치 후보를 점검할 때"], ["키 (key)", "두 표를 연결할 때 기준으로 쓰는 공통 항목.", "두 파일에 있는 기관코드.", "표 연결 기준 · pandas·SQL 등에서 사용"], ["inner join / merge", "inner join은 양쪽에 모두 있는 키의 자료를 연결한다. merge는 표 결합 도구.", "A·B·C와 B·C·D → B·C 연결.", "표 결합 방식 / pandas의 merge() 함수·메서드"], ["인코딩", "컴퓨터가 글자를 저장·해석하는 방식.", "UTF-8, cp949.", "문자 저장 방식 · 파일을 읽고 저장할 때"], ["UTF-8 BOM", "UTF-8 파일 앞의 표식. 일부 프로그램의 인코딩 인식에 도움을 준다.", "한글 CSV를 utf-8-sig로 저장.", "파일 표식 · UTF-8 텍스트 파일에서 사용"]], "exampleSource": {"topic": "가이드의 공개 예시와 연결된 개념입니다. 이 단원의 모든 용어가 공개 예시에 직접 나왔다는 뜻은 아닙니다.", "example": "작은 숫자·과일·A/B 자료와 아래 개념도는 이해를 돕기 위해 새로 만든 설명용 예시입니다. 원문 정답 수치가 아닙니다."}, "diagrams": [{"id": "clean-1", "title": "빈 값과 이상한 값을 구분하기", "caption": "값이 없는 것과 값은 있지만 점검이 필요한 것을 구분합니다.", "html": "<div class=\"map-root\"><div class=\"map-node \"><strong>표에서 무엇이 문제인가요?</strong></div></div><div class=\"map-down\" aria-hidden=\"true\">↓</div><div class=\"map-branches\"><div class=\"map-node \"><strong>결측치</strong><span>값 없음 → 제거·대체 규칙 확인</span></div><div class=\"map-node \"><strong>이상치</strong><span>유난히 큰 값·업무 규칙 위반 → 기준 확인</span></div></div>"}, {"id": "clean-2", "title": "IQR과 이상치 경계를 한눈에", "caption": "Q1=10, Q3=20이면 IQR=10입니다. 경계 값의 포함 여부는 문제 조건을 확인합니다.", "html": "<svg class=\"map-svg\" viewBox=\"0 0 560 220\" role=\"img\" aria-label=\"Q1은10, Q3는20, IQR은10. 하한마이너스5와상한35를 표시한 수직선\"><title>IQR과 이상치 경계</title><line x1=\"35\" y1=\"110\" x2=\"525\" y2=\"110\" class=\"axis\"/><rect x=\"230\" y=\"88\" width=\"100\" height=\"44\" rx=\"6\" class=\"mark\"/><text x=\"280\" y=\"65\" text-anchor=\"middle\">IQR = 20−10 = 10</text><g class=\"ticks\"><path d=\"M80 101v18 M230 101v18 M330 101v18 M480 101v18\"/></g><text x=\"80\" y=\"155\" text-anchor=\"middle\">−5</text><text x=\"230\" y=\"155\" text-anchor=\"middle\">10</text><text x=\"330\" y=\"155\" text-anchor=\"middle\">20</text><text x=\"480\" y=\"155\" text-anchor=\"middle\">35</text><text x=\"80\" y=\"186\" text-anchor=\"middle\">하한</text><text x=\"230\" y=\"186\" text-anchor=\"middle\">Q1</text><text x=\"330\" y=\"186\" text-anchor=\"middle\">Q3</text><text x=\"480\" y=\"186\" text-anchor=\"middle\">상한</text></svg><div class=\"map-equations\"><span>하한 = 10−1.5×10 = −5</span><span>상한 = 20+1.5×10 = 35</span></div>"}], "overview": "<p>빈칸이나 유난히 다른 값을 확인하고, 표를 붙이거나 깨진 한글을 읽는 데 필요한 기초입니다.</p>"}, {"id": "charts", "no": "04", "title": "어떤 그래프를 고를까요?", "sub": "비교 · 시간 변화 · 숫자의 분포 · 두 값의 관계", "tag": "가이드 예시 2·3", "intro": "그래프 이름을 외우기 전에, 무엇을 보여주고 싶은지 생각해보세요.", "cards": [["질문과 그래프를 짝지으세요", "<table><tr><th>알고 싶은 것</th><th>고를 그래프</th></tr><tr><td>어느 분야의 사업 수가 많을까?</td><td>막대그래프</td></tr><tr><td>1월부터 12월까지 어떻게 변했을까?</td><td>선그래프</td></tr><tr><td>처리일수가 0~5일에 많이 몰릴까?</td><td>히스토그램</td></tr><tr><td>예산이 클수록 참여인원도 많을까?</td><td>산점도</td></tr></table>"], ["산점도는 두 숫자를 점으로 찍어요", "<div class=\"example\">사업 A: 예산 10억원, 참여 100명.<br>사업 B: 예산 20억원, 참여 300명.<br>이 두 숫자씩을 가로·세로 위치로 잡아 점을 찍습니다.<br>이렇게 <b>두 숫자의 관계</b>를 보는 그림이 산점도입니다.</div><p>같이 증가하는 모습이 보인다고, 예산이 참여인원을 늘린 원인이라고 바로 확정할 수는 없습니다. 다른 이유도 있을 수 있습니다.</p>"], ["Plotly와 박스플롯", "<p>그래프에 마우스를 올려 값을 보고, 확대하거나 축소하고 싶을 때 사용하는 대표 도구가 <b>Plotly</b>입니다. 가이드 예시의 정답도 Plotly입니다.</p><p><b>박스플롯</b>은 가운데 값들이 어디에 모였는지 상자 모양으로 보여주는 그림입니다. 상자는 Q1부터 Q3까지이고, 그 폭이 IQR입니다. 이름이 비슷하지만 <b>Plotly는 도구 이름, 박스플롯은 그래프 종류</b>입니다.</p>"]], "take": "종류별 비교=막대. 시간 변화=선. 숫자가 몰린 구간=히스토그램. 두 숫자의 관계=산점도.", "terms": [["막대그래프", "범주별 값의 크기를 막대 길이로 비교하는 그래프.", "복지·교육·환경 분야별 사업 수.", "그래프 종류 · 엑셀·Python 등으로 제작"], ["선그래프", "순서가 있는 값, 특히 시간에 따른 변화를 선으로 보여주는 그래프.", "1월~12월 신고 건수 변화.", "그래프 종류 · 엑셀·Python 등으로 제작"], ["히스토그램", "수치 자료를 구간으로 나누어 구간별 빈도를 보여주는 그래프.", "처리일수0~5일, 6~10일 구간의 건수.", "그래프 종류 · 수치의 구간별 건수를 볼 때"], ["산점도 (Scatter)", "두 수치 변수의 관계를 각 자료의 점 위치로 보여주는 그래프.", "가로=예산, 세로=참여인원.", "그래프 종류 · 두 수치의 관계를 볼 때"], ["박스플롯", "사분위수 등을 이용해 분포와 이상치 후보를 보여주는 상자 그림.", "기관유형별 청렴지수 분포 비교.", "그래프 종류 · 자료의 분포를 비교할 때"], ["Plotly", "마우스 올리기·확대 등 상호작용 차트를 만드는 대표 도구.", "점 위에 마우스를 올려 실제 값 확인.", "Python·JavaScript 라이브러리 · 차트 제작 도구"], ["상관관계 / 인과관계", "함께 변하는 관계 / 한 요인이 다른 결과를 일으키는 관계. 두 관계를 구분한다.", "예산·참여인원이 같이 증가해도 원인까지 확정하지 않는다.", "자료 해석 개념 · 관계와 원인을 판단할 때"]], "exampleSource": {"topic": "가이드의 공개 예시와 연결된 개념입니다. 이 단원의 모든 용어가 공개 예시에 직접 나왔다는 뜻은 아닙니다.", "example": "작은 숫자·과일·A/B 자료와 아래 개념도는 이해를 돕기 위해 새로 만든 설명용 예시입니다. 원문 정답 수치가 아닙니다."}, "diagrams": [{"id": "charts-1", "title": "그래프 모양과 목적 연결하기", "caption": "그림의 숫자와 점은 제작 예시입니다. 무엇을 비교하거나 확인하는지 살펴보세요.", "html": "<div class=\"mini-charts\"><div><h4>막대 · 종류별 비교</h4><svg viewBox=\"0 0 240 160\" class=\"map-svg\" role=\"img\" aria-label=\"복지4건과교육7건을비교하는막대그래프\"><title>막대그래프 예시</title><path class=\"axis\" d=\"M35 15v105h185\"/><rect class=\"mark\" x=\"65\" y=\"70\" width=\"40\" height=\"50\"/><rect class=\"mark\" x=\"145\" y=\"32\" width=\"40\" height=\"88\"/><text x=\"85\" y=\"58\" text-anchor=\"middle\">4건</text><text x=\"165\" y=\"22\" text-anchor=\"middle\">7건</text><text x=\"85\" y=\"145\" text-anchor=\"middle\">복지</text><text x=\"165\" y=\"145\" text-anchor=\"middle\">교육</text></svg></div><div><h4>선 · 시간에 따른 변화</h4><svg viewBox=\"0 0 240 160\" class=\"map-svg\" role=\"img\" aria-label=\"1월2건2월5건3월4건을연결한선그래프\"><title>선그래프 예시</title ong>그래프 종류</strong><span>막대·선·산점도·박스플롯</span></div><div class=\"map-node \"><strong>만드는 도구</strong><span>Plotly·matplotlib 등</span></div><div class=\"map-node \"><strong>Plotly의 대표 기능</strong><span>마우스로 값 확인·확대</span></div></div>"}], "overview": "<p>무엇을 보여주고 싶은지에 따라 그래프를 고릅니다. 종류별 비교, 시간 변화, 숫자의 분포, 두 숫자의 관계를 구분해보세요.</p>"}, {"id": "ai", "no": "05", "title": "AI에게 부탁하고 답 확인하기", "sub": "프롬프트 · 역할 · 상황 · 할 일 · 환각", "tag": "가이드 예시 4", "intro": "프롬프트는 AI에게 입력하는 질문이나 지시입니다. 누구를 위해 무엇을 만들지 구체적으로 적으면 좋습니다.", "cards": [["역할·맥락·작업을 구분하세요", "<table><tr><th>개념</th><th>뜻</th><th>예시</th></tr><tr><td>역할</td><td>답변할 관점</td><td>민원 담당자의 관점으로 설명해줘</td></tr><tr><td>맥락</td><td>사용할 배경·상황</td><td>부서 회의에서 쓸 자료야</td></tr><tr><td>작업</td><td>실제로 시킬 일</td><td>첨부 보고서를 요약해줘</td></tr><tr><td>출력 형식</td><td>답을 보여줄 모양</td><td>표로 정리해줘</td></tr></table>"], ["환각은 AI가 사실처럼 틀린 말을 하는 것", "<p>보고서에 예산이 없는데 AI가 “38억원”이라고 만들어 답할 수 있습니다. 이렇게 <b>틀리거나 근거 없는 내용을 그럴듯하게 만드는 것</b>을 환각이라고 합니다.</p><div class=\"example\">AI가 예산 38억원이라고 답했다면?<br>① 원문에 38억원이 있는지 찾습니다.<br>② 다른 사업의 예산을 가져온 것은 아닌지 봅니다.<br>③ 원과 억원을 헷갈리지 않았는지 확인합니다.</div><p>AI가 참고자료를 찾아 답하는 방식인 <b>RAG</b>도 틀릴 수 있습니다. 참고자료가 있다고 검증이 끝난 것은 아닙니다. 실제 개인정보를 넣기 전에는 기관에서 허용한 범위인지 확인하세요.</p>"]], "take": "프롬프트=AI에게 하는 부탁. 역할=누구처럼, 맥락=어떤 상황, 작업=할 일. AI가 자신 있게 말해도 원문을 확인합니다.", "terms": [["생성형 AI", "입력한 요청에 따라 글·그림·코드 등의 내용을 생성하는 AI.", "보고서 요약이나 코드 초안 만들기.", "AI 기술의 종류 · 글·그림·코드 생성 도구"], ["프롬프트", "AI에 입력하는 질문·지시·조건.", "“첨부 보고서를3줄로 요약해줘.”", "AI 입력 내용 · 챗봇 등에 적는 질문·지시"], ["역할 (Role)", "어떤 입장이나 관점에서 답할지 정하는 요소.", "“정책 담당자처럼 설명해줘.”", "프롬프트 작성 요소 · AI에게 관점 지정"], ["맥락 (Context)", "답변에 필요한 배경·상황·대상 정보.", "“부서 회의에서 쓸 자료야.”", "프롬프트 작성 요소 · AI에게 배경 설명"], ["작업 (Task)", "AI에 수행하도록 요청하는 일.", "“핵심 수치3개를 찾아줘.”", "프롬프트 작성 요소 · AI에게 할 일 지정"], ["출력 형식 / 조건", "결과의 모양과 지켜야 할 요구사항.", "표로 작성 / 없는 숫자는 만들지 않기.", "프롬프트 작성 요소 · 결과 모양과 요구사항 지정"], ["환각 (Hallucination)", "틀리거나 근거 없는 정보를 그럴듯하게 생성하는 현상.", "원문에 없는 예산38억원을 답함.", "AI의 오류 현상 · 답변을 검증할 때 쓰는 말"], ["RAG", "관련 자료를 검색해 생성형 AI의 답변에 참고하도록 제공하는 방식.", "자료집에서 찾은 문장을 근거로 답변.", "AI 서비스 구성 방식 · 검색 자료를 답변에 활용"]], "exampleSource": {"topic": "가이드의 공개 예시와 연결된 개념입니다. 이 단원의 모든 용어가 공개 예시에 직접 나왔다는 뜻은 아닙니다.", "example": "작은 숫자·과일·A/B 자료와 아래 개념도는 이해를 돕기 위해 새로 만든 설명용 예시입니다. 원문 정답 수치가 아닙니다."}, "diagrams": [{"id": "ai-1", "title": "부탁에서 검증까지", "caption": "AI에게 필요한 정보를 주고, 나온 답은 원문과 다시 확인합니다.", "html": "<div class=\"map-flow\"><div class=\"map-node \"><strong>역할·상황</strong><span>누구처럼·어디에 쓸지</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>할 일·조건</strong><span>무엇을·어떤 모양으로</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>AI의 답</strong><span>글·표·코드 생성</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>검증</strong><span>숫자·출처·실행 확인</span></div></div>"}, {"id": "ai-2", "title": "AI가 준 숫자를 확인하는 갈림길", "caption": "자연스럽고 자신 있게 답해도, 원문에 실제로 있는지 확인해야 합니다.", "html": "<div class=\"map-root\"><div class=\"map-node \"><strong>AI: “예산은38억원입니다.”</strong></div></div><div class=\"map-down\" aria-hidden=\"true\">↓</div><div class=\"map-branches\"><div class=\"map-node \"><strong>원문에 있음</strong><span>사업과 단위도 일치하는지 확인</span></div><div class=\"map-node \"><strong>원문에 없음</strong><span>추측해 쓰지 않고 확인 필요 표시</span></div></div>"}], "overview": "<p>AI에게 누구의 관점으로, 어떤 상황에서, 무슨 일을 할지 적어주세요. 나온 답은 제공한 자료와 대조합니다.</p>"}, {"id": "ml", "no": "06", "title": "AI가 무엇을 맞히는지 구분하기", "sub": "분류 · 회귀 · 군집 · 입력값과 정답", "tag": "가이드 예시 8", "intro": "머신러닝은 예시 자료를 보고 규칙을 배우는 방법입니다. 무엇을 맞히려는지에 따라 종류가 달라집니다.", "cards": [["분류·회귀·군집은 이렇게 달라요", "<table><tr><th>이름</th><th>쉬운 뜻</th><th>예시</th></tr><tr><td>분류</td><td>어느 종류인지 맞히기</td><td>예약자가 올까, 안 올까?</td></tr><tr><td>회귀</td><td>숫자가 얼마인지 맞히기</td><td>사용료가 얼마일까?</td></tr><tr><td>군집</td><td>비슷한 것끼리 묶기</td><td>이용 모습이 비슷한 시설 묶기</td></tr></table><p>가이드 예시에서는 <b>사용료처럼 숫자를 예측하는 방법=회귀</b>를 기억하세요.</p>"], ["X와 y는 입력 정보와 정답이에요", "<div class=\"example\">예약자가 올지 맞힌다고 해볼게요.<br><b>X</b>: 시설 종류, 예약 대기일 등 참고할 정보.<br><b>y</b>: 실제로 왔는지 안 왔는지, 맞혀야 할 정답.</div><p>정답에 “안 왔다=1, 왔다=0”처럼 표시를 붙이면 <b>라벨</b>이라고 합니다. 기존 자료에 0과 1을 붙이는 것은 정답표를 만드는 일입니다. 아직 새로운 예약을 예측한 것은 아닙니다.</p><p>정답을 알려주며 배우는 방식을 <b>지도학습</b>이라고 합니다. 미리 정한 정답 없이 비슷한 것끼리 묶는 군집은 보통 <b>비지도학습</b>입니다.</p>"], ["이름 때문에 헷갈리는 모델", "<p><code>LogisticRegression</code>은 로지스틱 회귀라고 읽습니다. 이름에 “회귀”가 있지만, 보통 <b>올지 안 올지처럼 종류를 맞히는 분류</b>에 씁니다.</p><p>모델은 자료로 규칙을 배운 프로그램입니다. 서로 다른 모델 4개를 비교하라는 문제는, 같은 자료로 만든 프로그램 4개 중 어떤 것이 더 잘 맞히는지 확인하라는 뜻입니다.</p>"]], "take": "종류를 맞히면 분류. 숫자를 맞히면 회귀. 비슷한 것끼리 묶으면 군집.", "terms": [["머신러닝", "자료의 패턴을 학습해 예측·분류 등에 사용하는 방법.", "과거 예약을 보고 신규 예약의 노쇼 예측.", "분석 방법 · 자료로 규칙을 학습할 때"], ["모델", "자료에서 학습한 규칙을 이용해 결과를 산출하는 대상.", "노쇼 여부를 예측하는 분류 모델.", "학습 결과·예측 도구 · 새 자료의 결과를 구할 때"], ["분류 (Classification)", "대상이 어느 범주에 속하는지 예측한다.", "노쇼 / 정상 이용.", "분석 유형 · 범주 예측에 사용"], ["회귀 (Regression)", "연속적인 수치값을 예측한다.", "사용료·예산·처리일수 예측.", "분석 유형 · 숫자 예측에 사용"], ["군집 (Clustering)", "사전 정답 없이 유사한 대상을 그룹으로 묶는다.", "이용 모습이 비슷한 시설 묶기.", "분석 유형 · 비슷한 집단을 찾을 때"], ["특성 X / 라벨 y", "X는 예측에 사용하는 입력 정보, y는 예측할 정답이나 대상값.", "X=시설유형·대기일, y=노쇼 여부.", "모델의 입력·정답 자료 · Python 분석에 사용"], ["지도 / 비지도 학습", "정답을 알려주며 학습 / 사전 정답 없이 패턴을 학습.", "분류·회귀 / 군집.", "학습 방식 · 정답을 제공하는지에 따른 구분"], ["LogisticRegression", "이름에 회귀가 들어가지만 대표적으로 분류에 사용하는 모델.", "예약자가 올지 안 올지 분류.", "Python scikit-learn의 모델 클래스 · 모델을 만드는 설계도"]], "exampleSource": {"topic": "노쇼 예측 주제는 원문에 있습니다. 가이드 블루 연습세트04와 별도 PDF 4세트 2과목에서 공공시설 예약1,500건과 시설유형6종을 분석합니다.", "example": "작은 숫자·과일·A/B 자료와 아래 개념도는 이해를 돕기 위해 새로 만든 설명용 예시입니다. 원문 정답 수치가 아닙니다.", "noshow": true}, "diagrams": [{"id": "ml-1", "title": "예측할 답에 따라 방법 고르기", "caption": "종류·숫자·비슷한 묶음 중 무엇이 필요한지 먼저 확인합니다.", "html": "<div class=\"map-root\"><div class=\"map-node \"><strong>무엇을 알고 싶나요?</strong></div></div><div class=\"map-down\" aria-hidden=\"true\">↓</div><div class=\"map-branches\"><div class=\"map-node \"><strong>분류</strong><span>올까·안 올까? → 종류</span></div><div class=\"map-node \"><strong>회귀</strong><span>사용료 얼마? → 숫자</span></div><div class=\"map-node \"><strong>군집</strong><span>비슷한 시설은? → 묶음</span></div></div>"}, {"id": "ml-2", "title": "X와 y의 역할", "caption": "입력 정보와 맞혀야 할 정답을 구분합니다.", "html": "<div class=\"map-flow\"><div class=\"map-node \"><strong>X: 입력 정보</strong><span>시설유형·예약대기일</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>모델</strong><span>자료에서 규칙 학습</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>예측</strong><span>올지·안 올지 맞히기</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>y와 비교</strong><span>실제 결과로 평가</span></div></div>"}], "overview": "<p>예측하려는 것이 종류인지 숫자인지, 비슷한 자료를 묶으려는지에 따라 분석 방법이 달라집니다.</p>"}, {"id": "split", "no": "07", "title": "공부할 자료와 시험 볼 자료 나누기", "sub": "20%는 시험용 · 같은 나누기 · 정답 비율 맞추기", "tag": "블루 실습 보완", "intro": "모델도 공부한 문제만 풀게 하면 실력을 제대로 알기 어렵습니다. 배우는 자료와 새로 풀어볼 자료를 나눕니다.", "cards": [["학습 자료와 테스트 자료", "<div class=\"example\">자료가 100건 있습니다.<br>80건으로 배우게 합니다 → <b>학습 자료</b>.<br>나머지 20건으로 얼마나 맞히는지 봅니다 → <b>테스트 자료</b>.</div><p>실습 코드에 나오는 <code>test_size=0.2</code>는 <b>20%를 테스트 자료로 남기라</b>는 뜻입니다.</p>"], ["random_state와 stratify", "<p><code>random_state=42</code>: <b>자료를 무작위로 나누되, 같은 조건에서 다시 해도 같은 결과가 나오게 하는 설정</b>입니다. 42라는 숫자가 가장 좋은 모델을 보장하는 것은 아닙니다.</p><div class=\"example\"><code>stratify=y</code>: <b>정답 종류의 비율도 고려해서 나눠라</b>는 뜻입니다.<br>원래 “옴 50건, 안 옴 50건”이라면, 테스트 20건에도 두 종류가 약 10건씩 들어가게 나누는 것입니다.</div><p>자료 수에 따라 정확히 같은 비율이 안 될 수도 있습니다. 시험 문제에서 준 설정은 그대로 사용하세요.</p>"], ["외운 것과 잘 맞히는 것은 달라요", "<p>공부한 자료는 99% 맞히는데 새 자료는 60%만 맞히면, 공부한 자료에만 너무 맞춰졌는지 점검합니다. 이것을 <b>과적합</b>이라고 합니다.</p><p>“올지 안 올지 맞혀봐” 하면서 입력 정보에 “실제로 안 왔다”를 넣으면 정답을 알려준 셈입니다. 이것이 <b>정답 정보 누출</b>입니다.</p><p>숫자 크기를 맞춰주는 도구인 <b>StandardScaler</b>도 학습 자료에서 기준을 정하고 테스트 자료에 적용합니다. 테스트 자료까지 미리 보고 기준을 만들면 실제보다 점수가 좋아 보일 수 있습니다.</p>"]], "take": "배울 자료와 새로 풀 자료를 나눕니다. 정답을 미리 알려주면 실력 평가가 안 됩니다.", "terms": [["학습 데이터", "모델이 규칙을 배우는 데 사용하는 자료.", "100건 중80건으로 학습.", "자료의 역할 · 모델을 학습시킬 때 사용"], ["테스트 데이 ew": "<p>모델이 배울 자료와 새로 풀어볼 자료를 나누어 실력을 확인합니다. Python 실습을 준비할 때 보는 내용입니다.</p>"}, {"id": "metrics", "no": "08", "title": "얼마나 잘 맞혔는지 계산하기", "sub": "정확도 · 정밀도 · 재현율 · F1", "tag": "블루 실습 보완", "intro": "어려운 영어 약어부터 외우지 않아도 됩니다. “위험하다고 했는데 진짜 위험했나?”와 “진짜 위험한 것을 얼마나 찾았나?”를 구분해보세요.", "cards": [["정확도는 전체 중 맞힌 비율", "<div class=\"example\">100건을 확인했는데 90건을 맞혔습니다.<br><b>정확도=90÷100=90%</b>.</div><p>하지만 정상 99건, 위험 1건에서 전부 정상이라고 하면 정확도는 99%입니다. 실제 위험은 하나도 찾지 못했습니다. 그래서 다른 점수도 봅니다.</p>"], ["정밀도와 재현율은 무엇으로 나누는지가 달라요", "<div class=\"example\">실제로 위험한 사건은 <b>10건</b>.<br>AI가 위험하다고 말한 사건은 <b>8건</b>.<br>그 8건 중 정말 위험했던 사건은 <b>6건</b>.<br><br><b>정밀도</b>: 위험하다고 한 8건 중 진짜 위험 6건.<br>6÷8=<b>75%</b>.<br><br><b>재현율</b>: 진짜 위험 10건 중 찾아낸 6건.<br>6÷10=<b>60%</b>.</div><p><b>정밀도</b>는 “위험하다는 말이 얼마나 맞았나?”, <b>재현율</b>은 “진짜 위험한 것을 얼마나 찾았나?”입니다.</p>"], ["F1은 두 점수를 함께 보는 점수", "<p><b>F1</b>은 정밀도와 재현율을 함께 반영한 점수입니다. 둘 중 하나가 낮으면 F1도 낮아집니다. 단순히 두 점수를 더해서 2로 나누는 방법은 아닙니다.</p><div class=\"example\">정밀도=0.5, 재현율=1.0이면:<br>F1=2×0.5×1.0÷(0.5+1.0)<br>=1÷1.5≈<b>0.667</b>.</div><p><b>macro-F1</b>은 각 종류의 F1을 구한 뒤 같은 비중으로 평균 낸 것입니다. 두 종류의 F1이 0.8과 0.4이면 (0.8+0.4)÷2=<b>0.6</b>입니다.</p><p>이 단원은 블루 실습을 이해하기 위한 보충 내용입니다. 공개된 이론 예시 10문항에 F1 문제는 없습니다.</p>"]], "take": "정확도=전체에서 맞힌 비율. 정밀도=위험하다고 한 것 중 진짜 위험. 재현율=진짜 위험 중 찾아낸 것.", "terms": [["양성 / 음성", "양성은 관심 대상으로 정한 클래스, 음성은 그 밖의 클래스.", "위험=양성, 정상=음성.", "분류 평가 개념 · 관심 대상 클래스를 정할 때"], ["TP / FP", "TP는 실제 양성을 양성으로 맞힘. FP는 실제 음성을 양성으로 잘못 판단.", "진짜 위험을 발견 / 정상을 위험이라고 경고.", "예측 결과의 건수 구분 · 혼동행렬에서 사용"], ["FN / TN", "FN은 실제 양성을 놓침. TN은 실제 음성을 음성으로 맞힘.", "위험을 정상으로 판단 / 정상을 정상으로 판단.", "예측 결과의 건수 구분 · 혼동행렬에서 사용"], ["정확도 (Accuracy)", "전체 자료 중 예측이 맞은 비율. (TP+TN)÷전체.", "100건 중90건 맞힘 →90%.", "평가 지표 이름 · scikit-learn의 accuracy_score 등으로 계산"], ["정밀도 (Precision)", "양성으로 예측한 것 중 실제 양성인 비율. TP÷(TP+FP).", "위험하다고 한8건 중 진짜 위험6건 →75%.", "평가 지표 이름 · scikit-learn의 precision_score 등으로 계산"], ["재현율 (Recall)", "실제 양성 중 찾아낸 비율. TP÷(TP+FN).", "진짜 위험10건 중 발견6건 →60%.", "평가 지표 이름 · scikit-learn의 recall_score 등으로 계산"], ["F1", "정밀도와 재현율의 조화평균. 2×P×R÷(P+R).", "P=0.5, R=1.0 → 약0.667.", "평가 지표 이름 · scikit-learn의 f1_score 등으로 계산"], ["macro-F1", "클래스별 F1을 구해 동일한 비중으로 평균 낸 값.", "F1이0.8·0.4 → 평균0.6.", "지표 평균 방식 · f1_score의 average=\"macro\" 설정"], ["불균형 데이터", "클래스별 자료 수가 크게 다른 데이터.", "정상990건·위험10건.", "자료의 특성 · 정답 종류별 개수가 다를 때"]], "exampleSource": {"topic": "가이드의 학습 목표와 블루 실습을 바탕으로 정리한 보충 개념입니다.", "example": "“실제 위험10건, 예측 위험8건, 발견6건”은 지표를 설명하기 위해 만든 숫자입니다. 원문 실습의 분석 결과가 아닙니다."}, "diagrams": [{"id": "metrics-1", "title": "사건20건을 네 칸으로 나누기", "caption": "실제 위험10건·정상10건, AI가 위험이라고 한8건 중6건은 진짜 위험인 제작 예시입니다.", "html": "<table class=\"confusion-map\"><thead><tr><th scope=\"col\">AI 예측＼실제</th><th scope=\"col\">진짜 위험10건</th><th scope=\"col\">정상10건</th></tr></thead><tbody><tr><th scope=\"row\">위험이라고 함</th><td class=\"cell-hit\"><b>TP · 6건</b><span>맞게 발견</span></td><td class=\"cell-miss\"><b>FP · 2건</b><span>잘못 경고</span></td></tr><tr><th scope=\"row\">정상이라고 함</th><td class=\"cell-miss\"><b>FN · 4건</b><span>위험 놓침</span></td><td class=\"cell-hit\"><b>TN · 8건</b><span>정상 맞힘</span></td></tr></tbody></table><div class=\"map-equations\"><span>정확도=(6+8)÷20=70%</span><span>정밀도=6÷8=75%</span><span>재현율=6÷10=60%</span></div>"}, {"id": "metrics-2", "title": "찾아낸 위험과 잘못된 경고를 바꿔보세요", "caption": "조절값은 원문 수치가 아닌 제작 예시입니다. 어떤 값을 기준으로 나누는지 확인하세요.", "html": "<div class=\"metric-play\"><label>실제 위험10건 중 찾아낸 건수 <b id=\"tp-value\">6건</b><input id=\"metric-tp\" type=\"range\" min=\"0\" max=\"10\" value=\"6\"></label><label>정상10건 중 잘못 경고한 건수 <b id=\"fp-value\">2건</b><input id=\"metric-fp\" type=\"range\" min=\"0\" max=\"10\" value=\"2\"></label><div id=\"metric-output\" aria-live=\"polite\"></div></div>"}], "overview": "<p>모델이 얼마나 잘 맞혔는지 여러 점수로 확인합니다. Python 실습을 준비할 때 보는 내용입니다.</p>"}, {"id": "files", "no": "09", "title": "파일과 표에서 원하는 것 찾기", "sub": "CSV · JSON · SQL의 간단한 뜻", "tag": "가이드 실습 보완", "intro": "CSV와 JSON은 자료를 담는 방식이고, SQL은 표에서 필요한 자료를 찾아달라고 하는 말입니다.", "cards": [["CSV와 JSON", "<p><b>CSV</b>: 엑셀처럼 줄과 칸으로 된 표를 글자로 저장한 파일입니다. 첫 줄은 보통 항목 이름입니다. 이 첫 줄을 <b>헤더</b>라고 합니다.</p><div class=\"example\">분야,건수 ← 항목 이름<br>복지,4 ← 자료 한 줄</div><p><b>JSON</b>: “이름: 값”으로 자료를 적는 방식입니다. <code>{\"분야\":\"복지\",\"건수\":4}</code>는 분야가 복지이고 건수가 4라는 뜻입니다.</p><p>CSV는 글자 자료 중심이라 엑셀의 색상·차트를 그대로 담는 파일 형식은 아닙니다.</p>"], ["SQL은 표에 하는 질문이에요", "<table><tr><th>이름</th><th>쉬운 뜻</th></tr><tr><td>SELECT</td><td>무엇을 보여줄까?</td></tr><tr><td>FROM</td><td>어느 표에서 찾을까?</td></tr><tr><td>WHERE</td><td>어떤 조건인 것만 남길까?</td></tr><tr><td>GROUP BY</td><td>어떤 종류별로 묶을까?</td></tr><tr><td>COUNT(*)</td><td>몇 줄인지 세기</td></tr></table><div class=\"example\">“복지 몇 건, 교육 몇 건인지 세어줘.”<br>→ 분야별로 묶고(GROUP BY), 개수를 셉니다(COUNT).<br><br>“온라인안내가 가능한 것만 세어줘.”<br>→ 가능한 것만 남기고(WHERE), 개수를 셉니다(COUNT).</div>"]], "take": "CSV=줄·칸으로 된 표. JSON=이름과 값. WHERE=조건으로 고르기. GROUP BY=종류별로 묶기.", "terms": [["CSV", "행·열로 된 표를 텍스트로 저장하는 파일 형식.", "분야,건수 / 복지,4.", "파일 형식 · 엑셀·Python 등에서 읽고 저장"], ["헤더 (Header)", "표의 항목 이름이 들어 있는 줄. 보통 첫 줄이다.", "“분야,건수”는 항목 이름.", "표 구성 요소 · 첫 줄의 항목 이름"], ["JSON", "키·값과 배열 등으로 구조화된 자료를 표현하는 형식.", "{\"분야\":\"복지\",\"건수\":4}.", "자료 표현 형식 · 파일·웹서비스에서 사용"], ["SQL", "데이터베이스의 자료를 조회·처리하는 언어.", "서비스 표에서 복지 분야만 조회.", "조회·처리 언어 · 데이터베이스에서 실행"], ["SELECT / FROM", "SELECT는 표시할 항목·계산, FROM은 대상 표를 지정한다.", "SELECT 서비스명 FROM svc.", "SQL 문장의 구성 요소 · 표시 항목·대상 표 지정"], ["WHERE", "조건에 맞는 행만 선택한다.", "온라인안내가“가능”인 행만 남기기.", "SQL 문장의 구성 요소 · 행의 조건 지정"], ["GROUP BY", "지정한 항목별로 그룹을 묶어 집계한다.", "안내분야별 서비스 수 계산.", "SQL 문장의 구성 요소 · 그룹별 집계 지정"], ["COUNT(*)", "조회 대상의 전체 행수를 센다.", "조건에 맞는 서비스가 몇 건인지 세기.", "SQL 집계 함수 · 데이터베이스에서 행수 계산"]], "exampleSource": {"topic": "가이드의 학습 목표와 블루 실습을 바탕으로 정리한 보충 개념입니다.", "example": "작은 숫자·과일·A/B 자료와 아래 개념도는 이해를 돕기 위해 새로 만든 설명용 예시입니다. 원문 정답 수치가 아닙니다."}, "diagrams": [{"id": "files-1", "title": "같은 자료를 CSV와 JSON으로 표현하기", "caption": "파일 모양이 달라도 담고 있는 정보가 같을 수 있습니다.", "html": "<div class=\"map-root\"><div class=\"map-node \"><strong>분야는 복지, 건수는4</strong></div></div><div class=\"map-down\" aria-hidden=\"true\">↓</div><div class=\"map-branches\"><div class=\"map-node \"><strong>CSV: 줄·칸</strong><span>분야,건수 / 복지,4</span></div><div class=\"map-node \"><strong>JSON: 키·값</strong><span>{&quot;분야&quot;:&quot;복지&quot;,&quot;건수&quot;:4}</span></div></div>"}, {"id": "files-2", "title": "조건으로 고르고 종류별로 세기", "caption": "분야별 건수를 구할 때 각 SQL 표현이 하는 일을 연결해보세요.", "html": "<div class=\"map-flow\"><div class=\"map-node \"><strong>FROM</strong><span>어느 표에서?</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>WHERE</strong><span>어떤 행만?</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>GROUP BY</strong><span>어떤 종류별로?</span></div><span class=\"map-arrow\" aria-hidden=\"true\">→</span><div class=\"map-node \"><strong>COUNT(*)</strong><span>각 묶음은 몇 건?</span></div></div>"}], "overview": "<p>CSV와 JSON은 자료를 담는 방식입니다. SQL은 표에서 원하는 자료를 찾고 계산하도록 요청하는 언어입니다.</p>"}, {"id": "service", "no": "10", "title": "필요한 기능부터 만들고 확인하기", "sub": "MVP · 노코드 · 배포 · 임베드", "tag": "가이드 예시 5·7", "intro": "처음부터 모든 기능을 만들기보다, 필요한 핵심 기능을 먼저 만들고 써보는 방법입니다.", "cards": [["MVP는 작게 만들어 먼저 확인하는 제품", "<div class=\"example\">안내자료를 찾는 사이트를 만든다고 해볼게요.<br>처음에는 <b>자료 보여주기 + 검색하기</b>부터 만듭니다.<br>이것으로 사람들이 자료를 잘 찾는지 확인합니다.<br>게시판·회원가입 등은 필요할 때 더합니다.</div><p>이렇게 핵심 기능으로 먼저 확인할 수 있는 제품을 <b>MVP</b>라고 부릅니다. 가이드 예시는 “최소 기능 제품의 약어는?” → <b>MVP</b>입니다.</p>"], ["노코드는 코드를 직접 많이 쓰지 않는 방식", "<p>화면의 설정이나 블록을 조합해서 사이트나 자동화를 만드는 방법입니다. 직접 코드를 쓰지 않고도 간단한 서비스를 만들 수 있습니다.</p><p>가이드 예시의 “노코드로 서비스 시제품을 만들 수 있다”는 <b>맞는 말(O)</b>입니다. 다만 원하는 기능이 실제로 작동하는지는 확인해야 합니다.</p>"], ["배포와 임베드는 이렇게 달라요", "<p><b>배포</b>: 다른 사람도 인터넷 주소로 들어와 사용할 수 있게 올리는 일입니다. 내 PC에서만 열린다고 다른 사람도 볼 수 있는 것은 아닙니다.</p><p><b>임베드</b>: 다른 자료를 내 페이지 안에 바로 보여주는 일입니다. 내 사이트에서 구글 시트 내용이 보이게 넣는 것이 예입니다.</p><div class=\"example\">“구글 시트 보기”를 누르면 다른 곳으로 이동 → <b>링크</b>.<br>내 페이지 안에서 구글 시트 내용이 바로 보임 → <b>임베드</b>.</div>"]], "take": "MVP=핵심 기능부터 만들어 확인. 노코드=코드를 직접 많이 쓰지 않고 만들기. 배포=다른 사람도 접속하게 올리기.", "terms": [["문제 정의", "해결할 문제와 목표를 구체적으로 정하는 일.", "시민이 필요 function bindSources(){const a=$('guide-source');if(a){a.href=encodeURI('2026년_AI_챔피언_튜토리얼_셀프_학습_가이드_V1.0_0709.html');a.target='_blank';a.rel='noopener';}}
function bindUnitActions(){document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>go('lesson',b.dataset.learn));bindCoreActions();document.querySelectorAll('[data-solve]').forEach(b=>b.onclick=()=>startQuiz(questions.filter(q=>!q.retired&&q.unit===b.dataset.solve),'practice'));}
function termTable(u){if(!u.terms?.length)return '';return `<section class="concept term-card" aria-label="${esc(u.title)} 용어"><table class="term-table"><colgroup><col style="width:24%"><col style="width:44%"><col style="width:32%"></colgroup><thead><tr><th scope="col">용어 / 기능</th><th scope="col">뜻·하는 일</th><th scope="col">예시</th></tr></thead><tbody>${u.terms.map(t=>`<tr><th scope="row">${esc(t[0])}</th><td data-label="뜻·하는 일">${esc(t[1])}</td><td data-label="예시">${esc(t[2])}</td></tr>`).join('')}</tbody></table>${u.termNote?`<p class="term-note">${esc(u.termNote)}</p>`:''}${u.termSources?`<section class="term-sources"><h3>공식 문서</h3>${u.termSources.map(t=>`<a href="${esc(t[1])}" target="_blank" rel="noopener">${esc(t[0])}</a>`).join('')}</section>`:''}</section>`;}

function lesson(id){const u=getU(id);if(!u)return go('home');const index=units.indexOf(u);$('main').innerHTML=`<div class="optional-lesson-banner">실습 보충 자료 · 이론 개념의 세부 코드와 추가 설명</div><div class="lesson-header"><div class="eyebrow">CONCEPT ${u.no} / ${u.tag}</div><h1>${u.title}</h1>${u.overview||`<p>${esc(u.intro)}</p>`}</div>${u.beginner||''}${termTable(u)}${diagramSection(u)}${u.cards.map(c=>`<section class="concept"><h2>${c[0]}</h2>${c[1]}</section>`).join('')}${exampleSource(u)}<div class="takeaway"><b>이것만 먼저 기억하세요</b>${u.take}</div><div class="row"><button class="btn mint" id="read-done">${state.read.includes(id)?'✓ 학습 완료 표시됨':'이 단원 학습 완료 표시'}</button><button class="btn primary" id="unit-quiz">이 단원 개념 문제 풀기</button>${index<9?'<button class="btn" id="next-unit">다음 개념 →</button>':''}</div><div class="sources">${u.tag.includes('가이드 예시')?'이 단원에는 가이드 공개 예시와 연결된 내용이 있습니다. 관련 개념을 확장한 연습 문제도 포함합니다. 문제의 출처 표시를 확인하세요.':'이 단원은 더 연습할 때 보는 보충 설명입니다. 가이드 공개 예시 10문항에 직접 나온 내용은 아닙니다.'}</div>${footer()}`;
 $('read-done').onclick=()=>{if(!state.read.includes(id))state.read.push(id);save();lesson(id);toast('학습 완료로 기록했습니다.');};$('unit-quiz').onclick=()=>startQuiz(questions.filter(q=>!q.retired&&q.unit===id),'practice');if($('next-unit'))$('next-unit').onclick=()=>go('lesson',units[index+1].id);bindDiagramControls();
}
function startQuiz(pool,mode){if(!pool.length)return toast('선택 범위에 문제가 없습니다. 범위를 바꿔주세요.');navigationTrail.length=0;state.session={mode,ids:shuffle(pool).map(q=>q.id),pos:0,answers:{},graded:{},finished:false,endAt:mode==='mock'?Date.now()+600000:null};save();go('quiz');}
function record(q,answer){const correct=answer===q.answer,old=state.records[q.id];state.records[q.id]={attempts:(old?.attempts||0)+1,firstCorrect:old?old.firstCorrect:correct,lastCorrect:correct,lastAnswer:answer,date:new Date().toISOString()};}
function renderQuiz(){const s=state.session;if(!s)return go('practice');if(s.finished)return go('result');if(s.mode==='mock'&&Date.now()>=s.endAt)return finishQuiz(true);const q=getQ(s.ids[s.pos]);if(!q)return go('practice');const graded=!!s.graded[q.id],sel=s.answers[q.id],mock=s.mode==='mock';const done=mock?Object.keys(s.answers).length:Object.keys(s.graded).length;
 $('main').innerHTML=`<div class="quiz-top"><div><span class="eyebrow">${mock?'MOCK TEST':'PRACTICE'}</span><div>${s.pos+1} / ${s.ids.length}문항 · ${mock?'응답':'채점'} ${done}문항</div></div><div>${mock?'<span class="timer" id="timer" role="timer"></span>':'<button class="btn small" id="back-practice">풀이 메뉴</button>'}</div></div><div class="progress-track"><span style="width:${done/s.ids.length*100}%"></span></div>${mock?'<div class="mock-note">모의고사에서는 전체 제출 후 정답과 해설을 확인합니다. 문제 번호를 눌러 이동하거나 답을 변경할 수 있습니다.</div>':''}<section class="panel"><div class="row">${evidence(q.scope)}<span class="pill">${esc(getTopic(q.focusTopic)?.title||getU(q.unit).title)}</span></div><h1 class="question-title" id="question-stem">${esc(q.stem)}</h1>${q.code?`<pre class="question-code"><code>${esc(q.code)}</code></pre>`:''}<form id="answer-form"><fieldset class="choices" aria-labelledby="question-stem">${q.options.map((o,i)=>`<label class="choice ${sel===i?'selected':''} ${graded&&i===q.answer?'correct':''} ${graded&&sel===i&&i!==q.answer?'wrong':''}"><input type="radio" name="answer" value="${i}" ${sel===i?'checked':''} ${graded?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o.text)}</span>${graded&&(i===q.answer||sel===i)?`<span class="badge">${i===q.answer?'정답':'선택한 오답'}</span>`:''}</label>`).join('')}</fieldset><div class="quiz-actions"><button type="button" class="btn" id="prev-q" ${s.pos===0?'disabled':''}>← 이전</button><div class="row">${!mock&&!graded?'<button class="btn primary" type="submit" id="grade" disabled>정답 확인</button>':''}<button class="btn ${graded||mock?'primary':''}" type="button" id="next-q">${s.pos===s.ids.length-1?(mock?'답안 제출':graded?'결과 보기':'결과 보기 / 종료'):'다음 →'}</button></div></div></form>${graded?feedback(q,sel):''}${graded&&!mock?`<div class="feedback-next"><button class="btn primary" type="button" id="next-q-bottom">${s.pos===s.ids.length-1?'결과 보기':'다음 →'}</button></div>`:''}</section><div class="quiz-map" aria-label="문제 번호 이동">${s.ids.map((id,i)=>`<button class="${s.pos===i?'current':''} ${(mock?s.answers[id]!==undefined:s.graded[id])?'answered':''}" data-pos="${i}" aria-label="${i+1}번 문제${s.pos===i?', 현재 문제':''}">${i+1}</button>`).join('')}</div>${mock?'<div class="row" style="margin-top:22px"><button class="btn" id="submit-mock">지금 답안 제출</button><button class="btn small" id="mock-menu">풀이 메뉴로 돌아가기</button></div>':''}`;
 document.querySelectorAll('input[name="answer"]').forEach(r=>r.onchange=()=>{s.answers[q.id]=Number(r.value);save();document.querySelectorAll('.choice').forEach(l=>l.classList.toggle('selected',l.querySelector('input').checked));if($('grade'))$('grade').disabled=false;});
 $('answer-form').onsubmit=e=>{e.preventDefault();if(mock)return;if(s.answers[q.id]===undefined)return toast('선택지를 먼저 골라주세요.');if(s.graded[q.id])return;s.graded[q.id]=true;record(q,s.answers[q.id]);save();updateNav();renderQuiz();const f=$('feedback');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'});};
 if($('grade')&&sel!==undefined)$('grade').disabled=false;$('prev-q').onclick=()=>{s.pos--;save();renderQuiz();};$('next-q').onclick=()=>{if(s.pos===s.ids.length-1){if(mock)return finishQuiz(false);finishQuiz(false);}else{s.pos++;save();renderQuiz();window.scrollTo({top:0,behavior:'instant'});}};document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{s.pos=Number(b.dataset.pos);save();renderQuiz();});
 if($('next-q-bottom'))$('next-q-bottom').onclick=()=>$('next-q').click();if($('back-practice'))$('back-practice').onclick=()=>go('practice');if(mock){$('submit-mock').onclick=()=>finishQuiz(false);$('mock-menu').onclick=()=>go('practice');startTimer();}if(graded)bindFeedback(q.unit);
}
function choiceExplanation(o){return `<p class="choice-definition"><span>개념</span>${esc(o.definition)}</p><p class="choice-reason"><span>이 문제에서는</span>${esc(o.reason)}</p>`;}
function feedback(q,answer){const correct=answer===q.answer;return `<section class="feedback" id="feedback" aria-live="polite"><h3 class="${correct?'good':'bad'}">${correct?'✓ 정답입니다.':'선택한 답은 오답입니다.'}</h3>${!correct?`<div class="reason wrong"><b>내 답 ${'ABCD'[answer]} · ${esc(q.options[answer].text)}</b>${choiceExplanation(q.options[answer])}</div>`:''}<div class="reason right"><b>정답 ${'ABCD'[q.answer]} · ${esc(q.options[q.answer].text)}</b>${choiceExplanation(q.options[q.answer])}</div><h4>나머지 선택지의 뜻과 오답 이유</h4><ul class="answer-list">${q.options.map((o,i)=>(i!==q.answer&&(correct||i!==answer))?`<li><b>${'ABCD'[i]}. ${esc(o.text)}</b>${choiceExplanation(o)}</li>`:'').join('')}</ul><p class="question-origin"><b>문제 근거</b> ${esc(q.sourceDetail)}${questionSourceLinks(q)}</p><button class="btn small" id="review-concept">관련 개념 다시 읽기 →</button></section>`;}

function bindFeedback(unit){if($('review-concept'))$('review-concept').onclick=()=>{const q=getQ(state.session?.ids[state.session.pos]);const topic=q?.focusTopic||q?.courseTopic;go(topic?'theory':'lesson',topic||unit);};}
function startTimer(){clearInterval(timerHandle);function tick(){const s=state.session;if(!s||s.finished)return;const left=Math.max(0,Math.ceil((s.endAt-Date.now())/1000));if($('timer')){$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('timer').classList.toggle('urgent',left<=60);}if(left===0)finishQuiz(true);}tick();if(view==='quiz')timerHandle=setInterval(tick,1000);}
function finishQuiz(expired){const s=state.session;if(!s||s.finished)return;const unanswered=s.ids.filter(id=>s.answers[id]===undefined).length;clearInterval(timerHandle);if(s.mode==='mock'){s.ids.forEach(id=>{const q=getQ(id);if(!s.graded[id]){record(q,s.answers[id]??null);s.graded[id]=true;}});}s.finished=true;s.expired=expired;const count=s.ids.filter(id=>s.graded[id]&&s.answers[id]===getQ(id).answer).length;if(s.mode==='mock')state.exams.push({date:new Date().toISOString(),correct:count,total:s.ids.length});save();go('result');}
function result(){const s=state.session;if(!s)return go('practice');const correct=s.ids.filter(id=>s.graded[id]&&s.answers[id]===getQ(id).answer).length;const graded=Object.keys(s.graded).length;const missed=s.ids.filter(id=>!s.graded[id]||s.answers[id]!==getQ(id).answer);
 $('main').innerHTML=`<div class="lesson-header"><div class="eyebrow">RESULT / ${s.mode==='mock'?'모의고사':'연습'} 결과</div><h1>결과와 헷갈린 개념을 확인하세요.</h1></div><section class="panel"><span class="pill ${s.expired?'extra':'green'}">${s.expired?'시간 종료 · 자동 제출':'풀이 완료'}</span><div class="score">${correct}<small> / ${s.ids.length}문항</small></div><p>정답률 ${Math.round(correct/s.ids.length*100)}% · ${s.mode==='mock'?'10점 환산 '+(correct/s.ids.length*10).toFixed(1)+'점 (학습용)':`채점 ${graded}문항, 미채점 ${s.ids.length-graded}문항`}</p><div class="row"><button class="btn primary" id="retry-missed" ${!missed.length?'disabled':''}>이번에 틀린 / 미완료 문제 다시 풀기</button><button class="btn" id="result-menu">다른 문제 풀기</button><button class="btn" id="result-stats">학습 현황</button></div></section><div class="section-head"><h2>문항별 답과 해설</h2><span class="count">${s.ids.length} QUESTIONS</span></div>${s.ids.map((id,i)=>reviewCard(getQ(id),s.graded[id]?s.answers[id]:undefined,i+1)).join('')}${footer()}`;
 $('retry-missed').onclick=()=>startQuiz(missed.map(getQ),'practice');$('result-menu').onclick=()=>go('practice');$('result-stats').onclick=()=>go('stats');bindUnitActions();bindCoreActions();
}
function reviewCard(q,answer,n){const correct=answer===q.answer;return `<article class="review-item"><div class="row"><span class="pill ${correct?'green':'extra'}">${n}. ${correct?'정답':answer===undefined||answer===null?'미응답 / 미채점':'오답'}</span><span class="count">${getU(q.unit).title}</span><span class="pill ${q.guide?'':'extra'}">${esc(scopeTitles[q.scope]||'이전 학습')}</span></div><h3>${esc(q.stem)}</h3>${q.code?`<pre class="question-code"><code>${esc(q.code)}</code></pre>`:''}${answer===undefined||answer===null?'<p>선택한 답이 없습니다.</p>':correct?`<p>내 답: ${'ABCD'[answer]}. ${esc(q.options[answer].text)}</p>`:`<div class="reason wrong"><b>내 답 ${'ABCD'[answer]}. ${esc(q.options[answer].text)}</b>${choiceExplanation(q.options[answer])}</div>`}<div class="reason right"><b>정답 ${'ABCD'[q.answer]}. ${esc(q.options[q.answer].text)}</b>${choiceExplanation(q.options[q.answer])}</div><section><h3>나머지 선택지의 개념·이유</h3><ul class="review-options">${q.options.map((o,i)=>i!==q.answer&&(correct||i!==answer)?`<li><b>${'ABCD'[i]}. ${esc(o.text)}</b>${choiceExplanation(o)}</li>`:'').join('')}</ul></section><p class="question-origin"><b>문제 근거</b> ${esc(q.sourceDetail)}${questionSourceLinks(q)}</p><div class="row" style="margin-top:16px"><button class="btn small" ${q.focusTopic||q.courseTopic?`data-core="${q.focusTopic||q.courseTopic}"`:`data-learn="${q.unit}"`}>개념 복습</button></div></article>`;}

<p class="publication-note">웹 학습판 · 원본 가이드와 문제지 PDF는 포함하지 않았습니다. 출처에 표시된 문서와 쪽수는 가지고 있는 배포 자료에서 확인하세요. 학습 기록은 현재 기기의 브라우저에 저장됩니다.</p>
<script>
// Source documents remain on the learner's PC; retain their labels without broken links.
(() => {
  const adaptSourceLinks = () => {
    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(href)) return;
      const label = document.createElement('span');
      label.className = 'publication-source-label';
      label.textContent = a.textContent + ' · 배포 자료 참조';
      label.title = decodeURI(href);
      a.replaceWith(label);
    });
  };
  adaptSourceLinks();
  new MutationObserver(adaptSourceLinks).observe(document.body, {childList:true, subtree:true});
})();
</script>
