// These small examples explain the concepts; original questions and source references stay unchanged.
const plainLessons = {};
const lessonFlow = (title, ...nodes) => ({kind:'flow', title, nodes});
const lessonTable = (title, headers, rows) => ({kind:'table', title, headers, rows});
function explainQuestion(id, idea, steps, diagram, choices, remember) {
  plainLessons[id] = {idea, steps, diagram, choices:choices.map(text=>{
    const [meaning, example, why] = text.split(' | ');
    return {meaning, example, why};
  }), remember};
}

explainQuestion('b01','CSV는 표를 담은 파일이고, pandas는 그 표를 다루는 Python 도구예요.',
 ['먼저 read_csv로 파일을 읽어 Python 안에 표를 만듭니다.','그 표에 head()를 붙이면 앞부분을 보여줍니다. 기본값은 앞 5행이에요.'],
 lessonFlow('파일을 열고 → 내용 맛보기','CSV 파일','read_csv: 표로 읽기','head: 앞 5행 보기'),[
 'read_csv는 표를 읽고, head는 표의 앞부분을 보여줘요. | 명단.csv를 읽은 뒤 맨 위 사람 5명을 확인합니다. | 파일을 읽기 → 내용 확인 순서여서 맞아요.',
 'head는 앞부분 보기, merge는 두 표를 이어 붙이기예요. | 이미 읽어 둔 명단의 앞부분을 보거나 명단과 부서표를 연결합니다. | 두 기능 모두 CSV 파일을 처음 읽는 단계가 빠져 있어요.',
 'nunique는 중복을 빼고 몇 종류인지 세는 기능이에요. | 사과·사과·배는 2종류예요. | 종류를 세려면 자료가 먼저 있어야 해요. 읽기도 전에 셀 수는 없어요.',
 'groupby는 같은 것끼리 묶기, fillna는 빈칸 채우기예요. | 부서별로 묶거나 비어 있는 예산을 0으로 채웁니다. | 파일 읽기와 앞부분 확인을 하는 조합이 아니에요.'
 ],'CSV 읽기 = read_csv / 앞부분 확인 = head');

explainQuestion('b02','가장 큰 사업의 “한 줄 전체”를 고르려는 문제예요.',
 ['예산을 큰 순서로 정렬하면 가장 큰 사업이 맨 위로 옵니다.','ascending=False는 큰 것부터, iloc[0]은 첫 번째 행을 뜻해요. Python은 위치를 0부터 셉니다.'],
 lessonTable('예산 10·50·30을 큰 순서로 놓으면',['순서','예산','선택'],[['0번','50','← iloc[0]'],['1번','30',''],['2번','10','']]),[
 'ascending=True는 작은 값부터 정렬해요. | 10 → 30 → 50 순서가 됩니다. | 여기서 첫 행을 고르면 가장 작은 예산 사업이에요.',
 'mean은 평균이에요. | (10+50+30)÷3 = 30이에요. | 평균 숫자 하나가 나오지, 가장 큰 사업의 행이 나오지는 않아요.',
 'nunique는 서로 다른 값의 종류 수예요. | 예산 값이 10·50·30이면 3종류예요. | 예산 크기의 순위를 구하는 기능이 아니에요.',
 'ascending=False는 큰 값부터, iloc[0]은 첫 행 선택이에요. | 50 → 30 → 10으로 놓고 50이 있는 행을 고릅니다. | 가장 큰 예산 사업의 정보를 한 행으로 얻어요.'
 ],'가장 큰 행: 큰 순서(False)로 정렬 → 첫 행(0)');

explainQuestion('b03','“몇 칸인가?”와 “몇 종류인가?”는 다른 질문이에요.',
 ['A가 두 번 나와도 종류로는 A 한 종류예요.','빈칸은 빼고 A·B만 남기면 2종류입니다. nunique의 기본 동작이에요.'],
 lessonTable('A · A · B · 빈칸을 세 가지 방식으로 세기',['기능','세는 대상','결과'],[['nunique','중복을 뺀 A·B','2종류'],['count','A·A·B','3개'],['size','빈칸 포함 전체','4개']]),[
 'sum은 숫자들을 더하는 기능이에요. | 예산 10과 20을 더하면 30이에요. | 부서 종류를 구하는 덧셈이 아니에요.',
 '이 열의 size는 빈칸까지 포함한 전체 칸 수예요. | A·A·B·빈칸은 4칸이에요. | 종류가 아니라 자리 수를 세요.',
 'nunique는 같은 값을 한 번만 세는 기능이에요. | A·A·B에서 A·B만 세면 2종류예요. | 서로 다른 부서의 수를 물었으므로 맞아요.',
 'count는 값이 있는 칸을 세고 빈칸은 빼요. | A·A·B는 각각 세어서 3개예요. | 반복된 A도 다시 세기 때문에 종류 수와 달라요.'
 ],'종류는 nunique / 빈칸 제외 개수는 count / 전체 칸은 size');

explainQuestion('b04','빈칸도 “자리 하나”는 차지하지만, 들어 있는 값은 없어요.',
 ['count는 값이 있는 A·A·B만 세므로 3입니다.','size는 빈칸 자리도 포함하므로 4입니다.'],
 lessonTable('같은 열인데 세는 기준이 달라요',['칸','1','2','3','4'],[['내용','A','A','B','빈칸'],['count에 포함','예','예','예','아니요'],['size에 포함','예','예','예','예']]),[
 '두 결과를 모두 3으로 본 답이에요. | 값이 있는 칸만 세면 3이 맞아요. | size는 빈칸 자리도 세므로 두 번째 수가 4여야 해요.',
 'count=3은 채워진 칸, size=4는 전체 칸 수예요. | 사람 3명이 앉은 의자 4개처럼 생각해 보세요. | 값의 개수와 자리 수를 정확히 나눴어요.',
 '2는 A·B의 종류 수에 해당해요. | nunique라면 2가 나와요. | count는 같은 A를 각각 세고, size는 빈칸도 세므로 3·4예요.',
 '두 결과를 모두 4로 본 답이에요. | 전체 자리 수는 4가 맞아요. | count는 빈칸을 제외하므로 첫 번째 수가 3이어야 해요.'
 ],'값 3개, 자리 4개 → count 3 / size 4');

explainQuestion('b05','먼저 분야별로 나누고, 나뉜 묶음마다 사업 수와 예산 합계를 따로 계산해요.',
 ['groupby는 같은 분야를 한 묶음으로 모읍니다.','agg는 묶음마다 어떤 계산을 할지 적는 곳이에요. 사업명에 count, 예산에 sum처럼 지정합니다. 사업명에 빈칸이 있으면 count는 그 칸을 빼요.'],
 lessonTable('사업명이 모두 채워진 작은 표의 집계',['분야','사업 예산','사업 수','예산 합계'],[['교육','10, 20','2','30'],['복지','50','1','50']]),[
 'groupby는 묶기, agg는 묶음마다 할 계산을 정하기예요. | 교육 묶음의 사업 2개와 예산 합계 30을 함께 구합니다. | 분야별로 두 종류의 계산을 한 번에 지정할 수 있어요.',
 '분야의 nunique는 분야가 몇 종류인지 세어요. | 교육·교육·복지는 2종류예요. | 분야별 사업 수나 예산 합계까지는 알려 주지 않아요.',
 '전체 mean은 모든 사업의 평균 예산 하나예요. | (10+20+50)÷3을 계산해요. | 분야를 나누지도 않고 합계도 구하지 않아요.',
 '정렬 후 첫 행 선택은 조건에 따라 사업 하나를 고르는 일이에요. | 예산순 첫 행은 가장 큰 사업일 수 있어요. | 모든 분야의 개수와 합계를 내야 하므로 부족해요.'
 ],'분야별로 묶기(groupby) → 계산 지정(agg)');

explainQuestion('b06','기호의 밑줄 같은 “=”가 붙어 있으면 경계 숫자도 포함해요.',
 ['>=는 크거나 같다는 뜻입니다.','9는 제외, 10과 11은 포함합니다. 그래서 “10 이상”이에요.'],
 lessonTable('경계 숫자 10도 들어갈까요?',['값','9','10','11'],[['>= 10','거짓','참','참'],['> 10','거짓','거짓','참']]),[
 '초과는 경계 숫자보다 커야 해요. | > 10이면 11은 포함하지만 10은 제외해요. | 문제에는 =가 붙어 있어 10도 포함됩니다.',
 '미만은 경계 숫자보다 작아야 해요. | < 10이면 9를 골라요. | 조건의 방향이 반대예요.',
 '같은 값만 고르는 조건은 ==예요. | == 10이면 10만 고릅니다. | >= 10은 11이나 12도 포함해요.',
 '이상은 크거나 같은 값을 뜻해요. | 10·11·12가 모두 들어갑니다. | >=의 뜻과 정확히 같아요.'
 ],'>= 이상 / > 초과 / <= 이하 / < 미만');

explainQuestion('b07','“정확히 같은 글”을 찾는 것과 “그 단어가 들어 있는 글”을 찾는 것은 달라요.',
 ['"성인 청소년"도 청소년이라는 단어를 포함합니다.','str.contains는 그 단어가 안에 있는지 검사하므로 두 행을 고릅니다.'],
 lessonTable('찾을 단어: 청소년',['문자열','== "청소년"','contains("청소년")'],[['청소년','선택','선택'],['성인 청소년','제외','선택'],['성인','제외','제외']]),[
 '== "성인"은 내용 전체가 성인인 값만 골라요. | 세 번째 행만 남습니다. | 찾으려는 단어부터 달라요.',
 'nunique는 문장 종류의 개수예요. | 세 문장이 서로 다르면 3종류예요. | 특정 단어가 포함된 행을 고르는 검사가 아니에요.',
 'contains는 글 안에 찾는 말이 들어 있는지 확인해요. | "성인 청소년" 안에도 "청소년"이 있어요. | 첫째와 둘째 행을 모두 선택해요.',
 '==는 문자열 전체가 똑같아야 참이에요. | "청소년"은 맞지만 "성인 청소년"은 다릅니다. | 함께 포함된 둘째 행을 놓쳐요.'
 ],'딱 같은 글은 == / 안에 들어 있으면 contains');

explainQuestion('b08','빈칸 하나만 있어도 지우면 안 되고, 두 칸이 모두 빈 줄만 지워야 해요.',
 ['isna는 “빈칸인가?”를 묻고, notna는 “값이 있나?”를 물어요.','&는 두 조건이 모두 참일 때만 참입니다.'],
 lessonTable('지울 행 찾기',['예산','참여인원','둘 다 빈칸?'],[['빈칸','빈칸','지움'],['100','빈칸','유지'],['빈칸','20','유지'],['100','20','유지']]),[
 'isna와 notna를 연결하면 앞 칸은 비고 뒤 칸은 찬 행이에요. | 예산은 빈칸, 참여인원은 20인 행을 고릅니다. | 둘 다 빈 행을 고르는 조건과 달라요.',
 'isna 두 개를 &로 연결하면 두 칸 모두 비어야 해요. | 예산도 빈칸이고 참여인원도 빈칸인 줄입니다. | 지우려는 행과 정확히 같아요.',
 '두 조건을 |로 연결하면 하나만 참이어도 참이에요. | 예산만 비어도 지울 대상으로 잡혀요. | 값 하나가 남은 행까지 지우게 돼요.',
 'notna 두 개는 두 칸 모두 값이 있는 경우예요. | 예산 100, 참여인원 20인 줄입니다. | 빈 행이 아니라 잘 채워진 행을 고르는 조건이에요.'
 ],'둘 다 = AND(&) / 하나라도 = OR(|)');

explainQuestion('b09','dropna는 빈칸 조건에 맞는 행을 없애는 기능이에요.',
 ['subset은 검사할 열을 예산과 참여인원으로 한정합니다.','how="all"은 그 두 칸이 전부 비었을 때만 행을 없애요.'],
 lessonTable('all과 any를 나란히 비교',['예산·인원','all: 모두 비면','any: 하나라도 비면'],[['빈칸·빈칸','삭제','삭제'],['100·빈칸','유지','삭제'],['100·20','유지','유지']]),[
 'all은 검사 대상이 모두 빈칸이어야 한다는 뜻이에요. | 두 칸이 다 빈 행만 지워요. | 한 칸이라도 값이 있으면 남겨야 하므로 맞아요.',
 'any는 검사 대상 중 하나라도 빈칸이면 지워요. | 예산이 있어도 참여인원이 비면 지워요. | 문제에서 남겨야 할 행까지 지워요.',
 '0으로 바꾸기는 값을 고치는 일이에요. | 빈 예산 칸에 숫자 0을 넣어요. | 행 자체를 제거하라는 요구와 달라요.',
 '정렬은 행의 위치만 바꾸는 일이에요. | 예산이 큰 순서로 줄을 세워요. | 빈 행은 그대로 남습니다.'
 ],'dropna: all은 모두 빈 행 / any는 하나라도 빈 행');

explainQuestion('b10','평균으로 빈칸만 메우고, 이미 있는 숫자는 그대로 두려는 문제예요.',
 ['10·빈칸·30의 평균은 빈칸을 제외한 (10+30)÷2=20이에요.','fillna(20)을 하면 빈 자리만 20으로 채워집니다.'],
 lessonFlow('평균을 구한 뒤 빈 자리만 채우기','10 · 빈칸 · 30','mean → 20','fillna(20)','10 · 20 · 30'),[
 'dropna는 빈칸이 있는 항목을 제거해요. | 10·빈칸·30에서 10·30만 남깁니다. | 빈칸을 채우지 않고 없애 버려요.',
 'nunique는 값의 종류 수를 세어요. | 10·빈칸·30은 기본적으로 2종류예요. | 평균 계산이나 빈칸 채우기를 하지 않아요.',
 'sort_values는 값 순서로 정렬해요. | 30·10을 10·30으로 바꿔요. | 빈칸에 들어갈 숫자를 만들지 않아요.',
 'fillna는 빈칸 채우기, mean은 평균 구하기예요. | 먼저 20을 구한 뒤 빈칸에만 20을 넣습니다. | 계산할 값과 채울 위치가 모두 요구와 맞아요.'
 ],'fillna(채울 값) / 평균으로 채우면 fillna(mean())');

explainQuestion('b11','“합계”는 그 묶음의 돈을 모두 더한 금액이에요.',
 ['교육 분야 예산이 10·10·40이라고 생각해 보세요.','sum은 60, mean은 20, count는 3, nunique는 2예요. 무엇을 물었는지 구분합니다.'],
 lessonTable('같은 숫자 10·10·40을 계산해도',['계산','답','뜻'],[['sum','60','총예산'],['mean','20','평균 예산'],['count','3','값이 있는 사업 수'],['nunique','2','서로 다른 예산 값 수']]),[
 'nunique는 서로 다른 값의 종류 수예요. | 10과 40, 두 종류입니다. | 예산 금액을 더하지 않아요.',
 'count는 값이 있는 칸의 수예요. | 숫자 세 개가 있으니 3이에요. | 사업 수를 세는 것과 총금액을 구하는 것은 달라요.',
 'sum은 값을 전부 더해요. | 10+10+40=60이에요. | 분야별 총예산을 얻는 계산이에요.',
 'mean은 합계를 값의 개수로 나눈 평균이에요. | 60÷3=20이에요. | 합계 60이 아니라 한 사업당 평균 20이 나와요.'
 ],'총금액은 sum / 평균 금액은 mean');

explainQuestion('b12','가장 큰 “숫자”가 아니라 그 숫자의 “시도 이름”을 찾고 있어요.',
 ['groupby로 시도별로 묶고 mean으로 평균 예산을 구합니다.','max는 최대 금액, idxmax는 그 금액이 붙어 있는 이름을 돌려줘요.'],
 lessonTable('시도별 평균 예산이 다음과 같다면',['시도','평균 예산'],[['가도','20'],['나도','50 ← max'],['idxmax 결과','나도']]),[
 'head는 앞부분 몇 행을 보여줘요. | 현재 표의 맨 위 5행을 확인합니다. | 예산이 가장 큰 시도를 찾아주는 기능이 아니에요.',
 'idxmax는 가장 큰 값이 있는 곳의 이름을 돌려줘요. | 50이 나도에 붙어 있으면 "나도"가 나와요. | 문제에서 필요한 시도 이름을 얻어요.',
 'max는 가장 큰 값 자체예요. | 위 표에서 50이 나옵니다. | 50만으로는 시도 이름을 알 수 없어요.',
 'count는 값이 있는 자료 수예요. | 시도별 사업 예산이 몇 개 채워졌는지 셉니다. | 평균이 가장 큰 시도의 이름을 찾지 않아요.'
 ],'max = 최대 숫자 / idxmax = 그 숫자의 이름');

explainQuestion('b13','노쇼면 1, 아니면 0이라는 표시는 “노쇼만 한 번씩 세는 스위치”처럼 쓸 수 있어요.',
 ['예약 5건의 라벨이 1·0·1·0·0이면 합계는 노쇼 2건입니다.','평균은 2÷5=0.4, 즉 노쇼 비율 40%입니다.'],
 lessonFlow('0·1 평균이 비율이 되는 이유','1 + 0 + 1 + 0 + 0','합계 2 = 노쇼 건수','2 ÷ 전체 5건','0.4 = 40%'),[
 '비율은 전체 중에서 얼마나 차지하는지예요. | 5건 중 2건이면 2/5=40%예요. | 0·1을 평균 내면 바로 1인 항목의 비율이 돼요.',
 '건수는 발생한 횟수예요. | 노쇼가 두 번이면 2건이에요. | 건수는 sum 결과이고, mean은 거기서 전체 건수로 나눈 값이에요.',
 '시설 종류 수는 회의실·체육관처럼 서로 다른 시설을 세는 값이에요. | 노쇼가 회의실에서만 생겼다면 시설은 1종류일 수 있어요. | 라벨 평균에는 시설 이름을 세는 과정이 없어요.',
 '최댓값은 가장 큰 라벨 하나예요. | 0·1 중 하나라도 1이 있으면 max는 1이에요. | 5건 중 몇 건인지 비율은 알려 주지 않아요.'
 ],'0·1 라벨의 sum = 1의 건수 / mean = 1의 비율');

explainQuestion('b14','조건을 검사한 결과도 더할 수 있어요. 참(True)은 1, 거짓(False)은 0처럼 셉니다.',
 ['지자체 수가 5·10·12라면 >=10 검사 결과는 거짓·참·참입니다.','이를 더하면 0+1+1=2이므로 조건에 맞는 사업은 2개예요.'],
 lessonTable('조건 → 참/거짓 → 개수',['지자체 수','5','10','12'],[['>= 10','False','True','True'],['더할 때','0','1','1']]),[
 '전체 행 수는 조건과 무관한 모든 줄 수예요. | 세 사업이면 전체는 3줄이에요. | 조건에 안 맞는 5인 행은 합산에 0으로 들어가요.',
 '서로 다른 값만 세기는 nunique 같은 계산이에요. | 10·10·12를 종류로 세면 2종류예요. | 이 코드는 조건을 만족한 두 개의 10도 각각 세어요.',
 '평균은 합계를 개수로 나눈 값이에요. | 참·참·거짓 평균은 2/3이에요. | 코드에는 mean이 아니라 sum이 있어요.',
 'True를 1, False를 0처럼 합산하는 방식이에요. | 0+1+1=2가 됩니다. | 참인 행 하나마다 1씩 더해 조건 만족 건수를 얻어요.'
 ],'조건.sum() = 조건을 만족한 행 수');

explainQuestion('b15','“자료가 충분한 시도인가?”와 “그 시도의 비율이 큰가?”를 따로 확인해야 해요.',
 ['size로 그 시도에 자료가 30건 이상 있는지 확인합니다.','남은 시도끼리 0·1 라벨의 mean, 즉 1의 비율을 비교해요.'],
 lessonTable('먼저 30건 기준을 통과시켜요',['시도','전체 건수(size)','1의 비율(mean)','비교 대상'],[['가도','10','90%','제외'],['나도','40','50%','포함'],['다도','60','30%','포함']]),[
 '첫 30행은 파일의 위쪽 30줄이에요. | 여러 시도의 일부 행만 잘라낼 수 있어요. | 시도마다 30건 이상인지 검사하는 것과 달라요.',
 'nunique는 값의 종류 수예요. | 0·1 라벨은 보통 많아야 2종류예요. | 자료가 100건이어도 종류는 2라서 건수 기준으로 쓸 수 없어요.',
 'size로 자료 수를 확인하고 mean으로 1의 비율을 구해요. | 40건 중 20건이 1이면 size=40, mean=0.5예요. | 30건 기준과 비율 비교를 각각 정확한 계산으로 처리해요.',
 '라벨 sum은 1의 건수예요. | 전체 40건 중 20건이 1이면 sum=20이에요. | 전체 40건은 기준을 통과해야 하는데 sum>=30으로는 탈락시켜요. 비율과 건수도 달라요.'
 ],'비교 대상 고르기 = size / 1의 비율 비교 = mean');

explainQuestion('b16','표를 붙일 때 컴퓨터는 “같은 뜻”보다 “키 값이 정확히 같은지”를 봐요.',
 ['"1"과 "01"은 사람이 보면 같은 코드일 수 있지만 문자열은 다릅니다.','두 표를 같은 자료형과 길이로 맞춥니다. "1".zfill(2)는 "01"이 돼요.'],
 lessonFlow('같은 지역을 같은 글자로 표현하기','왼쪽 "01" / 오른쪽 "1"','양쪽을 문자열로','zfill(2): 두 자리 맞춤','"01" = "01" → 연결'),[
 '키는 어느 지역인지 연결해 주는 이름표예요. | 지역코드가 같으면 같은 지역의 두 표를 붙여요. | 한쪽 키를 지우면 연결 기준이 없어져요.',
 'zfill은 정한 길이까지 앞에 0을 붙여요. | 문자열 "1"은 "01", "12"는 그대로 "12"예요. | 같은 지역의 키를 같은 모양으로 만들어요.',
 '정렬은 행의 순서만 바꿔요. | "1"을 맨 위로 올려도 글자는 "1"이에요. | "01"과의 값 차이를 고치지 못해요.',
 '평균은 수치의 대표 크기를 구해요. | 1과 3의 평균은 2예요. | 지역코드는 계산할 금액이 아니라 지역을 가리키는 이름표예요.'
 ],'표 결합 전: 연결할 키의 자료형·표현부터 통일');

explainQuestion('b17','inner join은 양쪽 명단에 공통으로 있는 것만 남기는 표 결합이에요.',
 ['왼쪽 A·B·C와 오른쪽 B·C·D를 비교합니다.','두 곳에 모두 있는 B와 C만 연결됩니다.'],
 lessonTable('키가 어느 표에 있나요?',['키','왼쪽','오른쪽','inner 결과'],[['A','있음','없음','제외'],['B','있음','있음','포함'],['C','있음','있음','포함'],['D','없음','있음','제외']]),[
 '공통 키만 남기는 것이 inner join이에요. | 양쪽에 있는 B·C만 남아요. | 어느 한쪽에만 있는 A·D는 제외되므로 맞아요.',
 '왼쪽 키를 모두 유지하는 것은 left join의 기준이에요. | 왼쪽 A·B·C를 남깁니다. | inner에서는 오른쪽에 없는 A가 빠져요.',
 '오른쪽 키를 모두 유지하는 것은 right join의 기준이에요. | 오른쪽 B·C·D를 남깁니다. | inner에서는 왼쪽에 없는 D가 빠져요.',
 '양쪽 키를 모두 유지하는 것은 outer join의 기준이에요. | A·B·C·D를 전부 남깁니다. | 공통 부분만 남기라는 inner의 뜻과 달라요.'
 ],'inner = 양쪽에 모두 있는 키');

explainQuestion('b18','키가 같아도 행을 하나로 합쳐 버리지는 않아요. 맞는 조합을 모두 만듭니다.',
 ['왼쪽 K 행을 L1·L2, 오른쪽 K 행을 R1·R2·R3이라고 불러 볼게요.','L1도 오른쪽 3행과 연결되고 L2도 3행과 연결돼 총 6행입니다.'],
 lessonTable('같은 K에서 생기는 조합',['왼쪽 행','연결되는 오른쪽 행','결과 수'],[['L1','R1, R2, R3','3행'],['L2','R1, R2, R3','3행'],['합계','2 × 3','6행']]),[
 '2행은 왼쪽 표의 기존 행 수예요. | L1과 L2가 두 행입니다. | 각 행이 오른쪽 3행과 연결되어 복수의 결과 행을 만들어요.',
 '3행은 오른쪽 표의 기존 행 수예요. | R1·R2·R3가 세 행입니다. | 오른쪽 각 행도 왼쪽 두 행과 각각 연결돼요.',
 '키 하나와 결과 행 하나는 같은 뜻이 아니에요. | K라는 이름표 하나에 서로 다른 자료 여러 줄이 붙을 수 있어요. | merge는 같은 키를 자동으로 한 줄로 요약하지 않아요.',
 '여러 행끼리 연결하면 가능한 조합 수만큼 늘어날 수 있어요. | 왼쪽 2행 × 오른쪽 3행 = 6행이에요. | 모든 행의 키가 K여서 서로 연결될 수 있어요.'
 ],'키 중복 확인! 같은 키 2행 × 3행 → 6행');

explainQuestion('b19','먼저 가운데 구간의 폭을 구하고, 그 폭의 1.5배를 Q3 위에 더해요.',
 ['IQR = Q3−Q1 = 20−10 = 10입니다.','위쪽 기준선 = Q3 + 1.5×IQR = 20+15 = 35입니다.','“35 초과”는 >35예요. 35 자체는 제거하지 않아요.'],
 lessonFlow('기준선 계산과 경계값 판단을 나누기','Q1 10 ─ Q3 20','IQR 10','20 + 1.5×10 = 35','35 유지 / 36 제거'),[
 '30은 Q3에 IQR 한 배만 더한 수예요. | 20+10=30입니다. | 문제는 1.5배를 더하므로 기준선이 35예요.',
 '20은 Q3 자체예요. | 가운데 50% 구간의 오른쪽 끝입니다. | 여기에 여유 폭 1.5×IQR을 더해야 해요.',
 '상한 35를 넘는 값만 제거한다는 뜻이에요. | 35는 같고, 36은 넘어요. | 계산도 맞고 “초과”의 경계 처리도 맞아요.',
 '35까지 제거하려면 “35 이상” 조건이어야 해요. | >=35는 35를 포함해요. | 문제는 “초과”이므로 =를 포함하면 안 돼요.'
 ],'상한 = Q3 + 1.5×IQR / 초과는 경계값 제외');

explainQuestion('b20','중앙값은 “지금 남아 있는 자료”의 가운데 값이라, 자료를 지우면 바뀔 수 있어요.',
 ['1·2·3·100의 중앙값은 (2+3)÷2=2.5입니다.','100을 빼면 1·2·3의 중앙값은 2가 됩니다.','예를 들어 “중앙값 이상이면 1”이라면 값 2의 라벨은 0에서 1로 달라져요.'],
 lessonTable('왜 정리한 뒤 라벨을 만들까요?',['자료','중앙값','값 2의 라벨(중앙값 이상=1)'],[['1, 2, 3, 100','2.5','0'],['1, 2, 3','2','1']]),[
 '평균은 모두 더해 나누기, 중앙값은 정렬한 가운데 값이에요. | 1·2·100의 평균은 약 34.3, 중앙값은 2예요. | 서로 다른 기준이므로 라벨도 항상 같지 않아요.',
 '라벨은 기준에 따라 붙이는 정답 표시예요. | 기준이 2.5에서 2로 바뀌면 값 2의 표시도 바뀔 수 있어요. | 자료 정리 후 중앙값을 다시 계산해야 하는 이유예요.',
 '기준이 바뀌어도 모든 라벨이 항상 같다고 가정한 답이에요. | 값 2가 새 기준을 넘게 되는 사례가 있어요. | 남아 있는 행이라도 라벨이 달라질 수 있어요.',
 '중앙값으로 나눠도 같은 값이 여러 개면 두 집단 크기가 다를 수 있어요. | 2·2·2에서 “중앙값 이상”은 세 값 모두예요. | 반드시 절반씩 나뉘지는 않아요.'
 ],'자료 정리 → 정리된 자료의 중앙값 → 라벨');

explainQuestion('b21','모델도 연습한 문제와 처음 보는 시험 문제를 나눠야 실력을 확인할 수 있어요.',
 ['train은 배우는 자료, test는 배운 뒤 실력을 확인하는 자료예요.','test_size=0.2는 전체의 20%를 테스트로 떼어 둔다는 뜻입니다. 100건이면 20건이에요.'],
 lessonTable('100건을 두 묶음으로 나누기',['묶음','건수','하는 일'],[['train: 학습','80','입력과 정답을 보며 배우기'],['test: 평가','20','학습에 쓰지 않고 예측을 채점하기']]),[
 '학습은 연습, 테스트는 처음 보는 자료로 치르는 평가예요. | 80건으로 배우고 남긴 20건으로 평가합니다. | 테스트 비율 20%와 두 묶음의 역할이 모두 맞아요.',
 '20건 학습·80건 평가는 테스트 비율이 80%예요. | test_size=0.8에 해당하는 규모예요. | 문제의 0.2를 학습 비율로 뒤집어 읽었어요.',
 '건수는 맞지만 역할이 뒤집혀 있어요. | train에서 배우고 test에서 평가해야 해요. | train은 평가용, test는 학습용이라는 해석이 틀려요.',
 '학습에 이미 쓴 자료는 독립적인 새 시험지가 아니에요. | 외웠던 문제 20개를 다시 풀면 점수가 높을 수 있어요. | 100건 모두로 학습한 뒤 그 일부로는 독립 평가를 할 수 없어요.'
 ],'test_size=0.2 → 20%는 평가용으로 남겨 두기');

explainQuestion('b22','random_state는 무작위로 섞는 과정을 다시 똑같이 실행할 수 있게 하는 설정이에요.',
 ['카드를 섞는 방법에 번호표를 붙인다고 생각해 보세요.','입력 자료·행 순서·설정이 같고 같은 번호를 쓰면 같은 분할을 다시 얻을 수 있어요. 42 자체가 특별한 정답 숫자는 아니에요.'],
 lessonFlow('같은 조건에서 분할을 다시 만들기','같은 자료 + 같은 행 순서','같은 분할 설정 + 시드 42','같은 train/test 분할'),[
 '행 순서는 컴퓨터가 자료를 받는 순서예요. | A·B·C와 C·A·B는 입력 순서가 달라요. | 같은 위치를 뽑더라도 사람이 달라질 수 있어 “반드시 같은 행”은 아니에요.',
 'stratify는 정답 종류의 비율을 고려해서 나누는 설정이에요. | 원래 정상:위험이 8:2이면 그 비율을 고려해요. | 섞기를 반복하는 random_state와 비율을 챙기는 stratify는 역할이 달라요.',
 '모델마다 자료에서 배우는 방법이 달라요. | 같은 시험지를 풀어도 두 모델의 점수는 다를 수 있어요. | 분할을 같게 하는 설정이 모델 성능까지 같게 하지는 않아요.',
 '재현은 같은 조건의 결과를 다시 얻는다는 뜻이에요. | 같은 자료와 설정으로 다시 나누면 같은 결과가 나와요. | random_state의 역할을 정확히 설명했어요.'
 ],'random_state = 같은 조건의 무작위 작업 재현');

explainQuestion('b23','stratify는 “한쪽 묶음에 위험 사례가 몰리지 않게, 원래 비율을 고려해서 나누기”예요.',
 ['전체 100건이 정상 80·위험 20이라고 해 볼게요.','20%를 테스트로 떼면 정상 16·위험 4 정도로 나눠 원래 8:2 비율을 유지하도록 합니다. 건수 때문에 정확한 비율이 안 맞을 때도 있어요.'],
 lessonTable('원래 8:2를 각 묶음에서도 고려',['자료','정상','위험'],[['전체 100','80','20'],['학습 80','64','16'],['테스트 20','16','4']]),[
 '정렬은 값의 순서대로 줄 세우는 일이에요. | 예산이 작은 순서대로 배치합니다. | stratify는 예산순 정렬이 아니라 라벨 비율을 고려한 분할이에요.',
 'X는 예측에 참고할 정보이고 y는 맞혀야 할 정답이에요. | 노쇼여부가 정답이라면 X에 그 답을 미리 주면 안 돼요. | stratify=y는 y를 분할 기준으로 보는 것이지 입력 X에 복사하는 것이 아니에요.',
 '원래 비율을 고려해 각 묶음에 배정해요. | 8:2인 자료를 학습·테스트에서도 비슷한 비율로 나눠요. | 소수인 위험 사례도 양쪽에 적절히 들어가게 하는 목적이에요.',
 '5:5는 두 종류의 수가 같은 상태예요. | 정상 50·위험 50이면 5:5예요. | stratify는 원래 8:2를 무조건 5:5로 바꾸는 기능이 아니에요.'
 ],'stratify = 원래 라벨 비율 고려 / 5:5 강제 아님');

explainQuestion('b24','맞혀야 할 정답을 문제지에 써 놓으면 높은 점수가 나와도 실력인지 알 수 없어요.',
 ['y가 노쇼여부라면 모델이 맞혀야 할 답은 “노쇼인지”입니다.','X에도 노쇼여부를 넣으면 모델이 답을 보고 맞히는 셈이에요. 이것을 정답 정보 누출이라고 해요.'],
 lessonTable('문제지와 정답지 구분',['역할','넣을 정보의 예'],[['X: 예측에 쓸 정보','예약 시간, 시설 종류 등 예측 시 아는 정보'],['y: 맞혀야 할 정답','노쇼여부'],['누출된 X','예약 시간 + 시설 종류 + 노쇼여부 ← 답이 들어감']]),[
 '자료가 적으면 배울 사례가 부족할 수 있어요. | 예약 사례 3건만으로는 충분히 배우기 어려울 수 있어요. | 이 문제에서 직접 보이는 실수는 건수 부족이 아니라 X에 정답을 넣은 일이에요.',
 '정답 정보 누출은 미리 알면 안 되는 답이 학습 과정에 들어오는 일이에요. | 정답지의 노쇼여부를 입력 자료에도 넣었어요. | 실제 예측할 때는 모를 답을 이미 줬으므로 평가가 믿기 어려워져요.',
 '불균형은 한 종류가 훨씬 많은 상태예요. | 정상 99건, 노쇼 1건 같은 경우예요. | 라벨 비율과 관계없이 정답을 X에 넣는 것 자체가 문제예요.',
 '척도 차이는 숫자 크기의 범위가 다른 상태예요. | 나이는 수십, 금액은 수백만일 수 있어요. | 숫자 크기를 조절해도 X에 들어간 정답 정보는 없어지지 않아요.'
 ],'X에는 예측할 때 아는 정보만 / 맞힐 답 y는 따로');

explainQuestion('b25','fit은 배우기, predict는 배운 것으로 답을 내보기예요.',
 ['학습용 입력 X_train과 그 정답 y_train을 함께 주어 fit합니다.','그다음 테스트 입력 X_test만 주고 predict해서 예측값을 얻습니다. y_test는 나중에 채점할 때 씁니다.'],
 lessonFlow('배우기 → 답 내기 → 채점하기','X_train + y_train → fit','X_test → predict','예측값과 y_test 비교'),[
 'fit은 학습, predict는 예측이에요. | 예제와 정답으로 배운 뒤 새 문제의 답을 냅니다. | 학습용과 평가용의 역할을 올바르게 나눴어요.',
 '테스트 자료로 배우면 그 자료는 새 시험지가 아니게 돼요. | 시험 답을 외운 뒤 같은 시험을 보는 셈이에요. | 테스트 평가 점수를 독립적인 실력으로 보기 어려워요.',
 'y_test는 입력 정보가 아니라 채점용 정답이에요. | 새 예약의 시설·시간을 줘야 하는데 정답 목록을 준 셈이에요. | 예측할 입력도 잘못됐고, 배우기보다 예측이 앞서 있어요.',
 '정답 복사는 예측을 수행한 결과가 아니에요. | 정답지를 그대로 답안지에 베끼면 100점이겠지요. | 새 자료의 답을 스스로 맞힐 수 있는지 평가하지 못해요.'
 ],'fit(학습 입력, 학습 정답) → predict(테스트 입력)');

explainQuestion('b26','이름만 보고 고르면 헷갈려요. LogisticRegression은 “어느 종류인가?”를 예측하는 모델이에요.',
 ['노쇼와 정상은 금액 같은 연속적인 숫자가 아니라 정해진 두 종류예요.','LogisticRegression은 이런 종류에 속할 가능성을 배우고 분류합니다.'],
 lessonTable('이름보다 무엇을 맞히는지 보기',['도구','예측하거나 하는 일'],[['LogisticRegression','정상 / 노쇼 같은 종류'],['LinearRegression','사용료 12,000원 같은 숫자'],['군집','정답 없이 비슷한 사례끼리 묶기'],['StandardScaler','입력 숫자의 크기 기준 맞추기']]),[
 'LinearRegression은 숫자 크기를 예측하는 회귀 모델이에요. | 사용료가 12,000원일지 예측합니다. | LogisticRegression을 같은 용도의 모델로 설명하면 틀려요.',
 '군집은 정답을 주지 않고 비슷한 자료끼리 묶어요. | 이용 패턴이 비슷한 시설을 자동으로 모아요. | 이 문제는 정상·노쇼라는 정답 종류를 배우는 분류예요.',
 '전처리는 모델에 넣기 좋게 자료를 바꾸는 작업이에요. | StandardScaler는 학습 자료에서 평균·표준편차를 배워 크기 기준을 맞춥니다. | LogisticRegression은 그 전처리 도구가 아니라 정답 종류를 예측하는 모델이에요.',
 '분류는 정해진 종류 중 하나를 고르는 예측이에요. | 새 예약을 정상 또는 노쇼로 예측합니다. | 이름에 Regression이 있어도 이 모델의 용도는 분류예요.'
 ],'LogisticRegression → 분류 / LinearRegression → 숫자 회귀');

explainQuestion('b27','전체 점수가 높아도, 꼭 찾아야 할 위험을 전부 놓치면 좋은 위험 탐지라고 할 수 없어요.',
 ['100건 중 정상 99건이므로 전부 정상이라고만 답해도 99개를 맞힙니다.','하지만 진짜 위험 1건을 놓쳤어요. 실제 위험 중 찾은 수는 0/1, 재현율 0%예요.'],
 lessonTable('“전부 정상”이라고 답했을 때',['실제 자료','예측','결과'],[['정상 99건','전부 정상','99건 정답'],['위험 1건','정상','위험 발견 0건'],['전체 정확도','99/100','99%'],['위험 재현율','0/1','0%']]),[
 '정확도는 전체 정답 비율, 재현율은 실제 위험 중 찾아낸 비율이에요. | 여기서는 각각 99%와 0%예요. | 두 지표는 보는 대상이 달라 항상 같지 않아요.',
 '회귀는 숫자 크기를 맞히는 예측이에요. | 집값이나 사용료 예측이 해당해요. | 이 문제는 정상·위험이라는 종류를 고르는 분류예요.',
 '위험 탐지는 실제 위험을 찾아내는 일이에요. | 위험 1건 중 발견한 것이 0건입니다. | 높은 전체 정확도가 위험을 잘 찾았다는 뜻은 아니라서 맞아요.',
 '실제 정상인데 정상이라고 예측하면 정답이에요. | 99건은 올바르게 맞혔어요. | 문제는 정상 99건이 아니라 위험 1건을 놓친 데 있어요.'
 ],'정확도만 보지 말고, 중요한 종류를 놓쳤는지도 확인');

explainQuestion('b28','두 지표는 위에 놓는 숫자 6은 같고, 아래에서 누구를 기준으로 보는지가 달라요.',
 ['위험이라고 예측한 8건 중 진짜 위험 6건: 정밀도=6/8=75%입니다.','실제 위험 10건 중 찾아낸 6건: 재현율=6/10=60%입니다.'],
 lessonTable('분모, 즉 “무엇 중에서?”를 먼저 고르기',['지표','기준 집단','맞게 찾은 위험','계산'],[['정밀도','위험이라고 예측한 8건','6건','6/8 = 75%'],['재현율','실제 위험 10건','6건','6/10 = 60%']]),[
 '2는 잘못 경고한 건수, 4는 놓친 위험 건수예요. | 8−6=2, 10−6=4입니다. | 정밀도·재현율은 잘못된 수가 아니라 맞게 찾은 6을 분자로 사용해요.',
 '정밀도는 내 경고의 정확함, 재현율은 실제 위험을 찾아낸 정도예요. | 경고한 8건 중 6건 / 실제 10건 중 6건입니다. | 두 분모를 올바르게 구분했어요.',
 '두 계산 모두 의미는 있지만 이름 순서가 뒤집혔어요. | 6/10은 재현율, 6/8은 정밀도예요. | 문제는 정밀도 다음 재현율을 물었어요.',
 '예측한 수와 실제 수를 그대로 나눈 값이에요. | 10/8은 100%도 넘어갑니다. | 맞게 찾은 수 6을 사용하지 않아 두 지표의 계산이 아니에요.'
 ],'정밀도: 내가 찍은 것 중 / 재현율: 실제 정답 중');

explainQuestion('b29','F1은 “내가 고른 것 중 진짜가 많은가”와 “실제 정답을 잘 찾아냈는가”를 함께 보는 점수예요. macro는 종류마다 같은 비중을 줘요.',
 ['F1은 정밀도(내 예측 중 진짜 정답 비율)와 재현율(실제 정답 중 찾아낸 비율)을 함께 반영해요. 둘 중 하나가 낮으면 F1도 낮아집니다.','이미 주어진 두 종류의 F1 점수 0.8과 0.4를 더합니다.','종류가 두 개이므로 2로 나누면 0.6이에요. 자료 수 90·10은 macro 평균의 가중치로 쓰지 않아요.'],
 lessonTable('똑같이 평균 낼까, 건수대로 비중을 줄까?',['방식','계산','결과'],[['macro','(0.8+0.4)÷2','0.6'],['건수로 가중한 평균','0.8×0.9 + 0.4×0.1','0.76']]),[
 'macro-F1은 종류별 F1을 같은 비중으로 평균 내요. | 0.8과 0.4의 가운데는 0.6이에요. | 두 종류를 동등하게 계산했으므로 맞아요.',
 '0.76은 자료 수에 따라 비중을 둔 평균이에요. | 90건인 종류에 90%, 10건인 종류에 10%를 줘요. | weighted 방식의 계산이며 macro와 달라요.',
 '0.8은 첫 번째 종류 하나의 점수예요. | 두 번째 종류의 0.4는 빠져 있어요. | 모든 종류의 점수를 평균 내야 해요.',
 '1.2는 두 점수의 합이에요. | 0.8+0.4=1.2예요. | 평균을 내려면 종류 수 2로 나눠야 해요.'
 ],'macro = 종류마다 같은 비중 / (각 F1의 합)÷종류 수');

explainQuestion('b30','전처리 기준도 시험 자료를 미리 보고 만들면 안 돼요.',
 ['StandardScaler는 평균과 표준편차를 이용해 숫자 크기 기준을 맞추는 도구예요. 표준편차는 숫자들이 평균 주위에 얼마나 흩어져 있는지 나타내는 값입니다.','fit은 기준 배우기, transform은 배운 기준으로 바꾸기입니다.','학습 자료에서만 기준을 배우고 테스트에는 그 기준을 그대로 적용해요.'],
 lessonTable('같은 자를 두 자료에 사용하기',['자료','실행','뜻'],[['train','fit_transform','여기서 자를 만들고 숫자 변환'],['test','transform','train에서 만든 같은 자로 변환']]),[
 '각각 fit하면 서로 다른 변환 기준을 만들어요. | train 평균은 10, test 평균은 20으로 따로 잡을 수 있어요. | 모델이 배운 기준과 테스트 입력의 기준이 달라지고 테스트 정보도 쓰게 돼요.',
 '전체 자료로 fit하면 테스트 자료의 숫자도 기준에 들어가요. | 평균 계산에 시험 자료까지 미리 섞는 셈이에요. | 테스트 정보가 학습 준비 과정에 들어오는 누출이에요.',
 'test에서 fit하면 시험 자료를 기준으로 삼아요. | 시험지의 숫자를 보고 자를 만듭니다. | 기준은 학습 자료에서 배워야 해요.',
 'train에서 기준을 만들고 test에는 적용만 해요. | train에서 배운 평균·표준편차를 test에도 그대로 씁니다. | 시험 자료를 미리 배우지 않고 같은 기준을 유지해요.'
 ],'fit은 train에서만 / test는 같은 도구로 transform');

explainQuestion('b31','명령행 인자는 실행할 때 파일명 뒤에 덧붙여 주는 정보예요.',
 ['python은 실행 프로그램, solution.py는 실행할 파일입니다.','Python 안의 sys.argv는 파일명부터 담아요. [0]은 파일명, [1]은 첫 번째로 넘긴 값 “점검”입니다.'],
 lessonTable('python solution.py "점검"을 실행하면',['위치','값','뜻'],[['실행 명령','python','Python 실행기'],['sys.argv[0]','solution.py','실행 파일명'],['sys.argv[1]','점검','첫 사용자 입력']]),[
 'python은 코드를 실행해 주는 프로그램 이름이에요. | 명령 맨 앞에서 실행기를 고릅니다. | sys.argv[1]에 들어가는 사용자 입력이 아니에요.',
 '결과 파일명은 코드가 별도로 만들어야 하는 이름이에요. | 코드에서 "결과_"+키워드+".csv"처럼 정할 수 있어요. | 입력에 없는 결과 파일명이 자동으로 argv[1]에 생기지 않아요.',
 '첫 번째 사용자 입력은 파일명 뒤의 값이에요. | 여기서는 따옴표로 전달한 "점검"입니다. | argv[1]의 실제 값이 맞아요.',
 'solution.py는 실행 중인 스크립트 파일명이에요. | 일반적인 직접 실행에서 argv[0]에 들어갑니다. | 문제는 0번이 아니라 1번 위치를 물었어요.'
 ],'argv[0] 파일명 / argv[1] 첫 입력값');

explainQuestion('b32','목록에 없는 칸을 꺼내려 하면 오류가 나요. 먼저 입력이 있는지 확인하는 코드예요.',
 ['python solution.py만 실행하면 argv에는 보통 파일명 하나만 있어요. 길이는 1입니다.','길이가 2보다 작으면 argv[1]이 없으니 종료해서 잘못된 접근을 막습니다.'],
 lessonTable('입력값이 있나 먼저 보기',['명령','argv의 값','argv[1]'],[['python solution.py','[solution.py]','없음 → IndexError'],['python solution.py 점검','[solution.py, 점검]','점검']]),[
 '자동 대체란 빈 입력 대신 다른 값을 넣어 주는 동작이에요. | 기본 검색어를 쓰려면 코드에서 직접 정해야 해요. | Python이 파일명을 첫 입력값으로 자동 복사하지 않아요.',
 'IndexError는 목록에 없는 위치를 읽으려 할 때 나는 오류예요. | 칸이 0번 하나뿐인데 1번을 꺼내려는 상황이에요. | 키워드를 안 줬을 때 argv[1]을 읽으면 생길 수 있어요.',
 'JSONDecodeError는 JSON 내용을 규칙대로 해석하지 못했을 때의 오류예요. | 쉼표나 따옴표가 잘못된 JSON이 원인일 수 있어요. | 여기서는 JSON을 읽기 전, 입력 목록의 칸 유무 문제예요.',
 '빈 문자열은 길이가 0인 문자열 값이에요. | ""를 명시적으로 전달할 수는 있어요. | 입력을 아예 생략했다고 argv[1]이 자동 생성되지는 않아요.'
 ],'목록 길이 확인 → 값 꺼내기 / 없는 위치는 IndexError');

explainQuestion('b33','“내가 터미널에서 서 있는 폴더”와 “코드 파일이 놓인 폴더”는 다를 수 있어요.',
 ['__file__은 지금 실행 중인 코드 파일의 경로예요.','resolve()로 경로를 정리하고 parent로 그 파일이 들어 있는 폴더를 얻습니다.','그 폴더를 기준으로 자료.json을 찾으면 다른 폴더에서 실행해도 위치가 일정해요.'],
 lessonTable('터미널은 A폴더, 스크립트는 B폴더에 있다면',['표현','기준'],[['Path.cwd()','A폴더: 현재 작업 위치'],['Path(__file__).resolve().parent','B폴더: 코드 파일 위치']]),[
 '파일 경로의 parent는 그 파일을 담은 폴더예요. | B폴더/solution.py의 parent는 B폴더입니다. | 코드 옆 자료를 찾으려는 목적과 맞아요.',
 'cwd는 현재 작업 폴더예요. | A폴더에서 B폴더의 코드를 실행하면 cwd는 A폴더일 수 있어요. | 실행한 위치에 따라 달라져 코드 옆 자료를 놓칠 수 있어요.',
 'argv[1]은 실행할 때 넘긴 첫 입력 문자열이에요. | 검색어 "점검"일 수도 있어요. | 입력값이 코드 파일의 위치를 뜻하는 것은 아니에요.',
 '파일명만 쓴 상대 경로는 현재 작업 위치를 기준으로 해석해요. | "자료.json"에는 B폴더라는 정보가 없어요. | 스크립트가 놓인 폴더를 자동으로 알아내지 못해요.'
 ],'코드 옆 파일 찾기 → __file__ 기준 / cwd는 실행 위치');

explainQuestion('b34','모듈은 필요한 기능을 모은 도구 상자예요. 여기서는 네 도구의 담당 업무를 구분해요.',
 ['sys는 명령행 입력, json은 JSON 자료 읽기, csv는 CSV 출력에 씁니다.','pathlib은 파일과 폴더의 위치를 다룹니다. 문제에 적힌 업무 순서에 맞춰 연결해요.'],
 lessonTable('업무와 도구의 짝',['할 일','도구','예'],[['명령행 입력','sys','argv[1]'],['JSON 읽기','json','load(f)'],['CSV 쓰기','csv','DictWriter'],['경로 처리','pathlib','Path']]),[
 'json은 JSON 읽기, sys는 실행 관련 정보를 다뤄요. | 입력 키워드는 sys.argv에서 가져옵니다. | 처음 두 역할부터 뒤집혀 있고, CSV·경로 담당도 바뀌었어요.',
 'csv는 CSV 입출력 도구예요. | 표를 쉼표로 구분해 저장할 때 씁니다. | 첫 업무인 명령행 입력은 csv가 아니라 sys가 맡아요.',
 'pathlib은 파일 위치를 다루는 도구예요. | 코드 옆의 자료 파일 경로를 만들 때 씁니다. | 명령행 입력부터 시작하는 문제의 순서와 맞지 않아요.',
 'sys·json·csv·pathlib이 각 업무에 순서대로 대응해요. | 입력 받기 → 자료 읽기 → 표 출력 → 경로 처리입니다. | 네 도구의 담당 업무를 모두 맞게 연결했어요.'
 ],'입력 sys / JSON json / CSV csv / 경로 pathlib');

explainQuestion('b35','같은 파일도 “지금 프로그램을 실행하는 경우”와 “다른 코드가 도구로 가져가는 경우”가 있어요.',
 ['직접 실행하면 __name__이 "__main__"이어서 조건이 참이 됩니다.','import로 가져오면 이 조건이 거짓이어서 조건문 안의 main() 호출을 건너뜁니다. 함수 정의 자체는 가져올 수 있어요.'],
 lessonTable('이 조건문 안의 main()은 언제 실행될까요?',['사용 방법','조건','main() 호출'],[['python solution.py','참','실행'],['다른 파일에서 import solution','거짓','이 호출은 건너뜀']]),[
 '함수 정의는 할 일을 이름 붙여 준비하는 것이에요. | def main():으로 만들어도 main()을 불러야 실행돼요. | main이라는 이름만으로 자동 실행되는 것은 아니에요.',
 '직접 실행과 import는 파일을 쓰는 서로 다른 방식이에요. | 실행 프로그램으로 쓸지, 기능을 가져올지의 차이예요. | 이 조건문이 바로 두 경우의 호출 여부를 다르게 만듭니다.',
 '직접 실행할 때만 이 안의 호출을 수행해요. | 실행하면 main(), import하면 이 줄은 건너뛰어요. | 조건문의 의도를 정확히 읽었어요.',
 'import할 때만 호출하는 것은 반대 방향의 설명이에요. | __main__ 값은 직접 실행할 때 사용돼요. | 호출되는 경우와 건너뛰는 경우가 뒤집혔어요.'
 ],'if __name__ == "__main__": → 직접 실행할 때');

explainQuestion('b36','JSON은 자료를 글자로 적는 형식이고, load는 그 글을 Python이 다룰 자료로 바꿔 읽어요.',
 ['f는 이미 열어 둔 파일입니다. 따라서 파일을 받는 json.load(f)를 사용해요.','loads의 s는 문자열 입력을 구분해서 기억하면 편해요. loads는 파일 객체가 아니라 JSON 문자열 등을 받아요.'],
 lessonTable('입력 종류부터 구분',['손에 있는 것','읽는 기능'],[['열어 둔 파일 f','json.load(f)'],['JSON 문자열 \'{"건수":3}\'','json.loads(문자열)']]),[
 'mkdir은 폴더를 만드는 기능이에요. | Path("결과").mkdir()로 결과 폴더를 만들 수 있어요. | 열린 파일의 JSON 내용을 읽는 동작이 아니에요.',
 'json.load는 파일에서 JSON을 읽어요. | {"건수":3}을 읽으면 키로 값을 꺼낼 수 있는 Python 자료가 돼요. | f가 파일 객체이므로 입력 종류가 맞아요.',
 'json.loads는 JSON을 담은 문자열 등을 해석해요. | f.read()로 읽어 온 문자열이라면 loads에 넣을 수 있어요. | 문제의 f 자체는 문자열이 아니라 열린 파일이에요.',
 'DictWriter는 딕셔너리 자료를 CSV로 쓰는 도구예요. | 장·제목·본문을 CSV 열로 출력합니다. | JSON 파일을 읽는 기능이 아니에요.'
 ],'JSON 파일은 load / JSON 문자열은 loads');

explainQuestion('b37','in은 글 속에 찾는 말이 들어 있는지를 검사해요. 여기서는 본문만 봅니다.',
 ['keyword가 "점검"이라면 "안전 점검을 실시" 안에 포함되므로 참이에요.','item["본문"]이라고 지정했기 때문에 제목에만 있으면 이 조건은 참이 되지 않아요.'],
 lessonTable('키워드가 점검일 때',['제목','본문','조건 결과'],[['공지','안전 점검을 실시','참'],['점검 계획','이번 주에 시행','거짓'],['안내','점검','참']]),[
 '부분 포함은 긴 문장 속에 단어가 있어도 인정해요. | "안전 점검을 실시"에 "점검"이 있어요. | in의 뜻과 본문 검사 위치를 모두 맞게 읽었어요.',
 '전체 일치는 ==로 검사할 수 있어요. | "안전 점검" == "점검"은 거짓이에요. | in은 글 전체가 같을 필요가 없어요.',
 '제목과 본문은 별개의 항목이에요. | 제목만 점검이고 본문에 없을 수도 있어요. | 이 코드는 ["본문"]만 검사해요.',
 '모든 장을 고르려면 조건 없이 전체를 쓰면 돼요. | 검색어 없는 장도 포함하는 방식이에요. | in 검사는 포함되지 않은 장을 거짓으로 구분해요.'
 ],'keyword in 본문 = 그 글이 본문 안에 있나요?');

explainQuestion('b38','set은 중복 없는 목록을 만들고, Counter는 각 이름이 몇 번 나왔는지 세어요.',
 ['A·A·B를 set으로 보면 {A, B} 두 종류만 남습니다.','Counter는 A가 두 번, B가 한 번 나왔다는 횟수를 보관합니다.'],
 lessonTable('같은 목록을 다른 목적으로 보기',['원본','set으로 종류','Counter로 횟수'],[['A · A · B','A, B → 2종류','A:2, B:1']]),[
 '3은 원본 항목 전체 개수예요. | A 두 개와 B 한 개를 각각 세면 3이에요. | set은 중복 A를 합쳐 2종류로 만들어요.',
 'A:1, B:1은 각 종류를 한 번씩만 적은 횟수예요. | 중복을 없앤 뒤 세면 이런 결과가 돼요. | 원본의 Counter는 A가 두 번 나왔음을 남겨야 해요.',
 'set 개수와 등장 횟수가 모두 원본과 달라요. | 원본에는 A가 두 번, B가 한 번 있어요. | 3종류도 아니고 B가 두 번인 것도 아니에요.',
 '종류는 2개, 횟수는 A 2번·B 1번이에요. | len(set(...))과 Counter(...)가 각각 이 정보를 줘요. | 중복 제거와 횟수 집계의 역할을 정확히 나눴어요.'
 ],'set = 어떤 종류? / Counter = 각 종류가 몇 번?');

explainQuestion('b39','정규식은 “이 모양에 맞는 글을 찾아라”라고 적는 검색 규칙이에요.',
 ['「와 」는 바깥 경계 표시를 찾습니다.','[^」]+는 닫는 표시 」가 아닌 글자를 한 글자 이상 읽으라는 뜻이에요.','() 안은 결과로 꺼낼 부분이고, findall은 맞는 부분을 전부 찾습니다. 그래서 괄호 안 이름 두 개가 나와요.'],
 lessonTable('검색 규칙을 조각으로 읽기',['조각','하는 일'],[['「','시작 표시 찾기'],['([^」]+)','닫는 표시 전까지의 내용을 꺼내기'],['」','끝 표시 찾기'],['결과','기본법 / 시행령']]),[
 '두 이름 사이까지 한 덩어리로 잡은 결과예요. | 첫 「에서 마지막 」까지 이어 읽은 모양이에요. | [^」]가 첫 번째 닫는 표시 앞에서 멈추므로 이렇게 이어지지 않아요.',
 '첫 번째 이름만 찾은 결과예요. | 기본법 하나만 들어 있어요. | findall은 두 번째로 맞는 시행령도 모두 찾아요.',
 '각 괄호 안의 이름을 따로 꺼낸 결과예요. | ["기본법", "시행령"]이 됩니다. | 두 번의 검색과 () 안 내용 반환을 모두 반영했어요.',
 '바깥 표시까지 포함한 결과예요. | "「기본법」"에는 경계 기호가 남아 있어요. | 이 패턴에는 () 묶음이 있어 그 안의 이름만 반환해요.'
 ],'findall = 전부 찾기 / () = 꺼낼 부분 / [^」] = 」 제외');

explainQuestion('b40','숫자가 다르다고 바로 오류는 아니에요. 같은 대상을 같은 기준으로 말했는지 먼저 봐요.',
 ['2024년 인원 100명과 2025년 인원 120명은 다른 사실일 수 있어요.','같은 연도·대상·단위인데 100명과 120명이라면 어디에 쓰였는지 기록하고 원본을 대조해야 합니다.'],
 lessonFlow('정합성: 같은 사실이 일관적인가?','연도·대상·단위 맞추기','같은 사실의 숫자 비교','다르면 위치와 차이 기록','근거로 확인·수정'),[
 '등장 횟수는 몇 번 적혔는지예요. | "인원"이 보고서에 5번 나왔다고 셀 수 있어요. | 값이 서로 맞는지까지 알려 주지는 않아요.',
 '정합성 점검은 같은 사실을 서로 대조하는 일이에요. | 같은 사업·연도의 100명과 120명을 페이지 위치와 함께 기록해요. | 무엇이 충돌하는지 확인하고 근거로 해결할 수 있어요.',
 '큰 숫자를 고르는 것은 근거를 확인하는 방법이 아니에요. | 120이 더 커도 100이 실제 값일 수 있어요. | 유리한 값을 임의로 남기면 오류를 숨길 수 있어요.',
 '다른 연도는 비교 조건이 다른 자료예요. | 2024년 100명, 2025년 120명은 둘 다 맞을 수 있어요. | 같은 사실인지 확인하지 않고 모두 오류로 보면 안 돼요.'
 ],'같은 사실인지 확인 → 값 비교 → 위치·근거 기록');

explainQuestion('b41','인코딩은 글자를 컴퓨터가 저장하고 다시 읽는 약속이에요. BOM은 그 약속을 알아보게 돕는 표시예요.',
 ['utf-8-sig는 UTF-8 내용 맨 앞에 BOM이라는 표시를 붙여 저장합니다.','일부 프로그램이 이를 보고 UTF-8 글자로 해석하는 데 도움을 받아요. 열의 값이나 CSV 구분자를 바꾸는 기능은 아닙니다.'],
 lessonFlow('글자 앞에 작은 안내 표식을 붙이기','utf-8: 글자 데이터','utf-8-sig: BOM 표식 + 글자 데이터','읽는 프로그램이 UTF-8 인식'),[
 'BOM은 파일 맨 앞에 붙는 인코딩 관련 표식이에요. | UTF-8임을 알아보는 데 이 표시를 쓰는 프로그램이 있어요. | utf-8-sig의 핵심 차이를 설명했어요.',
 'cp949는 UTF-8과 다른 글자 저장 방식이에요. | 같은 한글도 저장되는 바이트가 달라질 수 있어요. | utf-8-sig는 UTF-8 계열이며 cp949로 바꾸지 않아요.',
 '자료형은 값이 숫자인지 글자인지 같은 구분이에요. | "001"을 글자로 둘지 숫자 1로 바꿀지의 문제예요. | BOM 표식을 붙인다고 모든 열이 숫자가 되지는 않아요.',
 '구분자는 열 사이를 나누는 문자예요. | CSV는 보통 쉼표, TSV는 탭을 씁니다. | 인코딩 설정과 열 구분 문자 설정은 서로 달라요.'
 ],'utf-8-sig = UTF-8 + 맨 앞 BOM 표식');

explainQuestion('b42','CSV는 첫 줄에 열 이름을 쓰고, 그 아래에 실제 자료를 줄마다 적는 표예요.',
 ['fieldnames는 열 순서를 장·제목·본문으로 정합니다.','writeheader()는 열 이름 한 줄, writerows()는 자료 여러 줄을 씁니다.'],
 lessonTable('출력 결과를 위에서 아래로 보기',['단계','출력되는 내용'],[['fieldnames 지정','열 순서: 장, 제목, 본문'],['writeheader 한 번','장,제목,본문'],['writerows','1,개요,보고서 내용…']]),[
 'writerows는 여러 자료 행을 쓰는 기능이에요. | 첫 자료인 "1,개요,…"부터 저장해요. | writeheader를 생략해서 열 이름 줄이 빠져요.',
 'json.dump는 자료를 JSON 형식으로 저장해요. | [{"장":1,…}]처럼 JSON 규칙으로 적습니다. | 이름을 .csv로 붙여도 내용이 CSV 표로 바뀌지는 않아요.',
 '매번 writeheader를 하면 자료 사이에 열 이름이 계속 나와요. | 열 이름 → 자료1 → 열 이름 → 자료2가 됩니다. | 헤더는 맨 위에 한 번만 써야 해요.',
 '열 순서 결정 → 열 이름 → 실제 자료 순서예요. | 장·제목·본문 헤더 아래에 각 장의 내용이 놓입니다. | 열 순서와 헤더 한 번 쓰기 조건을 모두 만족해요.'
 ],'fieldnames 순서 → writeheader 한 번 → writerows 자료');

explainQuestion('b43','SQL은 저장된 표에 “조건에 맞는 자료를 찾아 계산해 줘”라고 요청하는 언어예요.',
 ['WHERE는 어떤 행을 고를지 정합니다. 온라인안내가 가능인 행만 고릅니다.','COUNT(*)는 그렇게 선택된 행이 몇 개인지 셉니다.'],
 lessonTable('가능인 서비스만 골라 세기',['서비스','온라인안내','개수에 포함'],[['가','가능','1'],['나','불가능','0'],['다','가능','1'],['COUNT(*) 결과','','2건']]),[
 'SELECT 서비스명은 서비스 이름들을 꺼내 보여줘요. | "가, 나, 다" 같은 이름 목록을 얻습니다. | 가능 조건도 없고 건수도 계산하지 않아요.',
 'WHERE로 고르는 값이 불가능인 경우예요. | 위 표에서는 나 한 건을 셉니다. | 요청은 가능한 서비스의 건수예요.',
 'WHERE로 가능인 행을 고른 뒤 COUNT(*)로 세어요. | 가와 다, 2건이 나옵니다. | 조건과 집계가 모두 맞아요.',
 '조건 없는 COUNT(*)는 전체 행 수예요. | 위 표에서는 3건이 나옵니다. | 불가능인 행까지 포함해 버려요.'
 ],'WHERE = 조건으로 고르기 / COUNT(*) = 선택된 행 세기');

explainQuestion('b44','분야별 건수는 같은 분야를 한 바구니에 모아 각 바구니의 개수를 세는 일이에요.',
 ['GROUP BY 안내분야로 교육·복지처럼 묶습니다.','COUNT(*)가 각 묶음 안의 서비스 수를 셉니다.'],
 lessonTable('서비스를 분야별 바구니에 넣기',['안내분야','서비스 예','COUNT(*)'],[['교육','가, 나','2'],['복지','다','1']]),[
 'GROUP BY에 쓰는 항목이 묶음의 기준이에요. | 서비스명으로 묶으면 이름별 묶음이 됩니다. | 분야별로 세려면 안내분야로 묶어야 해요.',
 '안내분야로 묶고 각 묶음의 행 수를 세는 SQL이에요. | 교육 2건, 복지 1건처럼 나옵니다. | 요청한 기준과 계산이 정확히 맞아요.',
 'GROUP BY 없는 전체 COUNT(*)는 총건수 하나예요. | 교육·복지를 합친 3건이에요. | 분야별로 나뉜 결과가 없어요.',
 'ORDER BY는 결과를 정렬하는 기능이에요. | 교육·교육·복지 순으로 보여줄 수 있어요. | 같은 분야를 한 묶음으로 집계하거나 건수를 세지는 않아요.'
 ],'GROUP BY = 같은 항목끼리 묶기 / ORDER BY = 순서 정렬');

explainQuestion('b45','표의 제목 줄은 사람이나 사업 한 건이 아니에요.',
 ['CSV 첫 줄이 "이름,부서"라면 그 줄은 열 설명인 헤더입니다.','헤더까지 자료로 저장하면 진짜 100건에 가짜 자료 한 건이 더해져 101건이 됩니다.'],
 lessonTable('파일의 줄과 데이터 건수를 구분',['파일 내용','자료로 셀까요?'],[['이름,부서 ← 헤더','아니요'],['홍길동,총무 ← 실제 자료','예'],['실제 자료 100행 + 헤더 1줄','데이터는 100건']]),[
 '헤더는 열의 이름을 설명하는 줄이에요. | "이름,부서"를 사람 한 명으로 세면 안 돼요. | 실제보다 1건 많아진 현상을 직접 설명해요.',
 '그룹 집계는 같은 항목끼리 묶어 계산하는 일이에요. | 부서별 인원을 세면 부서 수만큼 결과가 나와요. | 항상 한 행을 덧붙인다는 규칙은 없어요.',
 'COUNT(*)는 행 수를 세며 중복 행도 각각 셉니다. | 같은 값의 두 행이 있어도 2건이에요. | 중복을 자동 제거해서 1건을 더 만드는 동작은 아니에요.',
 'SQL은 입력된 행을 기준으로 계산해요. | 100행이 제대로 들어갔다면 COUNT(*)는 100이에요. | 기본적으로 첫 데이터 행을 두 번 읽는 규칙은 없어요.'
 ],'헤더는 열 설명 / 데이터 건수에서 제외');

explainQuestion('b46','화면에서 찾는 일과 Python으로 파일을 자동 처리하는 일은 실행하는 곳이 달라요.',
 ['브라우저는 HTML로 화면 구조를 보여주고 JavaScript로 검색 같은 동작을 수행합니다.','Python 자동화는 Python 실행 환경에서 파일을 읽고 결과를 만드는 식으로 실행합니다.'],
 lessonTable('두 결과물의 담당을 구분',['사용하는 곳','도구','하는 일'],[['웹브라우저','HTML·JavaScript','목록 표시, 검색'],['Python 실행 환경','solution.py','자료 추출, CSV 저장']]),[
 '파일 링크는 그 주소를 열거나 다운로드하게 해요. | HTML에 solution.py 링크를 만들 수는 있어요. | 링크만 적는다고 일반 정적 페이지가 Python 코드를 실행하지는 않아요.',
 'URL은 접속할 주소이고 Python 파일은 실행할 코드예요. | 검색 페이지 주소만으로 자동 추출 코드가 제공되지는 않아요. | 두 기능을 요구했다면 각각의 결과물이 필요해요.',
 'JSON은 담겨 있는 자료예요. | 제목과 본문 목록을 JSON에 넣을 수 있어요. | 그중 검색어에 맞는 것을 고르는 동작은 코드로 구현해야 해요.',
 '브라우저 기능과 Python 자동화의 실행 역할을 구분한 답이에요. | 웹에서 검색하고 Python으로 CSV를 생성해요. | 두 요구를 각각 맞는 실행 환경에서 구현해요.'
 ],'웹 검색 = HTML/JS / 파일 자동 처리 = Python 실행');

explainQuestion('b47','내 계정으로 보는 것과 다른 사람이 웹페이지 안에서 보는 것은 조건이 달라요.',
 ['iframe은 다른 페이지를 내 페이지 안의 창처럼 보여주는 HTML 요소예요.','방문자도 읽을 권한이 있어야 하고, 주소와 서비스 설정이 페이지 안 표시를 허용해야 합니다.'],
 lessonFlow('시트를 페이지 안에 보여주려면','다른 사람도 읽을 수 있나?','게시·임베드에 맞는 주소인가?','페이지 안 표시가 허용되나?','방문자 환경에서 확인'),[
 '링크는 눌러서 다른 페이지로 이동하는 방식이에요. | 시트 사이트가 새 탭에서 열립니다. | 현재 페이지 안에 표시하는 임베드와는 다른 결과예요.',
 '파일명과 페이지 제목은 화면에 보이는 이름이에요. | 둘 다 "업무표"라고 적을 수 있어요. | 이름이 같아도 접근 권한이나 표시 허용이 생기지 않아요.',
 '방문자 권한과 임베드 조건을 함께 확인해야 해요. | 나는 보이지만 로그아웃한 방문자는 접근 거부일 수 있어요. | 이 상황에서 실제로 실패할 수 있는 조건을 점검해요.',
 '내 로그인 상태는 내 권한만 보여줘요. | 소유자인 나는 비공개 시트도 볼 수 있어요. | 같은 확인만 반복하면 다른 사람의 접속 문제를 놓쳐요.'
 ],'본인 접속 성공 ≠ 방문자·iframe 표시 성공');

explainQuestion('b48','배포는 다른 사람이 인터넷 주소로 들어오게 만드는 일이에요. 내 PC에서 성공한 것만으로 끝나지 않아요.',
 ['페이지가 요청하는 JSON 등의 파일도 서버에 올바른 경로로 있어야 해요.','방문자 권한으로 데이터가 읽히는지, 검색과 임베드까지 실제로 작동하는지 확인합니다.'],
 lessonFlow('방문자가 사용하는 순서대로 확인','공개 URL 열기','자료 파일 응답 확인','검색해 결과 확인','임베드 표시 확인'),[
 '제목이 보인다는 것은 기본 화면이 열린다는 뜻이에요. | 제목 아래 결과 목록은 비어 있을 수 있어요. | 자료 읽기와 검색 성공까지 증명하지 못해요.',
 '경로·응답·권한과 실제 기능을 함께 점검해요. | JSON 요청이 404인지, 로그인 없이도 읽히는지 확인합니다. | 다른 사용자에게 데이터가 안 보이는 원인을 찾는 데 맞는 검사예요.',
 '로컬은 내 PC의 파일과 실행 환경이에요. | 내 디스크에만 있는 data.json은 내 PC에서는 보일 수 있어요. | 서버에도 같은 자료가 있는지 별도로 확인해야 해요.',
 '내 로그인 세션은 방문자보다 권한이 많을 수 있어요. | 내 계정만 볼 수 있는 자료는 방문자에게 보이지 않아요. | 일반 방문자 상태에서도 확인해야 해요.'
 ],'배포 확인 = URL + 자료 + 권한 + 실제 기능');

explainQuestion('b49','“제목 또는 본문”은 둘 중 한 곳만 맞아도 선택하라는 뜻이에요.',
 ['OR는 조건 하나만 참이어도 참이에요. AND는 두 조건이 모두 참이어야 해요.','먼저 OR로 고른 목록을 만들고, 그 목록의 길이를 결과 건수로 보여줍니다.'],
 lessonTable('검색어가 어느 곳에 있나요?',['제목에 있음','본문에 있음','OR 결과','AND 결과'],[['예','아니요','포함','제외'],['아니요','예','포함','제외'],['예','예','포함','포함'],['아니요','아니요','제외','제외']]),[
 'OR로 고른 뒤 결과 길이를 세면 실제 검색 건수가 돼요. | 10건 중 3건이 맞으면 화면에도 3건이라고 표시해요. | 포함 조건과 결과 수가 모두 정확해요.',
 'AND는 양쪽 모두에 검색어가 있어야 해요. | 제목에만 있으면 빠집니다. | 조건이 너무 좁고, 원본 길이는 검색 결과 수도 아니에요.',
 '제목만 검색하면 본문에만 있는 자료를 놓쳐요. | 제목 "안내", 본문 "안전 점검"은 점검 검색에서 빠져요. | 검사할 범위도 잘못됐고 결과 건수도 원본 길이로 세면 안 돼요.',
 '고정 건수는 검색과 관계없이 같은 숫자를 보여줘요. | 검색 결과가 0건이어도 5건이라고 표시돼요. | 실제 필터 결과의 길이를 사용해야 해요.'
 ],'또는 = OR / 검색 건수 = 검색된 목록의 길이');

explainQuestion('b50','CORS는 브라우저가 “다른 사이트의 자료를 내 코드가 읽어도 되는가?”를 확인하는 규칙이에요.',
 ['내 페이지가 다른 출처의 JSON을 요청하면 그 서버의 허용 응답과 요청 조건이 중요해요.','no-cors로 요청했다고 읽기 권한을 얻는 것은 아니에요. 응답 본문을 JavaScript에서 읽지 못하는 상태가 됩니다.'],
 lessonFlow('다른 출처의 JSON을 읽는 상황','내 웹페이지','다른 서버에 자료 요청','서버의 허용 응답 + 요청 조건 확인','허용되면 코드가 응답 읽기'),[
 'no-cors는 다른 출처 응답을 자유롭게 읽게 해 주는 스위치가 아니에요. | 요청이 가도 응답이 불투명(opaque)해서 JSON 본문을 읽을 수 없어요. | “언제나 JSON을 읽는다”가 틀렸어요.',
 'iframe은 다른 페이지를 표시하는 방식이고 fetch는 코드로 자료를 읽는 요청이에요. | 화면 안 표시가 되더라도 JavaScript의 읽기 요청은 막힐 수 있어요. | 서로 다른 허용 조건을 같은 것으로 보면 안 돼요.',
 'JSON.parse는 이미 가진 JSON 문자열을 자료로 바꾸는 기능이에요. | "{\"건수\":3}"을 해석할 때 씁니다. | 서버 응답을 읽을 권한을 대신 만들어 주지는 못해요.',
 '서버가 어떤 출처의 요청을 허용하는지 확인해야 해요. | 허용 출처 응답 헤더와 인증 등 요청 조건을 점검합니다. | CORS가 실제로 판단하는 조건을 확인하는 답이에요.'
 ],'CORS 허용은 서버 응답과 요청 조건으로 / no-cors는 우회 열쇠 아님');

explainQuestion('o01','자료가 있어야 정리하고 살펴볼 수 있고, 살펴본 뒤 그 의미를 설명할 수 있어요.',
 ['수집은 자료 모으기, 정제는 빈칸·오류 등을 정리하기입니다.','탐색적 분석은 평균·분포·차이를 살피는 일, 시각화는 그림으로 보여주는 일, 해석은 업무상 의미를 설명하는 일이에요.','실제 분석에서는 오가며 반복할 수 있지만, 이 문제는 일반적인 기본 흐름을 묻습니다.'],
 lessonFlow('한 설문조사를 분석한다면','응답 모으기','빈칸·오류 정리','평균·차이 살피기','그래프로 표시','결과가 뜻하는 바 설명'),[
 '자료를 마련한 다음 정리·분석·표현·해석하는 기본 순서예요. | 설문을 모아 오류를 고치고 부서별 차이를 설명합니다. | 각 단계가 다음 단계의 바탕이 되는 흐름이에요.',
 '해석은 분석 결과가 의미하는 바를 설명하는 일이에요. | “왜 이 부서의 만족도가 낮을까?”를 검토해요. | 기본 흐름에서 자료 정리와 특징 확인보다 해석을 앞세웠어요.',
 '시각화는 자료를 그림으로 나타내는 일이에요. | 실제 수치로 막대그래프를 그립니다. | 아직 자료를 수집하지도 않은 단계보다 앞에 놓았어요.',
 '정제는 모은 자료의 오류 등을 고치는 일이에요. | CSV의 잘못된 날짜를 고칩니다. | 기본 흐름에서 정리할 자료를 모으는 단계가 먼저 필요해요.'
 ],'모으기 → 정리하기 → 살피기 → 그리기 → 의미 읽기');

explainQuestion('o02','탐색적 분석은 자료를 보면서 “어떤 특징이 있지?” 하고 살펴보는 단계예요.',
 ['평균이 얼마인지, 어떤 값이 많은지, 그룹별로 차이가 있는지 확인합니다.','새 자료를 모으거나 빈칸을 채우는 것이 아니라 이미 정리된 자료의 특징을 보고 있어요.'],
 lessonTable('각 단계에서 던지는 질문',['단계','질문'],[['수집','필요한 자료를 어디서 모을까?'],['결측 대체','비어 있는 칸을 무엇으로 채울까?'],['탐색적 분석','어떤 값이 많고 어떤 차이가 있지?'],['업무 해석','이 결과로 어떤 판단을 할까?']]),[
 '수집은 자료를 모으는 일이에요. | 설문 응답이나 공공 CSV를 가져옵니다. | 문제에서는 이미 가진 자료의 평균과 차이를 확인하고 있어요.',
 '결측 대체는 빠진 값을 다른 값으로 채우는 일이에요. | 비어 있는 처리기간을 정한 기준으로 채웁니다. | 문제에서 결측 처리는 끝났다고 했어요.',
 '업무 해석은 분석 결과의 의미를 업무와 연결하는 일이에요. | 대기 시간이 긴 창구에 인력을 더 둘지 검토합니다. | 현재 활동은 최종 판단보다 자료의 특징을 살피는 쪽이에요.',
 '탐색적 분석은 요약 수치·분포·차이를 살펴보는 일이에요. | 평균 처리기간과 부서별 차이를 비교합니다. | 문제에 적힌 활동과 정확히 맞아요.'
 ],'EDA(탐색적 분석) = 자료의 특징과 패턴 살펴보기');

explainQuestion('o03','사업마다 숫자 두 개를 한 점의 가로·세로 위치로 바꾸면 두 값의 관계를 볼 수 있어요.',
 ['가로축에 예산, 세로축에 참여인원을 놓습니다.','예산 10·참여 100인 사업은 (10,100)에 점 하나를 찍어요. 이것이 산점도예요.'],
 {kind:'scatter',title:'점 하나 = 사업 하나 · 가로는 예산, 세로는 참여인원'},[
 '히스토그램은 숫자 하나가 어느 구간에 많이 몰렸는지 보여줘요. | 예산 0~10 구간에 사업이 몇 개인지 셉니다. | 예산과 참여인원 두 값의 짝 관계를 직접 나타내는 차트가 아니에요.',
 '막대그래프는 종류별 크기를 비교하기 좋아요. | 교육·복지 분야의 사업 수를 비교합니다. | 사업별 두 숫자의 관계에는 산점도가 더 직접적이에요.',
 '산점도는 한 자료의 두 숫자를 점의 위치로 나타내요. | 예산이 크고 참여도 많으면 점이 오른쪽 위에 놓여요. | 두 수치가 함께 어떤 패턴을 보이는지 살펴볼 수 있어요.',
 '파이 차트는 전체에서 각 부분이 차지하는 비중을 보여줘요. | 전체 예산 중 교육 분야가 30%인지 볼 수 있어요. | 예산·참여인원의 관계를 표시하는 방식은 아니에요.'
 ],'두 숫자의 관계 → 산점도 / 점 하나는 자료 한 건');

explainQuestion('o04','같이 늘어나는 모습만으로 “한쪽이 다른 쪽의 원인”이라고 확정할 수는 없어요.',
 ['예산이 큰 사업에 참여자가 많은 패턴은 함께 변하는 관계, 즉 상관입니다.','큰 행사라서 예산과 참여자가 둘 다 많을 수도 있어요. 예산을 늘린 효과인지 확인하려면 다른 조건도 검토해야 합니다.'],
 lessonFlow('관찰과 원인 판단 사이에 한 단계가 더 필요해요','예산↑인 사업에서 참여도↑','함께 변하는 패턴 관찰','행사 규모 등 다른 조건 검토','원인인지 추가 확인'),[
 '일반적인 사업별 산점도의 점은 사업 한 건을 뜻해요. | 점 하나가 그 사업의 예산·인원 조합이에요. | 모든 사업의 평균을 뜻하는 것은 아니에요.',
 '상관은 같이 변함, 인과는 한쪽이 다른 쪽을 변화시킴이에요. | 큰 행사 규모가 두 값을 함께 높였을 수도 있어요. | 관찰한 관계와 아직 확인하지 않은 원인을 구분했어요.',
 '인과를 확정하면 예산을 올린 것이 참여 증가를 일으켰다고 말하는 거예요. | 다른 조건이 같을 때 예산 변화의 효과를 확인할 필요가 있어요. | 산점도만으로 반드시 증가한다고 단정할 수 없어요.',
 '가로·세로축은 서로 다른 단위를 쓸 수 있어요. | 가로는 원, 세로는 명으로 표시합니다. | 단위가 다르다고 두 값의 관계를 볼 수 없는 것은 아니에요.'
 ],'같이 변한다(상관) ≠ 원인이라고 확정(인과)');

explainQuestion('o05','움직이고 정보를 확인하는 차트와 저장된 그림 파일은 달라요.',
 ['Plotly는 마우스를 올려 값을 보고 확대하는 등 상호작용을 넣을 수 있는 차트 도구예요.','PNG로 저장한 차트는 일반적인 이미지 파일이라, 이미지 자체에 점별 hover 정보가 들어 있지 않아요.'],
 lessonTable('필요한 기능과 결과물',['도구·결과물','할 수 있는 일'],[['Plotly 웹 차트','점 정보 보기, 확대 등'],['NumPy','배열·수치 계산'],['차트를 PNG로 저장','정적인 그림 보기']]),[
 'Plotly는 상호작용 차트를 만드는 라이브러리예요. | 점 위에 마우스를 올려 사업명과 예산을 봅니다. | 웹에서 hover·zoom을 제공하려는 요구와 맞아요.',
 'NumPy는 숫자 배열을 계산하는 도구예요. | 많은 수의 합이나 배열 연산을 계산합니다. | 그 자체가 hover·zoom 웹 차트 라이브러리는 아니에요.',
 'matplotlib는 차트를 그리는 도구지만 PNG 출력물은 그림 파일이에요. | 보고서에 붙일 막대그래프 이미지로 저장합니다. | 문제는 도구 전체가 아니라 “저장한 PNG”여서 점별 상호작용이 없어요.',
 'seaborn은 통계 차트를 그리는 도구지만 PNG 출력물은 정적 이미지예요. | 분포 차트를 사진처럼 저장합니다. | PNG 자체로는 요구한 점별 hover·zoom 기능을 구현하지 못해요.'
 ],'상호작용 웹 차트 → Plotly / PNG는 정적 그림');

explainQuestion('o06','hover는 마우스를 어떤 요소 위에 올려놓는 동작이에요.',
 ['클릭하지 않고 점 위에 마우스를 올립니다.','그 점의 사업명과 수치가 작은 안내 상자에 나타나면 hover 정보 표시예요.'],
 lessonTable('차트에서 하는 행동으로 구분',['행동','이름'],[['점 위에 마우스 올려 값 보기','hover'],['차트를 크게·작게 보기','zoom'],['보는 영역을 옆으로 이동','pan'],['특정 부서만 남겨 보기','필터']]),[
 'zoom은 확대·축소예요. | 밀집한 점들을 더 크게 봅니다. | 점 위에 올려 정보 상자를 띄우는 행동과 달라요.',
 'pan은 현재 보는 영역을 이동하는 동작이에요. | 확대된 차트를 끌어 오른쪽 부분을 봅니다. | 해당 점의 정보를 보여주는 동작이 아니에요.',
 '필터는 조건에 맞는 자료만 남기는 일이에요. | 교육 분야 사업만 표시합니다. | 점을 골라 제외한 것이 아니라 정보를 잠깐 보여준 상황이에요.',
 'hover 정보 표시는 마우스 아래 요소의 세부 값을 보여줘요. | 점의 사업명과 정확한 참여인원이 나타납니다. | 문제에서 설명한 동작과 같아요.'
 ],'올려서 정보 보기 hover / 확대 zoom / 이동 pan');

explainQuestion('o07','프롬프트는 AI에게 시키는 말이에요. “누구의 관점으로?”를 정하면 역할을 준 거예요.',
 ['“공공 데이터 분석가”는 AI가 답할 때 취할 전문적인 관점입니다.','아직 어떤 작업을 하거나 어떤 모양으로 출력하라는 말은 아니에요.'],
 lessonTable('AI에게 주는 네 가지 정보',['요소','쉬운 질문','예'],[['역할','누구처럼 답해?','데이터 분석가로서'],['맥락','어디에 왜 써?','부서 회의 자료로'],['작업','무엇을 해?','보고서를 요약해'],['출력 형식','어떤 모양으로?','표로 보여줘']]),[
 '작업은 AI가 해야 할 일이에요. | 요약해 줘, 비교해 줘처럼 행동을 지정해요. | 분석가의 관점은 할 일보다 어떤 역할로 답할지에 해당해요.',
 '출력 형식은 결과의 모양이에요. | 표, 목록, 세 문장처럼 지정합니다. | 문제의 문장에는 결과 모양이 없어요.',
 '역할은 답할 때의 관점이나 전문성이에요. | 데이터 분석가처럼 판단해 달라고 정합니다. | “분석가의 관점”이라는 표현이 역할 지정이에요.',
 '맥락은 사용 상황이나 배경이에요. | 내일 부서 회의에서 쓸 자료라는 설명입니다. | 누가 쓰고 왜 필요한지보다 전문가 역할을 지정한 문장이에요.'
 ],'누구처럼 = 역할 / 어떤 상황 = 맥락 / 할 일 = 작업');

explainQuestion('o08','한 문장 안에서도 배경·할 일·결과 모양을 각각 구분하면 쉬워요.',
 ['“회의에 쓸 자료”는 사용 배경이므로 맥락입니다.','“요약해”는 할 일이므로 작업, “표로”는 결과 모양이므로 출력 형식입니다.'],
 lessonFlow('문장을 세 덩어리로 읽기','회의에 쓸 자료 → 맥락','보고서 요약 → 작업','표로 보여줘 → 출력 형식'),[
 '작업은 할 일, 출력 형식은 결과 모양, 역할은 답할 관점이에요. | 요약은 일이고 표는 모양이에요. | 세 요소를 서로 다른 자리로 잘못 연결했어요.',
 '배경·행동·모양을 차례로 구분한 답이에요. | 회의용이라는 배경에서 요약한 표를 요청합니다. | 문장 안의 세 정보와 각각 맞아요.',
 '역할은 전문가 같은 관점을 지정하는 말이에요. | "회의용" 대신 "회의 진행자 관점으로"라면 역할에 가까워요. | 사용 목적을 역할로, 요약을 배경으로, 표를 작업으로 잘못 읽었어요.',
 '출력 형식은 표나 목록처럼 결과가 생긴 모양이에요. | 회의라는 장소·상황은 출력 모양이 아니에요. | 회의·요약·표를 모두 잘못 연결했어요.'
 ],'회의용: 배경 / 요약: 할 일 / 표: 결과 모양');

explainQuestion('o09','노코드는 화면의 설정이나 블록을 조합해서 직접 코드를 쓰는 부담을 줄이는 방식이에요.',
 ['프로토타입은 기능과 사용 흐름을 시험해 보는 시제품입니다.','노코드 도구에서도 제공하는 목록·검색 기능을 설정해 시제품을 만들 수 있고, 만든 뒤 실제로 잘 되는지 확인해야 해요.'],
 lessonFlow('노코드로 시제품 만들기','도구에서 화면·블록 선택','자료와 조건 연결','작동하는 시제품','사용해 보고 수정'),[
 '설정과 블록으로 기능을 구성하면 직접 작성할 코드가 줄어들어요. | 표 자료를 연결하고 검색 칸을 설정합니다. | 노코드의 구현 방식을 정확히 설명해요.',
 '검색은 도구가 제공하는 기능을 설정해 구현할 수도 있어요. | 검색 컴포넌트에 제목 열을 연결할 수 있어요. | 직접 코드를 안 쓴다고 검색이 항상 불가능한 것은 아니에요.',
 '시제품은 시험하고 개선하기 위한 결과물이에요. | 사용자가 실제로 자료를 찾을 수 있는지 확인합니다. | 만들었다는 이유로 검증을 생략하면 안 돼요.',
 '노코드도 컴퓨터 안의 자료를 사용해요. | 온라인 표나 데이터베이스를 연결할 수 있어요. | 종이에만 기록한다는 뜻이 아니에요.'
 ],'노코드 = 설정·블록으로 구현 부담 줄이기 / 검증은 필요');

explainQuestion('o10','화면이 만들어진 것과 검색이 정확한 것은 별개예요. 답을 아는 검색어로 확인해 보세요.',
 ['원본에서 “주차”에 맞는 자료가 3건인지 먼저 확인합니다.','시제품에서도 같은 검색어로 3건이 나오고 내용이 맞는지 비교합니다. 없는 검색어가 0건인지도 확인할 수 있어요.'],
 lessonFlow('정답을 알고 시험하기','원본에서 기대 결과 확인','시제품에 검색어 입력','건수·내용 비교','다르면 원인 수정'),[
 '화면 생성은 버튼과 목록 등이 보이는 상태예요. | 검색 버튼은 있지만 눌러도 결과가 안 바뀔 수 있어요. | 외형만으로 검색 정확성을 알 수 없어요.',
 '기능 목록은 도구가 지원한다고 설명한 내용이에요. | "검색 가능"이라고 안내되어 있을 수 있어요. | 내가 연결한 자료와 조건이 맞는지는 실제로 실행해야 알 수 있어요.',
 '페이지 제목은 화면의 이름이에요. | "민원 검색"을 "빠른 검색"으로 바꾸는 작업입니다. | 검색 조건이나 누락 자료 문제를 고치지 못해요.',
 '기대하는 결과와 실제 결과를 비교하는 기능 검증이에요. | 원본 3건과 화면 3건의 내용이 같은지 봅니다. | 원하는 검색이 정확히 동작하는지 확인해요.'
 ],'원본의 기대 결과 ↔ 실제 검색의 건수·내용 비교');

explainQuestion('o11','CSV는 “표를 어떻게 구분해 적었는지”, 인코딩은 “글자를 어떻게 저장했는지”예요.',
 ['.csv라는 확장자만으로 글자가 UTF-8인지 cp949인지 알 수는 없어요.','저장할 때 쓴 글자 약속과 읽을 때의 약속을 맞춰야 한글을 제대로 읽습니다.'],
 lessonFlow('저장한 약속과 읽는 약속 맞추기','표 내용','UTF-8 또는 cp949로 저장','실제 인코딩 확인','같은 encoding으로 읽기'),[
 'cp949도 한글과 숫자 등을 표현하는 글자 인코딩이에요. | 한글이 든 공공 CSV가 cp949로 저장될 수 있어요. | 숫자만 저장할 수 있다는 설명은 틀려요.',
 '파일 이름과 파일 안 글자의 인코딩은 별개예요. | "한글명.csv" 내용이 UTF-8일 수도 있어요. | 이름에 한글이 있다는 이유로 cp949라고 확정할 수 없어요.',
 '저장된 실제 인코딩과 읽기 설정을 맞춰야 해요. | cp949 파일이면 그에 맞는 encoding으로 읽습니다. | CSV 형식과 문자 저장 방식을 구분한 설명이에요.',
 '확장자는 파일 형식을 구별하는 이름표예요. | .csv는 표를 담은 형식을 나타내지만 인코딩을 고정하지 않아요. | 모든 CSV가 UTF-8이라는 보장은 없어요.'
 ],'CSV 형식과 문자 인코딩은 별개 / 실제 저장 방식에 맞춰 읽기');

explainQuestion('o12','UnicodeDecodeError는 파일의 바이트를 지정한 글자 규칙으로 읽지 못했다는 신호예요.',
 ['UTF-8로 읽었지만 실제 파일이 cp949라면 글자 해석에 실패할 수 있어요.','원본의 저장 인코딩을 확인하고 맞는 encoding으로 다시 읽습니다. 파일 손상 여부도 상황에 따라 확인해요.'],
 lessonFlow('내용을 지우기 전에 읽는 방법부터 확인','UTF-8 읽기 실패','원본 인코딩 확인','맞는 encoding 지정','글자가 제대로 보이는지 확인'),[
 '평균 대체는 숫자 빈칸을 채우는 작업이에요. | 처리기간 빈칸을 20으로 채웁니다. | 파일을 글자로 읽지 못하는 문제와는 다른 단계예요.',
 'encoding은 파일의 글자를 어떤 규칙으로 읽을지 정해요. | 원본이 cp949라면 encoding="cp949"로 읽습니다. | 저장 방식과 읽는 방식이 다른지 먼저 점검하는 답이에요.',
 '문자 삭제는 자료 일부를 버리는 일이에요. | 한글 이름 일부가 사라질 수 있어요. | 읽기 설정 문제일 수 있는데 내용을 무조건 없애면 손실을 만들어요.',
 '확장자를 바꾸는 것은 이름표를 바꾸는 일이에요. | .csv를 .xlsx라고 이름만 바꿔도 파일 내용은 그대로예요. | 실제 파일 형식이나 인코딩을 자동 변환하지 않아요.'
 ],'글자 해석 오류 → 원본 인코딩과 encoding부터 점검');

explainQuestion('o13','MVP는 꼭 필요한 기능으로 먼저 써 보고 “이게 도움이 되나?”를 확인하는 제품이에요.',
 ['검색 서비스라면 일단 자료 목록과 검색이 작동하도록 만들어요.','꾸미기나 부가 기능을 모두 완성하기 전에 실제 사용자가 자료를 잘 찾는지 확인합니다.'],
 lessonTable('무엇을 확인하려는지로 구분',['이름','확인할 것','예'],[['PoC','기술적으로 가능한가?','문서에서 글자 추출이 되는지 시험'],['MVP','실제로 쓸 가치가 있는가?','핵심 검색 기능으로 사용자에게 써 보게 함'],['화면 시안','어떻게 보일까?','버튼 배치 그림']]),[
 'MVP는 핵심 기능으로 사용 가치를 확인하는 최소 기능 제품이에요. | 검색만 먼저 만들어 자료 찾는 시간을 줄이는지 봅니다. | 문제의 정의와 약어가 일치해요.',
 'PoC는 아이디어나 기술이 실현 가능한지 확인하는 검증이에요. | PDF에서 원하는 정보를 추출할 수 있는지 시험합니다. | 실제 사용 가치를 확인하는 최소 기능 제품이라는 설명은 MVP예요.',
 '완성 제품은 계획한 기능과 품질을 갖춰 제공하는 제품을 뜻해요. | 여러 부가 기능까지 갖춘 서비스일 수 있어요. | 핵심만 먼저 검증한다는 최소 기능 제품의 약어가 아니에요.',
 '화면 시안은 화면 배치나 모양을 제안하는 그림이에요. | 검색창 위치를 그린 그림만 있을 수 있어요. | 작동하는 핵심 기능으로 가치를 확인하는 제품과 달라요.'
 ],'PoC = 가능한지 / MVP = 핵심 기능이 쓸모 있는지');

explainQuestion('o14','해결할 문제가 “자료를 찾기 어렵다”라면 먼저 자료를 찾을 수 있게 만들어야 해요.',
 ['핵심 자료 목록과 검색이 있어야 사용자가 원하는 자료를 찾을 수 있습니다.','실제로 찾아보게 하고 성공 여부를 확인하면 MVP의 가치를 검증할 수 있어요.'],
 lessonFlow('문제에서 핵심 기능을 고르기','자료 찾기가 오래 걸림','목록 + 검색 먼저 구현','사용자가 자료 찾기','성공 여부로 가치 확인'),[
 '부가 기능은 핵심 문제 해결 외에 추가하는 기능이에요. | 프로필 꾸미기나 여러 테마를 먼저 만들 수 있어요. | 모든 부가 기능을 기다리면 핵심 가치를 빨리 검증하지 못해요.',
 '장식은 화면을 보기 좋게 만드는 요소예요. | 색과 애니메이션을 다듬습니다. | 검색이 없으면 자료를 찾기 어렵다는 문제를 해결하기 어려워요.',
 '버튼 이름은 동작을 안내하는 글자예요. | "검색"이라고 적어도 클릭 결과가 없을 수 있어요. | 이름을 정한 것만으로 기능 검증이 끝나지 않아요.',
 '목록·검색은 원하는 자료를 찾는 데 직접 필요한 기능이에요. | 사용자가 문서 이름을 찾아 실제로 열어 봅니다. | 해결할 문제와 검증할 기능이 연결되어 있어요.'
 ],'해결할 문제 → 꼭 필요한 기능 → 실제로 써 보고 확인');

explainQuestion('o15','정답이 “얼마인가?” 같은 숫자라면 회귀를 떠올리세요.',
 ['과거 시설 정보와 실제 사용료라는 정답을 함께 주고 배우게 합니다. 이것이 지도학습이에요.','새 시설의 12,000원 같은 숫자 크기를 예측하므로 지도 회귀입니다.'],
 lessonTable('모델에게 어떤 답을 원하나요?',['원하는 결과','학습할 정답','방법'],[['사용료 12,000원','과거 실제 사용료','지도 회귀'],['정상 또는 노쇼','과거 정상·노쇼 표시','지도 분류'],['비슷한 이용 패턴끼리 묶기','미리 정한 정답 없음','군집']]),[
 '군집은 정답 없이 비슷한 자료끼리 집단을 찾는 방법이에요. | 이용 패턴이 비슷한 시설을 모읍니다. | 실제 사용료라는 숫자 정답을 배워 예측하는 문제와 달라요.',
 '규칙 기반 처리는 사람이 정한 조건대로 분류하는 일이에요. | 이름에 "체육"이 있으면 체육 폴더로 옮깁니다. | 과거 사용료를 학습해 새 숫자를 예측하는 방식이 아니에요.',
 '지도 회귀는 숫자 정답을 배우고 새 숫자 크기를 예측해요. | 시설 면적 등을 보고 예상 사용료를 냅니다. | 이미 아는 사용료를 배우고 새 사용료를 예측하므로 맞아요.',
 '지도 분류는 미리 정한 종류 중 하나를 예측해요. | 정상인지 노쇼인지 고릅니다. | 사용료 금액 자체를 예측하므로 분류보다 회귀예요.'
 ],'정답을 주고 배우기 = 지도 / 숫자 크기 예측 = 회귀');

explainQuestion('o16','군집은 정답 이름을 먼저 알려주지 않고 “비슷한 것끼리 모아 봐”라고 하는 학습이에요.',
 ['시설을 주중 이용형·주말 이용형 같은 패턴으로 묶고 싶다고 해 볼게요.','정답 종류를 미리 붙여 주지 않았으므로 지도 분류·회귀가 아니라 군집에 해당해요.'],
 lessonTable('누가 묶음 기준을 알려주나요?',['방법','모델에 주는 것','결과'],[['군집','이용 패턴 자료, 정답 없음','서로 비슷한 집단'],['지도 분류','자료 + 정답 종류','새 자료의 종류'],['지도 회귀','자료 + 숫자 정답','새 자료의 숫자']]),[
 '지역코드별 분리는 사람이 이미 정한 코드대로 묶는 일이에요. | 11인 시설은 서울 묶음으로 넣습니다. | 이용 모습의 비슷함을 학습해 집단을 발견하는 과정이 아니에요.',
 '군집은 미리 정한 정답 없이 유사한 자료를 모아요. | 이용 시간·횟수가 비슷한 시설을 한 집단으로 찾습니다. | 문제의 “정답 종류 없이 비슷하게 묶기”와 맞아요.',
 '지도 분류는 정답 종류를 알려주고 배우게 해요. | 과거 자료에 정상·노쇼를 붙여 학습합니다. | 문제에서는 미리 정한 정답이 없다고 했어요.',
 '지도 회귀는 숫자 정답을 알려주고 배우게 해요. | 기존 사용료를 배워 새 사용료를 예측합니다. | 숫자 하나를 맞히는 대신 비슷한 집단을 찾으려는 문제예요.'
 ],'정답 없이 비슷한 집단 찾기 = 군집');

explainQuestion('o17','교차표는 “시설 종류 × 이용 결과”의 만나는 칸마다 몇 건인지 세어 놓은 표예요.',
 ['세로에는 회의실·체육관을, 가로에는 정상·노쇼를 놓습니다.','회의실이면서 노쇼인 예약을 세어 그 두 항목이 만나는 칸에 적어요. 기본 건수 교차표를 만드는 함수가 pd.crosstab입니다.'],
 lessonTable('설명용 교차표: 만나는 칸이 두 조건의 건수',['시설 종류','정상','노쇼'],[['회의실','7','3 ← 회의실이면서 노쇼'],['체육관','4','1']]),[
 'crosstab은 두 기준의 조합별 개수를 표로 만들어요. | 회의실·노쇼가 겹치는 예약 3건을 한 칸에 적습니다. | 두 종류를 교차해 건수를 세려는 목적에 맞아요.',
 'merge는 공통 열을 기준으로 두 표를 붙이는 함수예요. | 예약표에 시설코드가 같은 시설 주소를 붙입니다. | 조합별 예약 건수를 세는 교차표와는 다른 작업이에요.',
 'read_csv는 CSV 파일을 읽어 표로 가져오는 함수예요. | 예약.csv를 Python 안의 표로 읽어요. | 읽기만 할 뿐 시설·결과별 개수를 집계하지 않아요.',
 'to_datetime은 날짜·시간으로 해석해 변환하는 함수예요. | "2026-01-01"을 날짜로 다룰 수 있게 바꿉니다. | 두 기준의 건수를 세는 기능이 아니에요.'
 ],'두 기준의 조합별 건수 표 = pd.crosstab');

explainQuestion('o18','교차 빈도표 한 칸은 행 조건과 열 조건을 “동시에” 만족하는 건수예요.',
 ['“회의실” 행을 따라가서 “노쇼” 열과 만나는 칸을 찾습니다.','그 값 3은 회의실에서 생긴 노쇼 3건이에요. 행 전체나 열 전체의 합계가 아닙니다.'],
 lessonTable('문제의 3을 주변 합계와 비교해 보기 · 다른 칸은 설명용',['시설','정상','노쇼','시설 전체'],[['회의실','7','3 ← 질문한 칸','10'],['체육관','4','1','5'],['전체','11','4','15']]),[
 '회의실 전체는 회의실 행의 모든 결과를 더해야 해요. | 설명용 표에서는 7+3=10건이에요. | 노쇼 칸 하나만으로 회의실 전체 건수를 말할 수 없어요.',
 '전체 노쇼는 노쇼 열의 모든 시설 값을 더해야 해요. | 설명용 표에서는 3+1=4건이에요. | 회의실 칸은 다른 시설의 노쇼를 포함하지 않아요.',
 '비율은 건수를 전체 건수로 나눈 값이에요. | 회의실 예약이 10건이면 3/10=30%예요. | 기본 빈도표의 숫자 3은 건수이지 자동으로 3%가 아니에요.',
 '행과 열의 조건이 함께 맞는 경우를 뜻해요. | 회의실이면서 노쇼인 예약 3건입니다. | 교차 빈도표의 한 칸을 정확히 읽었어요.'
 ],'교차표 한 칸 = 행 조건 AND 열 조건의 건수');

explainQuestion('o19','IQR은 전체 폭이 아니라 가운데 50% 구간의 폭이에요.',
 ['작은 값부터 줄을 세웠을 때 Q1은 아래 25% 지점, Q3는 아래 75% 지점의 값이에요.','Q1=20에서 Q3=50까지의 폭은 50−20=30입니다.'],
 {kind:'iqr',title:'가운데 구간의 오른쪽 끝에서 왼쪽 끝을 빼요',q1:20,q3:50},[
 '35는 Q1과 Q3 두 숫자의 산술평균이에요. | (20+50)÷2=35입니다. | 구간의 폭을 구하려면 평균이 아니라 차이를 구해요.',
 '50은 오른쪽 끝인 Q3 자체예요. | 구간이 0에서 시작한 것은 아니에요. | 왼쪽 끝 20을 빼야 실제 폭이 나와요.',
 '30은 Q3에서 Q1을 뺀 차이예요. | 50−20=30입니다. | IQR의 계산 방법과 맞아요.',
 '70은 두 경계값을 더한 값이에요. | 50+20=70입니다. | 거리나 폭은 끝점에서 시작점을 빼야 해요.'
 ],'IQR = Q3−Q1 = 가운데 50% 구간의 폭');

explainQuestion('o20','“가운데 구간의 폭”과 “처음부터 끝까지의 폭”을 구별하는 문제예요.',
 ['IQR은 Q3−Q1 = 50−20 = 30입니다.','전체 범위는 최댓값−최솟값 = 100−0 = 100입니다.'],
 {kind:'iqr',title:'두 구간의 양 끝을 각각 확인',min:0,max:100,q1:20,q3:50},[
 'Q1과 Q3라는 위치의 값을 그대로 답으로 고른 경우예요. | Q1=20, Q3=50이에요. | 폭은 그 값 자체가 아니라 양 끝의 차이예요.',
 'IQR과 전체 범위의 양 끝을 각각 올바르게 뺐어요. | 가운데는 50−20, 전체는 100−0입니다. | 30과 100이 맞아요.',
 '두 구간의 계산 결과를 뒤집은 답이에요. | 100은 전체 폭, 30은 가운데 폭이에요. | IQR과 전체 범위의 이름이 서로 바뀌었어요.',
 '50은 Q3, 80은 최댓값에서 Q1을 뺀 값이에요. | 100−20=80입니다. | IQR도 전체 범위도 정해진 양 끝의 차이가 아니에요.'
 ],'가운데 폭 Q3−Q1 / 전체 폭 최대−최소');

explainQuestion('x01','숫자가 어느 구간에 몰렸는지 볼 때와, 이름이 다른 대상의 점수를 비교할 때는 차트가 달라요.',
 ['처리기간은 0~5일·5~10일처럼 구간으로 나눠 몇 건인지 보는 히스토그램이 알맞아요.','모델 A·B·C의 F1은 각 모델을 막대 하나로 두고 높이로 점수를 비교하면 좋아요. F1은 내가 고른 답의 정확함과 실제 정답을 놓치지 않는 정도를 함께 반영한 점수예요.'],
 lessonTable('보려는 것이 분포인가, 대상별 크기인가?',['자료','그리는 방법','차트'],[['처리기간','기간 구간마다 몇 건인지','히스토그램'],['모델별 F1','모델 이름마다 점수 높이','막대그래프']]),[
 '히스토그램은 수치 구간의 빈도, 막대그래프는 종류별 크기를 보여줘요. | 0~5일 구간 8건 / 모델 A F1 0.8처럼 봅니다. | 두 질문에 맞는 차트를 골랐어요.',
 '파이는 전체 중 비중, 산점도는 두 숫자의 관계를 보여줘요. | 예산 구성 비중이나 예산·참여인원 관계에 사용합니다. | 기간의 구간 분포와 모델별 단일 점수 비교에 맞는 조합이 아니에요.',
 '워드클라우드는 단어의 빈도 등을 글자 크기로 나타내요. | 많이 등장한 민원 키워드를 크게 보여줍니다. | 처리기간은 단어가 아니고, 모델 F1도 합이 100%인 구성 비중이 아니에요.',
 '히스토그램은 모델 이름별 점수가 아니라 점수 구간의 빈도를 보여줘요. | F1 0.7~0.8인 모델 수를 세는 모양이 돼요. | 원한 것은 각 모델의 점수를 직접 비교하는 것이에요. 기간도 구간 분포 목적에는 히스토그램이 맞아요.'
 ],'수치 구간의 분포 → 히스토그램 / 종류별 크기 → 막대');

explainQuestion('x02','과적합은 연습 문제를 너무 세세하게 외워서 새 문제에는 오히려 약해지는 상태예요.',
 ['DecisionTree는 질문을 가지처럼 나눠 답을 고르는 모델이에요. 깊이는 질문을 얼마나 여러 단계로 나누는지 나타냅니다.','깊이를 늘려 학습 점수만 오르고 새 자료인 검증 점수가 떨어지면 과적합을 의심합니다.','깊이를 줄이는 등 복잡도를 조절하고 검증 점수로 비교합니다.'],
 lessonTable('설명용 점수: 연습과 새 문제의 차이',['트리 깊이','학습 점수','검증 점수'],[['얕음','80','78'],['적당함','90','84'],['매우 깊음','100','70 ← 과적합 의심']]),[
 '학습 점수는 이미 보고 배운 자료에서의 점수예요. | 외운 문제에서 100점을 받을 수 있어요. | 새 자료에 약해진 신호를 무시하면 안 돼요.',
 '정답을 X에 넣는 것은 답을 미리 알려주는 누출이에요. | 시험 문제지에 답을 써 넣는 셈이에요. | 점수를 정당하게 높이는 해결책이 아니에요.',
 '테스트는 최종 성능 확인용으로 따로 남겨 둔 자료예요. | 그 자료로 학습하면 새 시험지 역할을 잃어요. | 모델의 과적합 문제를 해결하기보다 평가를 망가뜨려요.',
 '복잡도를 조절하면 학습 자료의 세부 내용에만 맞추는 것을 줄일 수 있어요. | 트리 깊이를 줄여 검증 점수가 나아지는지 봅니다. | 학습·검증 점수의 차이를 보고 적절하게 대응해요.'
 ],'학습 점수↑, 검증 점수↓ → 과적합 의심');

explainQuestion('x03','문자열을 공백에서 자르면 단어 목록이 되고, 0번은 그 목록의 첫 단어예요.',
 ['str.split()이 주소를 공백 기준으로 나눕니다.','str[0]이 각 주소의 나뉜 단어 중 첫 번째인 경기도를 고릅니다.'],
 lessonTable('주소를 나눈 뒤 번호 붙이기',['위치','0','1','2','3'],[['단어','경기도','양주시','화합로1426번길','39'],['str[0] 선택','선택','','','']]),[
 '화합로1426번길은 공백으로 나눈 세 번째 단어예요. | 이 예시에서는 위치 번호가 2입니다. | 코드의 [0]은 첫 번째 단어를 뜻해요.',
 '주소 전체는 나누기 전 문자열이에요. | "경기도 양주시 화합로1426번길 39"입니다. | split 후 첫 항목을 골랐으므로 전체가 남지 않아요.',
 '경기도는 나눈 목록의 0번 항목이에요. | Python은 첫 위치를 0으로 셉니다. | split 후 str[0]의 결과가 맞아요.',
 '양주시는 두 번째 단어예요. | 이 예시에서 str[1]을 쓰면 나옵니다. | [0]과 [1]을 구분해야 해요.'
 ],'split = 나누기 / [0] = 첫 항목');

explainQuestion('x04','긴 코드는 한 줄씩 “값이 무엇으로 바뀌나?”를 따라가면 읽을 수 있어요.',
 ['str[:4]는 날짜의 앞 네 글자, 예를 들어 "2019"를 꺼냅니다.','astype(int)는 글자로 된 연도를 숫자로 바꿉니다.','>=2020은 2020도 포함합니다. 마지막 astype(int)는 거짓을 0, 참을 1로 바꿉니다.'],
 lessonTable('날짜 → 연도 숫자 → 조건 → 라벨',['날짜','연도','2020 이상?','라벨'],[['2019-12-31','2019','거짓','0'],['2020-01-01','2020','참','1'],['2025-07-30','2025','참','1']]),[
 '2019·2020·2025는 첫 줄에서 구한 year예요. | 날짜에서 연도를 꺼내 숫자로 바꾼 중간 결과입니다. | 문제는 두 번째 줄까지 처리한 label을 물었어요.',
 '조건에 맞으면 1, 아니면 0으로 바꾼 결과예요. | 2019는 0, 2020과 2025는 1이에요. | 연도 추출과 경계값 포함을 모두 반영했어요.',
 '2020을 0으로 처리하면 “2020 초과”를 검사한 셈이에요. | >2020이라면 2020은 거짓이에요. | 코드는 >=2020이어서 2020도 참입니다.',
 '참과 거짓의 숫자를 뒤집은 결과예요. | 참은 1, 거짓은 0으로 변환해요. | 2019가 1이 되고 이후가 0이 되지는 않아요.'
 ],'날짜 앞 4글자 → 숫자 연도 → 조건 비교 → 0·1');

explainQuestion('x05','먼저 계산할 대상을 고르고, 그다음 그 대상의 글자 수를 평균 내요.',
 ['loc[조건, "건물명"]은 조건에 맞는 행에서 건물명 열만 고릅니다.','str.len()은 건물명마다 글자 수를 구합니다.','mean()은 그 길이 숫자들의 평균을 구해요.'],
 lessonTable('최근인 건물만 남겨 계산 · 설명용 예',['최근 여부','건물명','글자 수','평균에 포함'],[['1','시청','2','예'],['0','복지회관','4','아니요'],['1','도서관','3','예']]),[
 '대상 고르기 → 필요한 글자 선택 → 길이 계산 → 평균 순서예요. | 최근 건물 시청·도서관의 길이 평균은 (2+3)/2=2.5예요. | 코드의 각 단계를 정확히 읽었어요.',
 'count는 빈칸 아닌 이름의 개수예요. | 시청·도서관은 이름 2개예요. | 글자 수 2·3을 구하지 않아서 평균 길이가 나오지 않아요.',
 '전체 평균은 최근 여부와 무관하게 모두 포함해요. | 복지회관 4글자도 들어갑니다. | 최근_여부=1인 행만 보라는 조건이 빠졌어요.',
 'nunique는 서로 다른 건물명 종류 수예요. | 이름이 서로 다르면 2종류예요. | 이름 길이를 구하는 str.len과 다른 계산이에요.'
 ],'조건에 맞는 행 → 문자열 길이(str.len) → 평균(mean)');

explainQuestion('x06','사업이 없는 지역도 보고 대상이라면 목록에 남아 있어야 해요.',
 ['실제 사업만 모아 집계하면 0건인 지역은 결과에서 아예 빠질 수 있어요.','마스터는 전체 기준 목록이에요. 17개 시도 마스터에 집계를 맞춰 빠진 지역도 표시합니다.','건수는 0으로 표시하고, 0건 지역의 비율 표시는 과제 규칙을 따릅니다. 이 자료에서는 0 표시 규칙을 적용해요.'],
 lessonTable('0건과 누락은 다르게 읽혀요',['기준 지역','집계된 사업','완성 보고서'],[['가도','5건','5건'],['나도','집계 행 없음','0건으로 포함'],['다도','3건','3건']]),[
 '15개만 내면 사업이 있는 지역만 보인 상태예요. | 빠진 두 지역이 0건인지 실수로 누락됐는지 알기 어려워요. | 17개 전체를 보고하라는 요구를 만족하지 못해요.',
 '복사해서 행 수만 맞추면 같은 지역이 중복돼요. | 가도를 두 번 더 넣어도 빠진 나도가 생기지 않아요. | 전체 기준 목록의 각 지역이 정확히 있어야 해요.',
 '다른 지역 평균으로 채우기는 관측하지 않은 값을 만들어 넣는 일이에요. | 사업이 없는데 비율 30%처럼 보일 수 있어요. | 0건 지역은 정해진 0건·비율 표시 규칙을 적용해야 해요.',
 '마스터와 맞추면 사업이 없는 지역도 목록에 남길 수 있어요. | 전체 명단을 먼저 두고 집계 값을 붙입니다. | 빠짐없이 17개를 보고하려는 목적에 맞아요.'
 ],'전체 기준 목록(마스터)에 맞추기 / 0건 지역도 포함');

explainQuestion('x07','“모르는 값”을 0일로 취급하면 평균이 달라져요. 빈칸 제외 규칙을 따라야 해요.',
 ['알려진 처리기간은 10일과 30일, 두 건입니다.','합계 40일을 값이 있는 2건으로 나누면 평균 20일이에요.'],
 lessonFlow('빈칸을 0으로 바꾸지 않고 제외하기','10 · 빈칸 · 30','알려진 값 10과 30','합계 40 ÷ 2건','평균 20일'),[
 '40일은 알려진 값의 합계예요. | 10+30=40입니다. | 평균은 합계를 개수 2로 나눠야 해요.',
 '3은 원본 자료의 자리 수예요. | 10·빈칸·30으로 세 자리가 있어요. | 자리 개수는 처리기간의 평균이 아니에요.',
 '20일은 알려진 두 값의 평균이에요. | (10+30)/2=20입니다. | 결측을 제외하라는 규칙을 정확히 적용했어요.',
 '약 13.3일은 40을 빈칸까지 포함한 3으로 나눈 값이에요. | 빈칸을 0으로 채웠을 때 평균과 같습니다. | 모르는 처리기간을 0일이라고 바꾸라는 규칙이 아니에요.'
 ],'빈칸 제외 평균 = 알려진 값의 합 ÷ 값이 있는 건수');

explainQuestion('x08','한 행을 한 파일에만 배정했다면, 나눈 뒤에도 자료의 총건수는 그대로여야 해요.',
 ['교육 40건·복지 35건·안전 25건으로 나눴다면 합은 100건입니다.','각 파일의 실제 데이터 행 수가 집계표의 해당 건수와 맞는지도 확인합니다.','이것은 기본 검사예요. 중복과 누락이 같은 수로 생길 수도 있으니 행 ID 대조까지 하면 더 확실해요.'],
 lessonFlow('나누기 전과 후의 자료 수 비교','원본 100건','교육 40 + 복지 35 + 안전 25','합계 100건 확인','각 파일 건수 ↔ 집계표 확인'),[
 '첫 파일만 확인하면 그 파일의 상태만 알 수 있어요. | 교육 40건이 맞아도 복지 파일이 빠졌을 수 있어요. | 전체 분할 결과를 검증하려면 모든 파일을 합쳐 봐야 해요.',
 '총건수 보존과 카테고리별 일치를 함께 확인해요. | 40+35+25=100이며 집계표에도 같은 수가 적혀 있는지 봅니다. | 기본적인 누락·집계 오류 점검에 알맞아요.',
 '헤더는 데이터가 아니라 열 이름 줄이에요. | 파일 3개마다 헤더가 있으면 헤더만 3줄이에요. | 헤더를 자료 100건에 섞어서 세면 안 돼요.',
 '파일 수는 카테고리 수에 해당하고, 행 수는 자료 건수예요. | 100건을 카테고리 3개 파일로 나눌 수 있어요. | 자료 한 건당 파일 하나를 만들라는 요구가 아니에요.'
 ],'출력 데이터 건수의 합 = 입력 건수 / 헤더 제외');

explainQuestion('x09','정본은 “이번 작업에서 기준으로 삼기로 정한 원본”이에요.',
 ['보고서에는 전체 사업 중 몇 가지 사례만 소개되어 있을 수 있어요.','전체 합계는 기준으로 지정된 CSV의 해당 행 전체로 계산해야 빠지거나 중복되지 않습니다.'],
 lessonTable('설명용: CSV와 보고서의 역할',['자료','담긴 범위','전체 합계에 사용'],[['정본 CSV','사업 100건 전체','기준으로 사용'],['보고서 MD','그중 대표 사례 5건','이 5건만으로 전체를 대신할 수 없음']]),[
 '정본의 전체 해당 행을 사용하면 요청한 범위로 계산해요. | 기준 CSV의 모든 해당 사업 예산을 합산합니다. | 빠진 사례 없이 지정된 원본을 기준으로 삼았어요.',
 '일부 사례는 전체 중에서 골라 보여준 자료예요. | 100건 중 5건만 소개됐을 수 있어요. | 사례만 합하면 나머지 사업 예산이 빠져요.',
 '최댓값은 가장 큰 사업 하나의 금액이에요. | 100·200·300 중 300을 고릅니다. | 전체 합계 600과는 다른 계산이에요.',
 '같은 사업을 두 자료에서 각각 더하면 중복 계산해요. | CSV의 100만원 사업이 보고서에도 있어 두 번 더할 수 있어요. | 자료가 둘이라고 서로 다른 사업이라는 뜻은 아니에요.'
 ],'전체 집계는 지정된 정본의 해당 범위 / 사례 누락·중복 주의');

explainQuestion('x10','같은 번호표를 순서대로 나눠 줘도 받는 사람의 순서가 바뀌면 결과가 달라져요.',
 ['고정 시드는 같은 조건에서 같은 난수 목록을 다시 만드는 데 사용해요.','난수 0.1·0.9를 A·B 순서로 붙일 때와 B·A 순서로 붙일 때 각 행이 받는 숫자는 달라요.','같은 결과를 내려면 시드 외에 정제된 행과 순서, 난수 생성 조건도 같아야 해요.'],
 lessonTable('같은 난수인데 다른 행에 붙는 예',['행 순서','첫 난수 0.1','둘째 난수 0.9'],[['A → B','A가 받음','B가 받음'],['B → A','B가 받음','A가 받음']]),[
 '행을 바꾸면 난수와 연결되는 대상도 바뀔 수 있어요. | A가 원래 0.1을 받았다가 0.9를 받을 수 있어요. | 시드가 같아도 행 구성·순서가 다르면 라벨이 달라질 수 있어요.',
 '생성 개수와 호출 방식도 난수 사용 조건이에요. | 앞에서 난수를 하나 더 쓰면 뒤에 연결할 값이 달라질 수 있어요. | 개수가 아무 영향도 없다고 단정할 수 없어요.',
 '시드는 무작위 작업을 재현하는 데 쓰는 설정이에요. | 같은 조건과 같은 시드를 다시 써야 같은 결과를 기대할 수 있어요. | 매번 다른 시드를 쓰는 것이 같은 결과를 보장하지 않아요.',
 '같은 결과를 얻으려면 숫자 목록과 행에 붙이는 방식도 같아야 해요. | 같은 정제 결과·행 순서·난수 조건·시드를 사용합니다. | 실제 결과를 결정하는 조건을 함께 확인한 답이에요.'
 ],'같은 결과 = 같은 입력·정리 규칙·행 순서·난수 조건·시드');

explainQuestion('x11','교차검증은 자료를 번갈아 연습용과 확인용으로 써서 여러 번 실력을 보는 방법이에요.',
 ['훈련 자료를 5묶음으로 나눕니다.','첫 번째 묶음을 검증으로 두고 나머지 4묶음으로 배웁니다. 다음에는 두 번째 묶음을 검증으로 바꿉니다.','이렇게 다섯 번의 점수를 모아 설정을 비교해요. 따로 떼어 둔 최종 테스트는 이 선택에 사용하지 않습니다.'],
 lessonTable('5겹 중 앞의 세 번을 펼쳐 보기',['차례','묶음1','묶음2','묶음3','묶음4','묶음5'],[['1회','검증','학습','학습','학습','학습'],['2회','학습','검증','학습','학습','학습'],['3회','학습','학습','검증','학습','학습']]),[
 '최종 테스트는 설정 선택 뒤의 평가용으로 남겨 두는 자료예요. | 시험 점수를 보며 유리한 설정만 고르면 시험에 맞출 수 있어요. | 훈련 자료 안에서 설정을 비교하는 교차검증과 달라요.',
 '5겹의 5는 자료를 나눈 묶음 수예요. | 정상·위험 두 종류라도 5묶음 검증을 할 수 있어요. | 정답 종류를 다섯 개 만들라는 뜻이 아니에요.',
 '매 차례 검증할 묶음을 바꾸고 나머지로 배워요. | 묶음1 검증 → 묶음2 검증처럼 순환합니다. | 여러 분할의 점수를 확인하는 목적과 맞아요.',
 '같은 회차에서 검증 묶음을 학습에도 넣으면 답을 미리 보는 셈이에요. | 1회 검증인 묶음1은 그 회차 학습에서는 빼야 해요. | 다른 회차에서 역할을 바꾸는 것과 같은 회차에 섞는 것은 달라요.'
 ],'5겹 = 다섯 묶음이 검증 역할을 번갈아 담당');

explainQuestion('x12','Pipeline은 전처리와 모델을 한 작업 순서로 묶어, 매번 올바른 자료에서 배우게 도와줘요.',
 ['교차검증의 각 회차마다 학습 묶음과 검증 묶음이 바뀝니다.','Pipeline 전체를 교차검증에 넣으면 매 회차의 학습 묶음에서 스케일러와 모델을 학습합니다.','검증 묶음에는 그때 배운 전처리를 적용해 예측하므로, 검증 자료를 미리 보고 기준을 만드는 실수를 줄여요.'],
 lessonTable('교차검증 한 회차 안에서의 작업',['자료','스케일러','모델'],[['이번 학습 묶음','fit: 기준 배우기 + 변환','fit: 학습'],['이번 검증 묶음','같은 기준으로 transform','predict: 예측']]),[
 'F1은 내 예측의 정확함과 실제 정답을 놓치지 않는 정도를 함께 보는 점수예요. | 모델과 자료에 따라 점수가 달라져요. | Pipeline은 처리 순서를 묶는 도구라 최고 점수를 보장하지 않아요.',
 '전처리 기준도 그 회차의 학습 묶음에서만 배워야 해요. | 학습 평균으로 자를 만든 뒤 검증 자료에 같은 자를 사용합니다. | 전처리와 모델을 함께 교차검증하여 정보 누출을 줄이는 이유예요.',
 '전체 자료로 먼저 fit하면 검증 자료도 평균 등의 기준에 들어가요. | 시험 문제를 미리 보고 자를 만든 셈이에요. | Pipeline을 쓰려는 누출 방지 목적과 반대예요.',
 '정답을 X에 추가하면 모델이 맞혀야 할 답을 미리 받게 돼요. | 위험 여부를 맞히면서 입력에 위험 여부를 넣는 경우예요. | Pipeline의 역할도 아니고 평가를 왜곡하는 누출이에요.'
 ],'Pipeline 전체를 교차검증 → 매 회차 학습 자료에서만 기준 학습');

for(const revision of conceptRevisions)plainLessons[revision.id]={idea:revision.idea,steps:revision.steps,diagram:revision.diagram,remember:revision.remember,choices:revision.choices};
for(const id of Object.keys(plainLessons))if(!focusQuestions.some(q=>q.id===id))delete plainLessons[id];
memoryRows.splice(10,memoryRows.length-10,...conceptMemory.map(([topic,cue,answer],i)=>({id:i+10,scope:topic.startsWith('g')?'gap':'blue',topic,cue,answer})));

const plainChoiceLookup = new Map();
for (const q of focusQuestions) {
  const lesson=plainLessons[q.id];
  if (!lesson || lesson.choices.length!==q.options.length) throw new Error('Missing learning explanation: '+q.id);
  q.options.forEach((option,i)=>plainChoiceLookup.set(option,{...lesson.choices[i],correct:i===q.answer}));
}

function plainDiagram(d) {
  let body='';
  if(d.kind==='flow') body=`<ol class="plain-flow">${d.nodes.map((n,i)=>`<li><span class="plain-step-no">${i+1}</span><strong>${esc(n)}</strong></li>`).join('')}</ol>`;
  if(d.kind==='table') body=`<div class="plain-table-wrap"><table class="plain-table"><thead><tr>${d.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(row=>`<tr>${row.map((v,i)=>i===0?`<th scope="row">${esc(v)}</th>`:`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(d.kind==='scatter') body=`<svg class="plain-svg" viewBox="0 0 620 260" role="img" aria-label="가로축은 예산, 세로축은 참여인원입니다. 사업 하나마다 점 하나를 찍어 두 숫자의 관계를 봅니다."><path d="M70 22V210H580" fill="none" stroke="#61748b" stroke-width="2"/><text x="18" y="28">참여인원</text><text x="530" y="244">예산 →</text><g fill="#4265d6" stroke="#fff" stroke-width="3"><circle cx="125" cy="176" r="8"/><circle cx="190" cy="142" r="8"/><circle cx="235" cy="158" r="8"/><circle cx="310" cy="111" r="8"/><circle cx="372" cy="83" r="8"/><circle cx="440" cy="108" r="8"/><circle cx="520" cy="45" r="8"/></g><path d="M310 111V210M70 111H310" stroke="#93a7cc" stroke-dasharray="5 5" fill="none"/><path d="M317 107L368 62" stroke="#28469e" fill="none"/><text x="375" y="52" class="plain-svg-emphasis">사업 1건</text></svg>`;
  if(d.kind==='iqr') {
    const width=d.q3-d.q1;
    body=`<div class="plain-iqr-equation">IQR = ${d.q3} − ${d.q1} = <strong>${width}</strong></div><div class="plain-iqr-band" role="img" aria-label="Q1 ${d.q1}에서 Q3 ${d.q3}까지 가운데 50퍼센트 구간의 폭은 ${width}입니다."><div><span>Q1</span><b>${d.q1}</b></div><div class="plain-iqr-middle"><b>가운데 50%</b><span>← 폭 ${width} →</span></div><div><span>Q3</span><b>${d.q3}</b></div></div>${d.min===undefined?'':`<div class="plain-full-range"><span>전체: 최소 ${d.min} → 최대 ${d.max}</span><b>전체 폭 = ${d.max} − ${d.min} = ${d.max-d.min}</b></div>`}`;
  }
  return `<figure class="plain-diagram"><figcaption>${esc(d.title)}</figcaption>${body}</figure>`;
}

function plainWorkedExample(q) {
  const lesson=plainLessons[q.id];if(!lesson)return '';
  return `<div class="plain-learning" data-plain-question="${esc(q.id)}"><h4>이 문제에서 배우는 개념</h4><p class="plain-idea">${esc(lesson.idea)}</p>${plainDiagram(lesson.diagram)}<h4>차근차근 풀어보면</h4><ol class="plain-solution">${lesson.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="plain-remember"><span>한 줄로 기억</span><strong>${esc(lesson.remember)}</strong></div><p class="plain-example-note">그림과 작은 예시는 이해를 돕기 위해 구성한 학습용 설명입니다.</p></div>`;
}

function choiceExplanation(o) {
  const c=plainChoiceLookup.get(o);
  if(!c)return `<p class="choice-definition"><span>개념</span>${esc(o.definition)}</p><p class="choice-reason"><span>이 문제에서는</span>${esc(o.reason)}</p>`;
  return `<p class="choice-definition"><span>쉽게 말하면</span>${esc(c.meaning)}</p><p class="choice-example"><span>예를 들면</span>${esc(c.example)}</p><p class="choice-reason"><span>${c.correct?'정답인 이유':'오답인 이유'}</span>${esc(c.why)}</p>`;
}

function plainOptionCards(q,answer) {
  return `<div class="plain-options">${q.options.map((o,i)=>`<section class="plain-option ${i===q.answer?'is-correct':i===answer?'is-selected-wrong':''}" data-option-index="${i}"><h4><span class="plain-letter">${'ABCD'[i]}</span><span>${esc(o.text)}</span></h4><div class="plain-option-status">${i===q.answer?'<span class="plain-tag right">정답</span>':'<span class="plain-tag">오답 선택지</span>'}${i===answer?'<span class="plain-tag selected">내가 고른 답</span>':''}</div>${choiceExplanation(o)}</section>`).join('')}</div>`;
}

function feedback(q,answer) {
  const correct=answer===q.answer;
  return `<section class="feedback plain-feedback" id="feedback" aria-live="polite"><h3 class="${correct?'good':'bad'}">${correct?'✓ 정답입니다.':'선택한 답은 오답입니다.'}</h3><p class="plain-answer-line">정답은 <b>${'ABCD'[q.answer]}. ${esc(q.options[q.answer].text)}</b>입니다.</p>${plainWorkedExample(q)}<h4 class="plain-choices-title">A부터 D까지, 뜻과 이유 함께 보기</h4>${plainOptionCards(q,answer)}<p class="question-origin"><b>문제 근거</b> ${esc(q.sourceDetail)}${questionSourceLinks(q)}</p><button class="btn small" id="review-concept">관련 개념 다시 읽기 →</button></section>`;
}

function reviewCard(q,answer,n) {
  const correct=answer===q.answer,answered=Number.isInteger(answer)&&answer>=0&&answer<q.options.length;
  return `<article class="review-item plain-feedback"><div class="row"><span class="pill ${correct?'green':'extra'}">${n}. ${correct?'정답':answered?'오답':'미응답 / 미채점'}</span><span class="count">${esc(getU(q.unit).title)}</span></div><h3>${esc(q.stem)}</h3>${q.code?`<pre class="question-code"><code>${esc(q.code)}</code></pre>`:''}<p class="plain-answer-line">${answered?`내 답 ${'ABCD'[answer]} · `:'선택한 답 없음 · '}정답 <b>${'ABCD'[q.answer]}. ${esc(q.options[q.answer].text)}</b></p>${plainWorkedExample(q)}<h4 class="plain-choices-title">A부터 D까지, 뜻과 이유 함께 보기</h4>${plainOptionCards(q,answer)}<p class="question-origin"><b>문제 근거</b> ${esc(q.sourceDetail)}${questionSourceLinks(q)}</p><div class="row"><button class="btn small" ${q.focusTopic||q.courseTopic?`data-core="${q.focusTopic||q.courseTopic}"`:`data-learn="${q.unit}"`}>관련 개념 다시 읽기</button></div></article>`;
}

initFocusNavigation();
</script>
<style>
.publication-source-label{color:var(--muted);font-size:.85em;display:inline-block;margin:3px 8px 3px 0;overflow-wrap:anywhere}
.publication-note{max-width:1180px;margin:24px auto;padding:16px 24px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
</style>
<p class="publication-note">웹 학습판 · 원본 가이드와 문제지 PDF는 포함하지 않았습니다. 출처에 표시된 문서와 쪽수는 가지고 있는 배포 자료에서 확인하세요. 학습 기록은 현재 기기의 브라우저에 저장됩니다.</p>
<script>
// Source documents remain on the learner's PC; retain their labels without broken links.
(() => {
  const adaptSourceLinks = () => {
    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(href)) return;
      const label = document.createElement('span');
      label.className = 'publication-source-label';
      label.textContent = a.textContent + ' · 배포 자료 참조';
      label.title = decodeURI(href);
      a.replaceWith(label);
    });
  };
  adaptSourceLinks();
  new MutationObserver(adaptSourceLinks).observe(document.body, {childList:true, subtree:true});
})();
</script>
